apiVersion: v1
kind: Namespace
metadata:
  name: gitea-runners
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    homelab.cooked.beer/owner: sam
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: gitea-jobs
  annotations:
    # Namespaced Kyverno policy enforces restricted PSS with one image-bound
    # SYS_PTRACE allowance for LeakSanitizer. No host namespace or privileged pods.
    homelab.cooked.beer/security-policy: gitea-job-security
  labels:
    homelab.cooked.beer/owner: sam
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: builds
  namespace: gitea-jobs
spec:
  hard:
    pods: "3"
    requests.cpu: "3"
    limits.cpu: "6"
    requests.memory: 6Gi
    limits.memory: 12Gi
    requests.ephemeral-storage: 12Gi
    limits.ephemeral-storage: 24Gi
