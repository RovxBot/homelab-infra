apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: wowdecomp-linux-security
  namespace: wowdecomp-ci-jobs
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  background: true
  webhookConfiguration:
    failurePolicy: Fail
  rules:
  - name: restricted-with-sanitizer-capability
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      failureAction: Enforce
      podSecurity:
        level: restricted
        version: latest
        exclude:
        - controlName: Capabilities
          images:
          - git.cooked.beer/github-dr/wowdecomp-linux-toolchain@sha256:900d148f45038f83e30f6f4bfe3e81f3d6527867239fae1066f9372ff882c812
        - controlName: Running as Non-root
          images:
          - git.cooked.beer/github-dr/wowdecomp-linux-toolchain@sha256:900d148f45038f83e30f6f4bfe3e81f3d6527867239fae1066f9372ff882c812
        - controlName: Running as Non-root user
          images:
          - git.cooked.beer/github-dr/wowdecomp-linux-toolchain@sha256:900d148f45038f83e30f6f4bfe3e81f3d6527867239fae1066f9372ff882c812
  - name: bound-job-environment
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      failureAction: Enforce
      message: Jobs require the pinned toolchain, no API token, no extra containers,
        and explicit resources.
      pattern:
        metadata:
          labels:
            homelab.cooked.beer/owner: sam
        spec:
          automountServiceAccountToken: false
          imagePullSecrets:
          - name: wowdecomp-toolchain-pull
          containers:
          - name: job
            image: git.cooked.beer/github-dr/wowdecomp-linux-toolchain@sha256:900d148f45038f83e30f6f4bfe3e81f3d6527867239fae1066f9372ff882c812
            resources:
              requests:
                cpu: ?*
                memory: ?*
              limits:
                cpu: ?*
                memory: ?*
  - name: one-job-container
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      failureAction: Enforce
      message: Only the job container is allowed; no init or ephemeral containers.
      deny:
        conditions:
          any:
          - key: '{{ length(request.object.spec.containers) }}'
            operator: NotEquals
            value: 1
          - key: '{{ length(request.object.spec.initContainers || `[]`) }}'
            operator: GreaterThan
            value: 0
          - key: '{{ length(request.object.spec.ephemeralContainers || `[]`) }}'
            operator: GreaterThan
            value: 0
  - name: bounded-toolchain-capabilities
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      failureAction: Enforce
      message: Only package installation and private-namespace LSan capabilities are
        allowed.
      foreach:
      - list: request.object.spec.containers[]
        deny:
          conditions:
            any:
            - key: '{{ contains(element.securityContext.capabilities.drop || `[]`,
                ''ALL'') }}'
              operator: NotEquals
              value: true
            - key: '{{ element.securityContext.capabilities.add || `[]` }}'
              operator: AnyNotIn
              value:
              - CHOWN
              - DAC_OVERRIDE
              - FOWNER
              - SETUID
              - SETGID
              - SYS_PTRACE
  - name: no-extra-job-credentials
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      failureAction: Enforce
      message: Only ephemeral volumes and runner-created Secrets are permitted.
      foreach:
      - list: request.object.spec.volumes[]
        deny:
          conditions:
            all:
            - key: '{{ contains(keys(element), ''emptyDir'') }}'
              operator: Equals
              value: false
            - key: '{{ contains(keys(element), ''secret'') }}'
              operator: Equals
              value: false

  - name: no-mounted-registry-credential
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      failureAction: Enforce
      message: The registry credential is for kubelet image pulls only.
      foreach:
      - list: request.object.spec.volumes[]
        deny:
          conditions:
            any:
            - key: '{{ element.secret.secretName || `""` }}'
              operator: Equals
              value: wowdecomp-toolchain-pull

  - name: no-registry-credential-in-environment
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      failureAction: Enforce
      message: The registry credential cannot enter a job environment.
      deny:
        conditions:
          any:
          - key: '{{ request.object.spec.containers[].env[].valueFrom.secretKeyRef.name || `[]` }}'
            operator: AnyIn
            value:
            - wowdecomp-toolchain-pull
          - key: '{{ request.object.spec.containers[].envFrom[].secretRef.name || `[]` }}'
            operator: AnyIn
            value:
            - wowdecomp-toolchain-pull
