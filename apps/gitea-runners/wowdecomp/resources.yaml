apiVersion: v1
kind: Namespace
metadata:
  name: wowdecomp-ci-jobs
  annotations:
    homelab.cooked.beer/security-policy: wowdecomp-linux-security
  labels:
    homelab.cooked.beer/owner: sam
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: linux-builds
  namespace: wowdecomp-ci-jobs
spec:
  hard:
    pods: '4'
    requests.cpu: '8'
    limits.cpu: '12'
    requests.memory: 8Gi
    limits.memory: 32Gi
    requests.ephemeral-storage: 16Gi
    limits.ephemeral-storage: 128Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wowdecomp-linux-runner
  namespace: gitea-runners
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-gitea-retain
  resources:
    requests:
      storage: 2Gi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runner
  namespace: wowdecomp-ci-jobs
rules:
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - create
      - get
      - list
      - delete
  - apiGroups:
      - ''
    resources:
      - pods/exec
    verbs:
      - create
      - get
  - apiGroups:
      - ''
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - create
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runner
  namespace: wowdecomp-ci-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runner
subjects:
  - kind: ServiceAccount
    name: runner
    namespace: gitea-runners
---
apiVersion: v1
kind: Service
metadata:
  name: wowdecomp-linux-runner
  namespace: gitea-runners
spec:
  selector:
    app: wowdecomp-linux-runner
  ports:
    - name: health
      port: 9101
      targetPort: health
    - name: cache
      port: 8088
      targetPort: cache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wowdecomp-linux-runner
  namespace: gitea-runners
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wowdecomp-linux-runner
  template:
    metadata:
      labels:
        app: wowdecomp-linux-runner
    spec:
      serviceAccountName: runner
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: docker.gitea.com/runner:6.0.0@sha256:f9a1f17484398b861c25a763b81febfb394b17b72e0522c25d8067d7b484f347
          command:
            - /bin/bash
            - -ec
          args:
            - |
              umask 077
              cd /data
              if ! test -s /data/.runner; then
                gitea-runner --config /config/config.yaml register --no-interactive \
                  --instance http://gitea-http.gitea.svc.cluster.local:3000 \
                  --name wowdecomp-linux --token "$REGISTRATION_TOKEN"
              fi
              unset REGISTRATION_TOKEN
              exec gitea-runner --config /config/config.yaml daemon
          env:
            - name: HOME
              value: /data
            - name: REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-runner
                  key: token
          ports:
            - name: health
              containerPort: 9101
            - name: cache
              containerPort: 8088
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          volumeMounts:
            - name: state
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: wowdecomp-linux-runner
        - name: config
          configMap:
            name: wowdecomp-linux-runner-config
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
