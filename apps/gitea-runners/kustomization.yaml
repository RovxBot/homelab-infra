apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      homelab.cooked.beer/owner: sam
resources:
  - namespaces.yaml
  - rbac.yaml
  - runner.yaml
  - ../../secrets/gitea-runner.enc.yaml
configMapGenerator:
  - name: gitea-runner-config
    namespace: gitea-runners
    files: [config.yaml]
