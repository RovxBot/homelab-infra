apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: runner-state
  namespace: gitea-runners
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-gitea-retain
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-runner
  namespace: gitea-runners
spec:
  selector:
    app: gitea-runner
  ports:
    - name: health
      port: 9101
      targetPort: health
    - name: cache
      port: 8088
      targetPort: cache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-runner
  namespace: gitea-runners
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitea-runner
  template:
    metadata:
      labels:
        app: gitea-runner
    spec:
      serviceAccountName: runner
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: docker.gitea.com/runner:6.0.0@sha256:f9a1f17484398b861c25a763b81febfb394b17b72e0522c25d8067d7b484f347
          command: [/bin/bash, -ec]
          args:
            - |
              umask 077
              cd /data
              if ! test -s /data/.runner || ! grep -qx github-dr /data/.runner-scope 2>/dev/null; then
                if test -s /data/.runner && ! test -e /data/.runner.pre-primary; then
                  cp -p /data/.runner /data/.runner.pre-primary
                fi
                gitea-runner --config /config/config.yaml register --no-interactive \
                  --instance http://gitea-http.gitea.svc.cluster.local:3000 \
                  --name cooked-linux --token "$REGISTRATION_TOKEN"
                printf '%s\n' github-dr > /data/.runner-scope
              fi
              unset REGISTRATION_TOKEN
              exec gitea-runner --config /config/config.yaml daemon
          env:
            - name: HOME
              value: /data
            - name: REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-runner
                  key: token
          ports:
            - name: health
              containerPort: 9101
            - name: cache
              containerPort: 8088
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: state
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: runner-state
        - name: config
          configMap:
            name: gitea-runner-config
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
