apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoiceninja-mysql
  namespace: invoiceninja
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: invoiceninja-mysql
  template:
    metadata:
      labels:
        app: invoiceninja-mysql
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: mysql:9.7@sha256:f0f0d4591d23106312b3f7fbad8f4062a938a64e3e748c47b8c4347640265182
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_DATABASE
              value: ninja
            - name: MYSQL_USER
              value: ninja
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: invoiceninja-env
                  key: DB_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: invoiceninja-env
                  key: MYSQL_ROOT_PASSWORD
          ports:
            - containerPort: 3306
              name: mysql
          startupProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: invoiceninja-mysql
---
apiVersion: v1
kind: Service
metadata:
  name: invoiceninja-mysql
  namespace: invoiceninja
spec:
  selector:
    app: invoiceninja-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
