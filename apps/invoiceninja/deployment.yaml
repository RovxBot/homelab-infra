apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoiceninja
  namespace: invoiceninja
spec:
  revisionHistoryLimit: 2
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: invoiceninja
  template:
    metadata:
      labels:
        app: invoiceninja
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1500
        runAsGroup: 1500
        fsGroup: 1500
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: invoiceninja
          image: invoiceninja/invoiceninja:5.13.47@sha256:470d1551a9de44ce97e06f124269480282626abf043cff1cdffd112f039bf7bc
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
              name: fastcgi
          startupProbe:
            tcpSocket:
              port: fastcgi
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: fastcgi
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - pgrep
                - php-fpm
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          envFrom:
            - secretRef:
                name: invoiceninja-env
          env:
            - name: TZ
              value: Australia/Adelaide
          volumeMounts:
            - name: public
              mountPath: /var/www/app/public
            - name: data
              mountPath: /var/www/app/storage
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31-alpine@sha256:884e0b7f42f303641b0f4e78755aea647521dca0b89ca3be7992ad78b5c07434
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: public
              mountPath: /var/www/app/public
              readOnly: true
            - name: data
              mountPath: /var/www/app/storage
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: nginx-config
          configMap:
            name: invoiceninja-nginx
        - name: public
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: invoiceninja-data
