apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoiceninja-redis
  namespace: invoiceninja
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: invoiceninja-redis
  template:
    metadata:
      labels:
        app: invoiceninja-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8.8-alpine@sha256:09160599abd229764c0fb44cb6be640294e1d360a54b19985ab4843dcf2d90f1
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
            - --stop-writes-on-bgsave-error
            - "no"
          ports:
            - containerPort: 6379
              name: redis
          startupProbe:
            tcpSocket:
              port: redis
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: redis-data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: redis-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: invoiceninja-redis
  namespace: invoiceninja
spec:
  selector:
    app: invoiceninja-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
