apiVersion: v1
kind: ConfigMap
metadata:
  name: wotlk-authserver-config
data:
  authserver.conf: |
    [authserver]
    LogsDir = ""
    BindIP = "0.0.0.0"
    RealmServerPort = 3724
    LoginDatabaseInfo = "${DB_HOST};${DB_PORT};${DB_USER};${DB_PASSWORD};${DB_AUTH_DB}"

    # Retry short-lived database outages before failing the connection.
    Database.Reconnect.Attempts = 20
    Database.Reconnect.Seconds = 15

    # Authentication settings
    StrictVersionCheck = 0
    AllowLoggingIPAddressesInDatabase = 1
    # Failed-login protection. A zero MaxCount leaves automatic account/IP bans
    # disabled while retaining the upstream thresholds for later use.
    WrongPass.BanTime = 600
    WrongPass.BanType = 0
    WrongPass.Logging = 0
    WrongPass.MaxCount = 0

    # Update settings
    Updates.AllowRehash = 1
    Updates.ArchivedRedundancy = 0
    Updates.CleanDeadRefMaxCount = 3
    # Prepare and apply auth-database updates at startup.
    Updates.AutoSetup = 1
    Updates.EnableDatabases = 1

    # TOTP settings
    TOTPMasterSecret = ""
    # Do not require two-factor authentication for accounts by default.
    EnableTOTP = 0

    # IP Location settings
    IPLocationFile = ""

    # Realm settings
    RealmsStateUpdateDelay = 20
    # Check expired account/IP bans once per minute.
    BanExpiryCheckInterval = 60

    # Network settings
    Network.UseSocketActivation = 0
    EnableProxyProtocol = 0

    # Process settings
    PidFile = ""

    # Database settings
    LoginDatabase.WorkerThreads = 1
    LoginDatabase.SynchThreads = 1

    # MySQL settings
    MySQLExecutable = ""

    # Optional source/build paths used only by development tooling. Empty values
    # keep this container independent of a source checkout.
    SourceDirectory = ""
    TempDir = ""

    # Update settings
    Updates.Redundancy = 1

    # Process settings
    UseProcessors = 0
    ProcessPriority = 0

    # Network settings
    MaxPingTime = 30

    # Logger settings
    Appender.Console=1,5,0,"1 9 3 6 5 8"
    Appender.Auth=2,5,0,Auth.log,w
    Logger.root = 4,Console Auth
