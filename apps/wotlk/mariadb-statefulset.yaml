apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wotlk-mariadb
spec:
  serviceName: wotlk-mariadb
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: wotlk-mariadb
  template:
    metadata:
      labels:
        app: wotlk-mariadb
    spec:
      priorityClassName: wotlk-critical
      containers:
        - name: mysql
          image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
          resources:
            requests:
              cpu: 200m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 6Gi
          ports:
            - name: mysql
              containerPort: 3306
          readinessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wotlk-mariadb-auth
                  key: MARIADB_ROOT_PASSWORD
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: wotlk-mariadb-auth
                  key: MARIADB_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wotlk-mariadb-auth
                  key: MARIADB_PASSWORD
            - name: MYSQL_ROOT_HOST
              value: "%"
          volumeMounts:
            - name: config
              mountPath: /etc/mysql/conf.d
              readOnly: true
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: config
          configMap:
            name: wotlk-mariadb-config
        - name: data
          persistentVolumeClaim:
            claimName: wotlk-mariadb-data
