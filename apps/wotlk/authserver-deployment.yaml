apiVersion: apps/v1
kind: Deployment
metadata:
  name: wotlk-authserver
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: wotlk-authserver
  template:
    metadata:
      labels:
        app: wotlk-authserver
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-01-06T00:27:35Z"
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: metal7
      initContainers:
        - name: db-import
          image: ghcr.io/rovxbot/azerothcore-wotlk:db-import-test-staging-b36369be4461a7bf808d39ba536b4e6bf426e194
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          env:
            - name: TZ
              value: Australia/Adelaide
            - name: AC_DISABLE_INTERACTIVE
              value: "1"
            - name: AC_UPDATES_ENABLE_DATABASES
              value: "1"
            - name: AC_UPDATES_AUTO_SETUP
              value: "1"
            - name: AC_UPDATES_ALLOWED_MODULES
              value: all
            - name: AC_SOURCE_DIRECTORY
              value: /azerothcore
            - name: DB_HOST
              value: wotlk-mariadb-headless.wotlk.svc.cluster.local
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: wotlk-mariadb-auth
                  key: MARIADB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wotlk-mariadb-auth
                  key: MARIADB_PASSWORD
            - name: AC_LOGIN_DATABASE_INFO
              value: "$(DB_HOST);$(DB_PORT);$(DB_USER);$(DB_PASSWORD);acore_auth"
            - name: AC_WORLD_DATABASE_INFO
              value: "$(DB_HOST);$(DB_PORT);$(DB_USER);$(DB_PASSWORD);acore_world"
            - name: AC_CHARACTER_DATABASE_INFO
              value: "$(DB_HOST);$(DB_PORT);$(DB_USER);$(DB_PASSWORD);acore_characters"
            - name: AC_PLAYERBOTS_DATABASE_INFO
              value: "$(DB_HOST);$(DB_PORT);$(DB_USER);$(DB_PASSWORD);acore_playerbots"
          volumeMounts:
            - name: dbimport-etc
              mountPath: /azerothcore/env/dist/etc
            - name: dbimport-logs
              mountPath: /azerothcore/env/dist/logs
        - name: render-config
          image: alpine:3.20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          command:
            - sh
            - -lc
            - |
              set -eu
              escape_sed_replacement() {
                printf '%s' "$1" | sed 's/[\\&|]/\\&/g'
              }

              db_host="$(escape_sed_replacement "$DB_HOST")"
              db_port="$(escape_sed_replacement "$DB_PORT")"
              db_auth_db="$(escape_sed_replacement "$DB_AUTH_DB")"
              db_user="$(escape_sed_replacement "$DB_USER")"
              db_password="$(escape_sed_replacement "$DB_PASSWORD")"

              mkdir -p /etc-out
              sed \
                -e "s|\${DB_HOST}|${db_host}|g" \
                -e "s|\${DB_PORT}|${db_port}|g" \
                -e "s|\${DB_AUTH_DB}|${db_auth_db}|g" \
                -e "s|\${DB_USER}|${db_user}|g" \
                -e "s|\${DB_PASSWORD}|${db_password}|g" \
                /etc-tpl/authserver.conf > /etc-out/authserver.conf
          env:
            - name: DB_HOST
              value: wotlk-mariadb-headless.wotlk.svc.cluster.local
            - name: DB_PORT
              value: "3306"
            - name: DB_AUTH_DB
              value: acore_auth
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: wotlk-mariadb-auth
                  key: MARIADB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wotlk-mariadb-auth
                  key: MARIADB_PASSWORD
          volumeMounts:
            - name: config-tpl
              mountPath: /etc-tpl
              readOnly: true
            - name: etc
              mountPath: /etc-out
        - name: seed-module-config
          image: ghcr.io/rovxbot/azerothcore-wotlk:authserver-test-staging-8e62f68abf072ab01fb8484c774b2dba7a4d76d5
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          command:
            - bash
            - -lc
            - |
              set -euo pipefail
              mkdir -p /azerothcore/env/dist/etc/modules
              shopt -s nullglob
              for f in /azerothcore/env/ref/etc/modules/*.conf.dist; do
                base="$(basename "$f" .dist)"
                cp -n "$f" "/azerothcore/env/dist/etc/modules/$base" || true
              done
          volumeMounts:
            - name: etc
              mountPath: /azerothcore/env/dist/etc
      containers:
        - name: authserver
          image: ghcr.io/rovxbot/azerothcore-wotlk:authserver-test-staging-8e62f68abf072ab01fb8484c774b2dba7a4d76d5
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Australia/Adelaide
            - name: AC_UPDATES_ENABLE_DATABASES
              value: "0"
          ports:
            - name: auth
              containerPort: 3724
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: auth
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: auth
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: etc
              mountPath: /azerothcore/env/dist/etc
            - name: logs
              mountPath: /azerothcore/env/dist/logs
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config-tpl
          configMap:
            name: wotlk-authserver-config
        - name: etc
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: dbimport-etc
          emptyDir: {}
        - name: dbimport-logs
          emptyDir: {}
