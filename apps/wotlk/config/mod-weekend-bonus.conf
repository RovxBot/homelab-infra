[worldserver]

# Percentages are ADDITIONAL rewards: 50 = +50% (1.5x), 100 = +100% (2x).
# Values are rounded to two decimal places, within 0..1000.
WeekendBonus.Enabled = 1
WeekendBonus.Announce = 1

# Requires the bundled client addon for correct buff text.
# The cosmetic marker has no character visual or gameplay effects.
WeekendBonus.BuffEnabled = 1

# "random": shuffled cycles with no consecutive repeats.
# "round-robin": XP -> Reputation -> Money -> Battleground -> Dungeon Finder.
# Disabled events and events with 0% bonus are excluded.
# The same seed, schedule and pool keep selection stable across restarts.
WeekendBonus.Selection = "random"
WeekendBonus.RandomSeed = 20261014

# SERVER LOCAL TIME (Australia/Adelaide via the worldserver TZ environment).
# Sunday = 0, Monday = 1, ..., Friday = 5.
# Default: Friday 00:00 until Monday 00:00.
# StartDay: 0..6; StartHour: 0..23; DurationHours: 1..168.
WeekendBonus.StartDay = 5
WeekendBonus.StartHour = 0
WeekendBonus.DurationHours = 72

# All normal XP sources, below the core's maximum player level.
WeekendBonus.XP.Enabled = 1
WeekendBonus.XP.BonusPercent = 50

# Positive earned reputation. Losses are unchanged.
WeekendBonus.Reputation.Enabled = 1
WeekendBonus.Reputation.BonusPercent = 50

# Looted gold and money actually received from quest rewards.
# Includes shared loot and max-level quest XP-to-money conversion.
# Trades, mail, auctions, vendor sales, refunds and withdrawals are unchanged.
WeekendBonus.Money.Enabled = 1
WeekendBonus.Money.BonusPercent = 50

# Honor from BG kills, objectives and end-of-match rewards.
# Arenas and world PvP are unchanged; the normal honor cap applies.
WeekendBonus.Battleground.Enabled = 1
WeekendBonus.Battleground.BonusPercent = 50

# RDF completion XP and money, including repeat runs.
# Dungeon creature XP, ordinary dungeon quests, items and emblems are unchanged.
WeekendBonus.DungeonFinder.Enabled = 1
WeekendBonus.DungeonFinder.BonusPercent = 50

# Testing / manual selection. Enabled must still be 1.
# AlwaysActive bypasses the weekend window.
# EventOverride: 0 = rotation; 1 = XP; 2 = Reputation; 3 = Money;
#                4 = Battleground; 5 = Dungeon Finder.
# An override must be enabled in the event pool.
WeekendBonus.AlwaysActive = 0
WeekendBonus.EventOverride = 0
