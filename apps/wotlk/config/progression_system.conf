#
# Realm-wide content progression for mod-progression-system.
#
# The enabled brackets are cumulative. Bracket_0 establishes the locked-down
# baseline, and every following enabled bracket unlocks its matching content.
# This realm is set to TBC phase 1: level-70 normal and heroic dungeons,
# Gruul's Lair, Magtheridon's Lair, and Karazhan.
#

[worldserver]

# Load the bracket-specific C++ scripts and database updates.
ProgressionSystem.LoadScripts = 1
ProgressionSystem.LoadDatabase = 1

# Leave disabled during normal operation. Set to 1 only when deliberately
# reapplying the complete active bracket chain to a freshly restored world DB.
ProgressionSystem.ReapplyUpdates = 0

# Baseline and Classic progression.
ProgressionSystem.Bracket_0       = 1
ProgressionSystem.Bracket_1_19    = 1
ProgressionSystem.Bracket_20_29   = 1
ProgressionSystem.Bracket_30_39   = 1
ProgressionSystem.Bracket_40_49   = 1
ProgressionSystem.Bracket_50_59_1 = 1
ProgressionSystem.Bracket_50_59_2 = 1
ProgressionSystem.Bracket_60_1_1  = 1
ProgressionSystem.Bracket_60_1_2  = 1
ProgressionSystem.Bracket_60_2_1  = 1
ProgressionSystem.Bracket_60_2_2  = 1
ProgressionSystem.Bracket_60_3_1  = 1
ProgressionSystem.Bracket_60_3_2  = 1
ProgressionSystem.Bracket_60_3_3  = 1

# TBC levelling, normal dungeons, and heroics.
ProgressionSystem.Bracket_61_64   = 1
ProgressionSystem.Bracket_65_69   = 1
ProgressionSystem.Bracket_70_1_1  = 1
ProgressionSystem.Bracket_70_1_2  = 1

# TBC phase 1 raids: Gruul, Magtheridon, and Karazhan.
ProgressionSystem.Bracket_70_2_1  = 1
ProgressionSystem.Bracket_70_2_2  = 1

# Later TBC and all WotLK brackets remain locked.
ProgressionSystem.Bracket_70_2_3  = 0
ProgressionSystem.Bracket_70_3_1  = 0
ProgressionSystem.Bracket_70_3_2  = 0
ProgressionSystem.Bracket_70_4_1  = 0
ProgressionSystem.Bracket_70_4_2  = 0
ProgressionSystem.Bracket_70_5    = 0
ProgressionSystem.Bracket_70_6_1  = 0
ProgressionSystem.Bracket_70_6_2  = 0
ProgressionSystem.Bracket_70_6_3  = 0
ProgressionSystem.Bracket_71_74   = 0
ProgressionSystem.Bracket_75_79   = 0
ProgressionSystem.Bracket_80_1_1  = 0
ProgressionSystem.Bracket_80_1_2  = 0
ProgressionSystem.Bracket_80_1_3  = 0
ProgressionSystem.Bracket_80_2    = 0
ProgressionSystem.Bracket_80_3    = 0
ProgressionSystem.Bracket_80_4_1  = 0
ProgressionSystem.Bracket_80_4_2  = 0
ProgressionSystem.Bracket_Custom  = 0

# Keep the previous realm's manual Molten Core rune handling and remove the
# Eternal Quintessence cooldown. The two TBC options affect later phases, but
# retain the module's authentic defaults for when those brackets are enabled.
ProgressionSystem.60.MoltenCore.ManualRuneHandling = 1
ProgressionSystem.60.MoltenCore.AqualEssenceCooldownReduction = 60
ProgressionSystem.60.WorldBosses.KazzakPhasing = 1
ProgressionSystem.70.SerpentshrineCavern.RequireAllBosses = 1
ProgressionSystem.70.TheEye.RequireAllBosses = 1

# Do not prematurely clear any restored attunement requirements.
ProgressionSystem.DisabledAttunements = ""
