apiVersion: apps/v1
kind: Deployment
metadata:
  name: wotlk-worldserver
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: wotlk-worldserver
  template:
    metadata:
      labels:
        app: wotlk-worldserver
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-01-06T00:27:35Z"
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
          kubernetes.io/hostname: metal4
      initContainers:
        - name: db-import
          image: ghcr.io/rovxbot/azerothcore-wotlk:db-import-test-staging-470a4d7ee8088a8d442c921bae81af5a2b4a7ad7
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          env:
            - name: TZ
              value: Australia/Adelaide
            - name: AC_DISABLE_INTERACTIVE
              value: "1"
            - name: AC_UPDATES_ENABLE_DATABASES
              value: "14"
            - name: AC_UPDATES_AUTO_SETUP
              value: "1"
            - name: AC_UPDATES_ALLOWED_MODULES
              value: all
            - name: AC_SOURCE_DIRECTORY
              value: /azerothcore
            - name: DB_HOST
              value: wotlk-mariadb-headless.wotlk.svc.cluster.local
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: wotlk-mariadb-auth
                  key: MARIADB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wotlk-mariadb-auth
                  key: MARIADB_PASSWORD
            - name: AC_LOGIN_DATABASE_INFO
              value: "$(DB_HOST);$(DB_PORT);$(DB_USER);$(DB_PASSWORD);acore_auth"
            - name: AC_WORLD_DATABASE_INFO
              value: "$(DB_HOST);$(DB_PORT);$(DB_USER);$(DB_PASSWORD);acore_world"
            - name: AC_CHARACTER_DATABASE_INFO
              value: "$(DB_HOST);$(DB_PORT);$(DB_USER);$(DB_PASSWORD);acore_characters"
            - name: AC_PLAYERBOTS_DATABASE_INFO
              value: "$(DB_HOST);$(DB_PORT);$(DB_USER);$(DB_PASSWORD);acore_playerbots"
          volumeMounts:
            - name: dbimport-etc
              mountPath: /azerothcore/env/dist/etc
            - name: dbimport-logs
              mountPath: /azerothcore/env/dist/logs
        - name: render-config
          image: alpine:3.20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          command:
            - sh
            - -lc
            - |
              set -eu
              escape_sed_replacement() {
                printf '%s' "$1" | sed 's/[\\&|]/\\&/g'
              }

              db_host="$(escape_sed_replacement "$DB_HOST")"
              db_port="$(escape_sed_replacement "$DB_PORT")"
              db_auth_db="$(escape_sed_replacement "$DB_AUTH_DB")"
              db_world_db="$(escape_sed_replacement "$DB_WORLD_DB")"
              db_char_db="$(escape_sed_replacement "$DB_CHAR_DB")"
              data_dir="$(escape_sed_replacement "$DATA_DIR")"
              db_user="$(escape_sed_replacement "$DB_USER")"
              db_password="$(escape_sed_replacement "$DB_PASSWORD")"
              soap_username="$(escape_sed_replacement "$SOAP_USERNAME")"
              soap_password="$(escape_sed_replacement "$SOAP_PASSWORD")"

              render_file() {
                src="$1"
                dst="$2"

                sed \
                  -e "s|\${DB_HOST}|${db_host}|g" \
                  -e "s|\${DB_PORT}|${db_port}|g" \
                  -e "s|\${DB_AUTH_DB}|${db_auth_db}|g" \
                  -e "s|\${DB_WORLD_DB}|${db_world_db}|g" \
                  -e "s|\${DB_CHAR_DB}|${db_char_db}|g" \
                  -e "s|\${DATA_DIR}|${data_dir}|g" \
                  -e "s|\${DB_USER}|${db_user}|g" \
                  -e "s|\${DB_PASSWORD}|${db_password}|g" \
                  -e "s|\${SOAP_USERNAME}|${soap_username}|g" \
                  -e "s|\${SOAP_PASSWORD}|${soap_password}|g" \
                  "$src" > "$dst"
              }

              mkdir -p /etc-out/modules
              render_file /etc-tpl/worldserver.conf /etc-out/worldserver.conf
              render_file /etc-tpl/playerbots.conf /etc-out/modules/playerbots.conf
              render_file /etc-tpl/MultiBotBridge.conf /etc-out/modules/MultiBotBridge.conf
              render_file /etc-tpl/mod_ahbot.conf /etc-out/modules/mod_ahbot.conf
              render_file /etc-tpl/progression_system.conf /etc-out/modules/progression_system.conf
              render_file /etc-tpl/transmog.conf /etc-out/modules/transmog.conf
              render_file /etc-tpl/mod-double-xp-weekend.conf /etc-out/modules/mod-double-xp-weekend.conf
              render_file /etc-tpl/mod_customnpcs.conf /etc-out/modules/mod_customnpcs.conf
              render_file /etc-tpl/mod_grimtokendailies.conf /etc-out/modules/mod_grimtokendailies.conf
              render_file /etc-tpl/mod_guildfunds.conf /etc-out/modules/mod_guildfunds.conf
              render_file /etc-tpl/mod_player_bot_level_brackets.conf /etc-out/modules/mod_player_bot_level_brackets.conf
              chmod -R a+rwX /etc-out
          env:
            - name: DB_HOST
              value: wotlk-mariadb-headless.wotlk.svc.cluster.local
            - name: DB_PORT
              value: "3306"
            - name: DB_AUTH_DB
              value: acore_auth
            - name: DB_WORLD_DB
              value: acore_world
            - name: DB_CHAR_DB
              value: acore_characters
            - name: DATA_DIR
              value: /azerothcore/env/dist/data
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: wotlk-mariadb-auth
                  key: MARIADB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wotlk-mariadb-auth
                  key: MARIADB_PASSWORD
            - name: SOAP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: wotlk-soap-auth
                  key: SOAP_USERNAME
            - name: SOAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wotlk-soap-auth
                  key: SOAP_PASSWORD
          volumeMounts:
            - name: config-tpl
              mountPath: /etc-tpl
              readOnly: true
            - name: etc
              mountPath: /etc-out
        - name: seed-module-config
          image: ghcr.io/rovxbot/azerothcore-wotlk:worldserver-test-staging-470a4d7ee8088a8d442c921bae81af5a2b4a7ad7
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          command:
            - bash
            - -lc
            - |
              set -euo pipefail
              mkdir -p /azerothcore/env/dist/etc/modules
              shopt -s nullglob
              for f in /azerothcore/env/ref/etc/modules/*.conf.dist; do
                base="$(basename "$f" .dist)"
                # Copy defaults once; allow user overrides via future config management.
                cp -n "$f" "/azerothcore/env/dist/etc/modules/$base" || true
              done
              chmod -R a+rwX /azerothcore/env/dist/etc || true

          volumeMounts:
            - name: etc
              mountPath: /azerothcore/env/dist/etc
      containers:
        - name: worldserver
          image: ghcr.io/rovxbot/azerothcore-wotlk:worldserver-test-staging-470a4d7ee8088a8d442c921bae81af5a2b4a7ad7
          imagePullPolicy: Always
          command:
            - sh
            - -lc
            - |
              set -eu
              log_dir=/azerothcore/env/dist/logs
              output_path="${log_dir}/Playerbots.log"

              mkdir -p "${log_dir}"
              : > "${output_path}"

              exec /azerothcore/env/dist/bin/worldserver
          env:
            - name: TZ
              value: Australia/Adelaide
            - name: AC_UPDATES_ENABLE_DATABASES
              # mod-progression-system registers a DatabaseScript rather than
              # dbimport-compatible SQL. Enable world updates so its bracket
              # migrations run from the runtime image's /modules source tree.
              value: "4"
            - name: AC_UPDATES_ALLOWED_MODULES
              # db-import owns normal module migrations. Restrict this runtime
              # updater to the progression DatabaseScript.
              value: mod-progression-system
            - name: AC_PLAYERBOTS_UPDATES_ENABLE_DATABASES
              value: "0"
            - name: DB_HOST
              value: wotlk-mariadb-headless.wotlk.svc.cluster.local
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: wotlk-mariadb-auth
                  key: MARIADB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wotlk-mariadb-auth
                  key: MARIADB_PASSWORD
            - name: AC_PLAYERBOTS_DATABASE_INFO
              value: "$(DB_HOST);$(DB_PORT);$(DB_USER);$(DB_PASSWORD);acore_playerbots"
          ports:
            - name: world
              containerPort: 8085
              protocol: TCP
            - name: soap
              containerPort: 7878
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: world
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: world
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: world
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: etc
              mountPath: /azerothcore/env/dist/etc
            - name: logs
              mountPath: /azerothcore/env/dist/logs
            - name: data
              mountPath: /azerothcore/env/dist/data
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "6"
              memory: 16Gi
        - name: aq40-log-collector
          image: alpine:3.20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          command:
            - sh
            - -lc
            - |
              set -eu
              src=/azerothcore/env/dist/logs/AQ40.log
              archive_dir=/azerothcore/env/dist/data/aq40-logs
              pod_name="${HOSTNAME:-wotlk-worldserver}"
              timestamp="$(date '+%Y%m%d-%H%M%S')"
              dest="${archive_dir}/${pod_name}-${timestamp}-aq40.log"
              latest="${archive_dir}/latest.log"

              mkdir -p "${archive_dir}"
              ln -sf "$(basename "${dest}")" "${latest}"
              printf '# aq40 collector pod=%s started_at=%s source=%s\n' \
                "${pod_name}" "$(date '+%Y-%m-%dT%H:%M:%S%z')" "${src}" >> "${dest}"

              until [ -f "${src}" ]; do
                sleep 2
              done

              tail -n +1 -F "${src}" | tee -a "${dest}"
          env:
            - name: TZ
              value: Australia/Adelaide
          volumeMounts:
            - name: logs
              mountPath: /azerothcore/env/dist/logs
              readOnly: true
            - name: data
              mountPath: /azerothcore/env/dist/data
      volumes:
        - name: config-tpl
          configMap:
            name: wotlk-worldserver-config
        - name: etc
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: wotlk-data-rwx
        - name: dbimport-etc
          emptyDir: {}
        - name: dbimport-logs
          emptyDir: {}
