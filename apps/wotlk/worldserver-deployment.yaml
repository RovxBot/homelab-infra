apiVersion: apps/v1
kind: Deployment
metadata:
  name: wotlk-worldserver
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: wotlk-worldserver
  template:
    metadata:
      labels:
        app: wotlk-worldserver
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-01-06T00:27:35Z"
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: metal7
      initContainers:
        - name: clone-acore
          image: alpine/git:2.47.2
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: ACORE_REPO
              valueFrom:
                configMapKeyRef:
                  name: wotlk-acore-source
                  key: ACORE_REPO
            - name: ACORE_REF
              valueFrom:
                configMapKeyRef:
                  name: wotlk-acore-source
                  key: ACORE_REF
          command:
            - sh
            - -lc
            - |
              set -eu
              rm -rf /acore-src/*
              git clone --depth=1 --branch "${ACORE_REF}" "${ACORE_REPO}" /acore-src
              mkdir -p /acore-src/modules
              # The base source already comes from the Playerbot fork, but the updater
              # still expects a module-style source path for playerbots SQL discovery.
              ln -sfn /acore-src /acore-src/modules/mod-playerbots

              # Clone module repos so the in-server DB updater can find their SQL folders.
              if [ -f /modules/modules.txt ]; then
                while IFS= read -r line || [ -n "$line" ]; do
                  line="$(printf '%s' "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
                  [ -z "$line" ] && continue
                  case "$line" in
                    \#*) continue ;;
                  esac

                  repo="$line"
                  ref="master"
                  case "$line" in
                    *@*)
                      repo="${line%@*}"
                      ref="${line##*@}"
                      ;;
                  esac

                  name="$(basename "$repo" .git)"
                  echo "Adding module: $repo@$ref -> modules/$name"
                  # Don't fail the whole pod if a module is temporarily unavailable.
                  git clone --depth=1 --branch "$ref" "$repo" "/acore-src/modules/$name" || true
                done < /modules/modules.txt
              fi

          volumeMounts:
            - name: acore-src
              mountPath: /acore-src
            - name: modules-list
              mountPath: /modules
              readOnly: true
        - name: render-config
          image: alpine:3.20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          command:
            - sh
            - -lc
            - |
              set -eu
              escape_sed_replacement() {
                printf '%s' "$1" | sed 's/[\\&|]/\\&/g'
              }

              db_host="$(escape_sed_replacement "$DB_HOST")"
              db_port="$(escape_sed_replacement "$DB_PORT")"
              db_auth_db="$(escape_sed_replacement "$DB_AUTH_DB")"
              db_world_db="$(escape_sed_replacement "$DB_WORLD_DB")"
              db_char_db="$(escape_sed_replacement "$DB_CHAR_DB")"
              data_dir="$(escape_sed_replacement "$DATA_DIR")"
              db_user="$(escape_sed_replacement "$DB_USER")"
              db_password="$(escape_sed_replacement "$DB_PASSWORD")"
              soap_username="$(escape_sed_replacement "$SOAP_USERNAME")"
              soap_password="$(escape_sed_replacement "$SOAP_PASSWORD")"

              render_file() {
                src="$1"
                dst="$2"

                sed \
                  -e "s|\${DB_HOST}|${db_host}|g" \
                  -e "s|\${DB_PORT}|${db_port}|g" \
                  -e "s|\${DB_AUTH_DB}|${db_auth_db}|g" \
                  -e "s|\${DB_WORLD_DB}|${db_world_db}|g" \
                  -e "s|\${DB_CHAR_DB}|${db_char_db}|g" \
                  -e "s|\${DATA_DIR}|${data_dir}|g" \
                  -e "s|\${DB_USER}|${db_user}|g" \
                  -e "s|\${DB_PASSWORD}|${db_password}|g" \
                  -e "s|\${SOAP_USERNAME}|${soap_username}|g" \
                  -e "s|\${SOAP_PASSWORD}|${soap_password}|g" \
                  "$src" > "$dst"
              }

              mkdir -p /etc-out/modules
              render_file /etc-tpl/worldserver.conf /etc-out/worldserver.conf
              render_file /etc-tpl/playerbots.conf /etc-out/modules/playerbots.conf
              render_file /etc-tpl/mod_ahbot.conf /etc-out/modules/mod_ahbot.conf
              render_file /etc-tpl/individualProgression.conf /etc-out/modules/individualProgression.conf
              render_file /etc-tpl/transmog.conf /etc-out/modules/transmog.conf
              render_file /etc-tpl/mod-double-xp-weekend.conf /etc-out/modules/mod-double-xp-weekend.conf
              render_file /etc-tpl/mod_customnpcs.conf /etc-out/modules/mod_customnpcs.conf
              render_file /etc-tpl/mod_grimtokendailies.conf /etc-out/modules/mod_grimtokendailies.conf
              render_file /etc-tpl/mod_guildfunds.conf /etc-out/modules/mod_guildfunds.conf
              render_file /etc-tpl/mod_player_bot_level_brackets.conf /etc-out/modules/mod_player_bot_level_brackets.conf
              chmod -R a+rwX /etc-out
          env:
            - name: DB_HOST
              value: wotlk-mariadb-headless.wotlk.svc.cluster.local
            - name: DB_PORT
              value: "3306"
            - name: DB_AUTH_DB
              value: acore_auth
            - name: DB_WORLD_DB
              value: acore_world
            - name: DB_CHAR_DB
              value: acore_characters
            - name: DATA_DIR
              value: /azerothcore/env/dist/data
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: wotlk-mariadb-auth
                  key: MARIADB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wotlk-mariadb-auth
                  key: MARIADB_PASSWORD
            - name: SOAP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: wotlk-soap-auth
                  key: SOAP_USERNAME
            - name: SOAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wotlk-soap-auth
                  key: SOAP_PASSWORD
          volumeMounts:
            - name: config-tpl
              mountPath: /etc-tpl
              readOnly: true
            - name: etc
              mountPath: /etc-out
        - name: seed-module-config
          image: ghcr.io/rovxbot/azerothcore-wotlk:worldserver-test-staging-02b2617bb22bbff5f1a410799b5cde5b329639fc
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          command:
            - bash
            - -lc
            - |
              set -euo pipefail
              mkdir -p /azerothcore/env/dist/etc/modules
              shopt -s nullglob
              for f in /azerothcore/env/ref/etc/modules/*.conf.dist; do
                base="$(basename "$f" .dist)"
                # Copy defaults once; allow user overrides via future config management.
                cp -n "$f" "/azerothcore/env/dist/etc/modules/$base" || true
              done
              chmod -R a+rwX /azerothcore/env/dist/etc || true

          volumeMounts:
            - name: etc
              mountPath: /azerothcore/env/dist/etc
      containers:
        - name: worldserver
          image: ghcr.io/rovxbot/azerothcore-wotlk:worldserver-test-staging-02b2617bb22bbff5f1a410799b5cde5b329639fc
          imagePullPolicy: Always
          command:
            - sh
            - -lc
            - |
              set -eu
              log_dir=/azerothcore/env/dist/logs
              output_path="${log_dir}/Playerbots.log"

              mkdir -p "${log_dir}"
              : > "${output_path}"

              exec /azerothcore/env/dist/bin/worldserver
          env:
            - name: TZ
              value: Australia/Adelaide
            - name: AC_UPDATES_ENABLE_DATABASES
              value: "7"
            - name: AC_UPDATES_AUTO_SETUP
              value: "1"
            - name: AC_SOURCE_DIRECTORY
              value: /acore-src
            - name: DB_HOST
              value: wotlk-mariadb-headless.wotlk.svc.cluster.local
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: wotlk-mariadb-auth
                  key: MARIADB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wotlk-mariadb-auth
                  key: MARIADB_PASSWORD
            - name: AC_PLAYERBOTS_DATABASE_INFO
              value: "$(DB_HOST);$(DB_PORT);$(DB_USER);$(DB_PASSWORD);acore_playerbots"
          ports:
            - name: world
              containerPort: 8085
              protocol: TCP
            - name: soap
              containerPort: 7878
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: world
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: world
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: etc
              mountPath: /azerothcore/env/dist/etc
            - name: logs
              mountPath: /azerothcore/env/dist/logs
            - name: data
              mountPath: /azerothcore/env/dist/data
            - name: acore-src
              mountPath: /acore-src
              readOnly: true
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "6"
              memory: 16Gi
      volumes:
        - name: config-tpl
          configMap:
            name: wotlk-worldserver-config
        - name: etc
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: wotlk-data-rwx
        - name: acore-src
          emptyDir: {}
        - name: modules-list
          configMap:
            name: wotlk-modules-list
