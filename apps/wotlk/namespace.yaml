apiVersion: v1
kind: Namespace
metadata:
  name: wotlk
  labels:
    # Legacy game listeners use narrowly scoped HostPort mappings on pinned nodes.
    homelab.cooked.beer/owner: sam
    pod-security.kubernetes.io/enforce: privileged
