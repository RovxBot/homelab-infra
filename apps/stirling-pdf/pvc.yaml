apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stirling-pdf-data
  namespace: stirling-pdf
  annotations:
    # Uninstalling the workload must not delete documents or signing keys.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
