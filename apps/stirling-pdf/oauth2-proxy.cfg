# Native Stirling accounts are disabled: all admitted users share the workspace.
provider = "entra-id"
provider_display_name = "cooked.beer Microsoft Entra"
oidc_issuer_url = "https://login.microsoftonline.com/345cd18b-5bee-4ac4-b729-a3f7059a28f3/v2.0"
redirect_url = "https://pdf.cooked.beer/oauth2/callback"
scope = "openid profile email offline_access"
code_challenge_method = "S256"
# Group assignment in Entra and this signed group claim are the authorization
# boundary. preferred_username is used for display/domain checks, not by itself.
allowed_groups = ["502f5a1c-e46a-4105-9859-ab174615231e"]
oidc_email_claim = "preferred_username"
email_domains = ["cooked.beer"]
http_address = "0.0.0.0:4180"
upstreams = ["http://127.0.0.1:8080/"]
reverse_proxy = true
proxy_websockets = true
upstream_timeout = "10m"
skip_provider_button = true
cookie_name = "__Host-stirling_pdf"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "8h"
cookie_refresh = "30m"
cookie_csrf_per_request = true
cookie_csrf_expire = "10m"
# Do not forward provider credentials or identity headers to the shared app.
pass_access_token = false
pass_authorization_header = false
pass_user_headers = false
request_logging = false
silence_ping_logging = true
