default_config:

frontend:
  extra_module_url:
    - /local/ha-map-tile-replace/ha-map-tile-replace.js?v=2

# Keep custom dashboards declarative alongside the Home Assistant deployment.
lovelace:
  # Register the custom card with Lovelace itself so dashboard clients load it
  # with the view configuration, including clients with a cached app shell.
  resource_mode: yaml
  resources:
    - url: /local/airtouch-timer-picker.js?v=4
      type: module
  dashboards:
    homelab-home:
      mode: yaml
      filename: dashboards/home-dashboard.yaml
      title: Home
      icon: mdi:home-assistant
      show_in_sidebar: true
    homelab-weather:
      mode: yaml
      filename: dashboards/weather-dashboard.yaml
      title: Weather
      icon: mdi:weather-partly-cloudy
      show_in_sidebar: true
    homelab-power-solar:
      mode: yaml
      filename: dashboards/power-dashboard.yaml
      title: Power & Solar
      icon: mdi:solar-power
      show_in_sidebar: true
    homelab-internet:
      mode: yaml
      filename: dashboards/internet-dashboard.yaml
      title: Internet
      icon: mdi:router-network
      show_in_sidebar: true
    homelab-security:
      mode: yaml
      filename: dashboards/security-dashboard.yaml
      title: Security
      icon: mdi:cctv
      show_in_sidebar: true

# AirTouch auto-off controls. The timer state is visible on the dashboard and
# its running state is restored across normal Home Assistant restarts.
input_number:
  airtouch_auto_off_hours:
    name: AirTouch auto-off hours
    icon: mdi:timer-outline
    min: 0
    max: 8
    step: 1
    initial: 1
    mode: box
    unit_of_measurement: h
  airtouch_auto_off_minute_block:
    name: AirTouch auto-off minutes
    icon: mdi:timer-outline
    min: 0
    max: 45
    step: 15
    initial: 0
    mode: box
    unit_of_measurement: min

input_datetime:
  airtouch_auto_off_at:
    name: AirTouch auto-off at
    has_date: true
    has_time: true
    icon: mdi:clock-end

input_boolean:
  airtouch_auto_off_armed:
    name: AirTouch auto-off armed
    icon: mdi:timer-check-outline

timer:
  airtouch_auto_off:
    name: AirTouch auto-off
    icon: mdi:timer-off-outline
    duration: "01:00:00"
    restore: true

script:
  airtouch_turn_on_with_timer:
    alias: Turn on AirTouch with timer
    description: Turn on the AirTouch system and restart its configured auto-off timer.
    icon: mdi:air-conditioner
    mode: restart
    sequence:
      - variables:
          duration_minutes: >-
            {{ (states('input_number.airtouch_auto_off_hours') | int(1) * 60)
               + (states('input_number.airtouch_auto_off_minute_block') | int(0)) }}
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.airtouch_auto_off_at
        data:
          timestamp: >-
            {{ now().timestamp() + ((duration_minutes | int) * 60) }}
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.airtouch_auto_off_armed
      - action: climate.turn_on
        target:
          entity_id: climate.at2plus_ac_0
      - action: timer.start
        target:
          entity_id: timer.airtouch_auto_off
        data:
          duration: >-
            {{ '%02d:%02d:00' | format((duration_minutes | int) // 60, (duration_minutes | int) % 60) }}
  airtouch_cancel_auto_off:
    alias: Cancel AirTouch auto-off
    description: Keep the AirTouch system running and cancel its auto-off timer.
    icon: mdi:timer-cancel-outline
    sequence:
      - action: timer.cancel
        target:
          entity_id: timer.airtouch_auto_off
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.airtouch_auto_off_armed

automation:
  - id: airtouch_turn_off_when_timer_finishes
    alias: Turn off AirTouch when auto-off timer finishes
    description: Turn off the AirTouch system at the end of its configured countdown.
    mode: single
    triggers:
      - trigger: timer.finished
        target:
          entity_id: timer.airtouch_auto_off
    actions:
      - action: climate.turn_off
        target:
          entity_id: climate.at2plus_ac_0
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.airtouch_auto_off_armed
  - id: airtouch_cancel_timer_when_turned_off
    alias: Cancel AirTouch auto-off when air conditioning is turned off
    description: Clear the pending auto-off timer when AirTouch is switched off manually.
    mode: restart
    triggers:
      - trigger: state
        entity_id: climate.at2plus_ac_0
        to: "off"
    actions:
      - action: timer.cancel
        target:
          entity_id: timer.airtouch_auto_off
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.airtouch_auto_off_armed
  - id: airtouch_enforce_elapsed_timer_after_restart
    alias: Turn off AirTouch if its auto-off time elapsed during a restart
    description: Prevent a Home Assistant outage from leaving a timed AirTouch run active.
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.airtouch_auto_off_armed
        state: "on"
      - condition: template
        value_template: >-
          {{ as_timestamp(states('input_datetime.airtouch_auto_off_at'), 0)
             <= as_timestamp(now()) }}
    actions:
      - action: climate.turn_off
        target:
          entity_id: climate.at2plus_ac_0
      - action: timer.cancel
        target:
          entity_id: timer.airtouch_auto_off
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.airtouch_auto_off_armed
  - id: household_presence_notifications
    alias: Notify household on arrivals and departures
    description: Notify both household phones when Sam or Rachael leaves or returns home.
    mode: queued
    max: 10
    triggers:
      - trigger: state
        entity_id: person.sam
        from: home
        id: sam_departed
      - trigger: state
        entity_id: device_tracker.pixel_8a
        from: home
        id: rachael_departed
      - trigger: state
        entity_id: person.sam
        to: home
        id: sam_arrived
      - trigger: state
        entity_id: device_tracker.pixel_8a
        to: home
        id: rachael_arrived
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none
             and trigger.to_state is not none
             and trigger.from_state.state not in ['unknown', 'unavailable']
             and trigger.to_state.state not in ['unknown', 'unavailable'] }}
    actions:
      - variables:
          person_name: >-
            {{ 'Sam' if trigger.entity_id == 'person.sam' else 'Rachael' }}
          presence_event: >-
            {{ 'arrived home' if trigger.to_state.state == 'home' else 'left home' }}
          notification_tag: >-
            home-presence-{{ trigger.entity_id.split('.')[-1] }}
      - action: notify.send_message
        target:
          entity_id:
            - notify.pixel_6a
            - notify.pixel_8a
        data:
          title: Home presence
          message: "{{ person_name }} {{ presence_event }}."
