title: Home
views:
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: weather-forecast
            entity: weather.forecast_home
            name: Home forecast
            show_forecast: true
            forecast_type: daily
          - type: entities
            title: Daylight
            show_header_toggle: false
            entities:
              - entity: binary_sensor.sun_solar_rising
                name: Sun is rising
              - entity: sensor.sun_next_rising
                name: Next sunrise
              - entity: sensor.sun_next_setting
                name: Next sunset
              - entity: sensor.sun_solar_elevation
                name: Sun elevation
      - type: grid
        cards:
          - type: map
            title: Family locations
            auto_fit: true
            default_zoom: 12
            hours_to_show: 4
            entities:
              - entity: person.sam
                name: Sam
              - entity: device_tracker.pixel_8a
                name: Rachael
          - type: entities
            title: Phones
            state_color: true
            show_header_toggle: false
            entities:
              - entity: device_tracker.sam_pixel_6a
                name: Sam — Pixel 6a
              - entity: sensor.sam_pixel_6a_battery_level
                name: Sam battery
              - entity: binary_sensor.sam_pixel_6a_is_charging
                name: Sam charging
              - entity: device_tracker.pixel_8a
                name: Rachael — Pixel 8a
              - entity: sensor.pixel_8a_battery_level
                name: Rachael battery
              - entity: binary_sensor.pixel_8a_is_charging
                name: Rachael charging
              - entity: sensor.pixel_8a_detected_activity
                name: Rachael activity
      - type: grid
        cards:
          - type: media-control
            entity: media_player.living_room_tv
            name: Living Room TV
          - type: media-control
            entity: media_player.shield
            name: SHIELD
          - type: entities
            title: Now playing
            show_header_toggle: false
            entities:
              - entity: sensor.lastfm_rovbot
                name: Last.fm
      - type: grid
        cards:
          - type: entities
            title: Rachael's car
            show_header_toggle: false
            entities:
              - entity: sensor.pixel_8a_car_name
                name: Vehicle
              - entity: sensor.pixel_8a_car_battery
                name: Battery
              - entity: sensor.pixel_8a_car_fuel
                name: Fuel
              - entity: sensor.pixel_8a_car_range_remaining
                name: Range remaining
              - entity: sensor.pixel_8a_car_charging_status
                name: Charging status
              - entity: sensor.pixel_8a_car_odometer
                name: Odometer
  - title: Air conditioning
    path: air-conditioning
    icon: mdi:air-conditioner
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: thermostat
            entity: climate.at2plus_ac_0
            name: Air conditioning
            show_current_as_primary: true
            features:
              - type: climate-hvac-modes
          - type: entities
            title: AirTouch auto-off
            show_header_toggle: false
            entities:
              - entity: input_number.airtouch_auto_off_minutes
                name: Turn off after
              - entity: script.airtouch_turn_on_with_timer
                name: Turn on with timer
                action_name: Start
              - entity: timer.airtouch_auto_off
                name: Auto-off countdown
              - entity: script.airtouch_cancel_auto_off
                name: Keep running
                action_name: Cancel timer
      - type: grid
        cards:
          - type: heading
            heading: AirTouch zones
            heading_style: title
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: fan.bed1
                name: Bedroom
                features:
                  - type: fan-speed
              - type: tile
                entity: fan.office
                name: Office
                features:
                  - type: fan-speed
              - type: tile
                entity: fan.living
                name: Living
                features:
                  - type: fan-speed
              - type: tile
                entity: fan.kitchen
                name: Kitchen
                features:
                  - type: fan-speed
              - type: tile
                entity: fan.dining
                name: Dining
                features:
                  - type: fan-speed
              - type: tile
                entity: fan.spare_room
                name: Spare room
                features:
                  - type: fan-speed
  - title: Energy & solar
    path: energy-solar
    icon: mdi:solar-power
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: energy-date-selection
          - type: energy-distribution
          - type: energy-sources-table
      - type: grid
        cards:
          - type: gauge
            entity: sensor.solarnet_power_photovoltaics
            name: Solar production
            min: 0
            max: 8200
            needle: true
            severity:
              red: 0
              yellow: 1000
              green: 3000
          - type: entities
            title: Live power flow
            show_header_toggle: false
            entities:
              - entity: sensor.solarnet_power_photovoltaics
                name: Solar production
              - entity: sensor.solarnet_power_load_consumed
                name: Home consumption
              - entity: sensor.solarnet_power_grid_import
                name: Grid import
              - entity: sensor.solarnet_power_grid_export
                name: Grid export
              - entity: sensor.solarnet_relative_autonomy
                name: Self-sufficiency
              - entity: sensor.solarnet_relative_self_consumption
                name: Solar self-consumption
      - type: grid
        cards:
          - type: entities
            title: Energy totals
            show_header_toggle: false
            entities:
              - entity: sensor.2001614171_energy_day
                name: Solar generation today
              - entity: sensor.2001614171_energy_year
                name: Solar generation this year
              - entity: sensor.2001614171_total_energy
                name: Solar generation lifetime
              - entity: sensor.smart_meter_63a_1_real_energy_consumed
                name: Grid imported lifetime
              - entity: sensor.smart_meter_63a_1_real_energy_produced
                name: Grid exported lifetime
          - type: entities
            title: Current tariffs
            show_header_toggle: false
            entities:
              - entity: sensor.solarnet_grid_import_tariff
                name: Grid import rate
              - entity: sensor.solarnet_grid_export_tariff
                name: Solar feed-in rate
      - type: grid
        cards:
          - type: history-graph
            title: Power flow — last 24 hours
            hours_to_show: 24
            entities:
              - entity: sensor.solarnet_power_photovoltaics
                name: Solar
              - entity: sensor.solarnet_power_load_consumed
                name: Home
              - entity: sensor.solarnet_power_grid_import
                name: Grid import
              - entity: sensor.solarnet_power_grid_export
                name: Grid export
