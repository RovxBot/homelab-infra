title: Home
views:
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: weather-forecast
            entity: weather.pirateweather
            name: Pirate Weather
            show_forecast: true
            forecast_type: daily
          - type: entities
            title: Daylight
            show_header_toggle: false
            entities:
              - entity: sun.sun
                name: Sun state
              - entity: sensor.sun_next_rising
                name: Next sunrise
              - entity: sensor.sun_next_setting
                name: Next sunset
      - type: grid
        cards:
          - type: map
            title: Family locations
            auto_fit: true
            default_zoom: 12
            hours_to_show: 4
            entities:
              - entity: person.sam
                name: Sam
              - entity: device_tracker.pixel_8a
                name: Rachael
          - type: entities
            title: Phones
            state_color: true
            show_header_toggle: false
            entities:
              - entity: device_tracker.pixel_6a
                name: Sam — Pixel 6a
              - entity: sensor.pixel_6a_battery_level
                name: Sam battery
              - entity: sensor.pixel_6a_battery_state
                name: Sam battery state
              - entity: device_tracker.pixel_8a
                name: Rachael — Pixel 8a
              - entity: sensor.pixel_8a_battery_level
                name: Rachael battery
              - entity: sensor.pixel_8a_battery_state
                name: Rachael battery state
      - type: grid
        cards:
          - type: media-control
            entity: media_player.living_room_tv
            name: Living Room TV
          - type: media-control
            entity: media_player.shield
            name: SHIELD
          - type: entities
            title: Now playing
            show_header_toggle: false
            entities:
              - entity: sensor.lastfm_rovbot
                name: Last.fm
  - title: Air conditioning
    path: air-conditioning
    icon: mdi:air-conditioner
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: thermostat
            entity: climate.at2plus_ac_0
            name: Air conditioning
            show_current_as_primary: true
            features:
              - type: climate-hvac-modes
          - type: entities
            title: AirTouch auto-off
            show_header_toggle: false
            entities:
              - entity: input_number.airtouch_auto_off_minutes
                name: Turn off after (15-minute steps)
              - entity: sensor.airtouch_auto_off_duration_display
                name: Selected duration
              - entity: script.airtouch_turn_on_with_timer
                name: Turn on with timer
                action_name: Start
              - entity: timer.airtouch_auto_off
                name: Auto-off countdown
              - entity: script.airtouch_cancel_auto_off
                name: Keep running
                action_name: Cancel timer
      - type: grid
        cards:
          - type: heading
            heading: AirTouch zones
            heading_style: title
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: fan.bed1
                name: Bedroom
                features:
                  - type: fan-speed
              - type: tile
                entity: fan.office
                name: Office
                features:
                  - type: fan-speed
              - type: tile
                entity: fan.living
                name: Living
                features:
                  - type: fan-speed
              - type: tile
                entity: fan.kitchen
                name: Kitchen
                features:
                  - type: fan-speed
              - type: tile
                entity: fan.dining
                name: Dining
                features:
                  - type: fan-speed
              - type: tile
                entity: fan.spare_room
                name: Spare room
                features:
                  - type: fan-speed
