title: Home
views:
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: weather-forecast
            entity: weather.forecast_home
            name: Home forecast
            show_forecast: true
            forecast_type: daily
          - type: entities
            title: Daylight
            show_header_toggle: false
            entities:
              - entity: sun.sun
                name: Sun state
              - entity: sensor.sun_next_rising
                name: Next sunrise
              - entity: sensor.sun_next_setting
                name: Next sunset
      - type: grid
        cards:
          - type: map
            title: Family locations
            auto_fit: true
            default_zoom: 12
            hours_to_show: 4
            entities:
              - entity: person.sam
                name: Sam
              - entity: device_tracker.pixel_8a
                name: Rachael
          - type: entities
            title: Phones
            state_color: true
            show_header_toggle: false
            entities:
              - entity: device_tracker.pixel_6a
                name: Sam — Pixel 6a
              - entity: sensor.pixel_6a_battery_level
                name: Sam battery
              - entity: sensor.pixel_6a_battery_state
                name: Sam battery state
              - entity: device_tracker.pixel_8a
                name: Rachael — Pixel 8a
              - entity: sensor.pixel_8a_battery_level
                name: Rachael battery
              - entity: sensor.pixel_8a_battery_state
                name: Rachael battery state
      - type: grid
        cards:
          - type: media-control
            entity: media_player.living_room_tv
            name: Living Room TV
          - type: media-control
            entity: media_player.shield
            name: SHIELD
          - type: entities
            title: Now playing
            show_header_toggle: false
            entities:
              - entity: sensor.lastfm_rovbot
                name: Last.fm
  - title: Air conditioning
    path: air-conditioning
    icon: mdi:air-conditioner
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: thermostat
            entity: climate.at2plus_ac_0
            name: Air conditioning
            show_current_as_primary: true
            features:
              - type: climate-hvac-modes
          - type: entities
            title: AirTouch auto-off
            show_header_toggle: false
            entities:
              - entity: input_number.airtouch_auto_off_minutes
                name: Turn off after
              - entity: script.airtouch_turn_on_with_timer
                name: Turn on with timer
                action_name: Start
              - entity: timer.airtouch_auto_off
                name: Auto-off countdown
              - entity: script.airtouch_cancel_auto_off
                name: Keep running
                action_name: Cancel timer
      - type: grid
        cards:
          - type: heading
            heading: AirTouch zones
            heading_style: title
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: fan.bed1
                name: Bedroom
                features:
                  - type: fan-speed
              - type: tile
                entity: fan.office
                name: Office
                features:
                  - type: fan-speed
              - type: tile
                entity: fan.living
                name: Living
                features:
                  - type: fan-speed
              - type: tile
                entity: fan.kitchen
                name: Kitchen
                features:
                  - type: fan-speed
              - type: tile
                entity: fan.dining
                name: Dining
                features:
                  - type: fan-speed
              - type: tile
                entity: fan.spare_room
                name: Spare room
                features:
                  - type: fan-speed
  - title: Energy & solar
    path: energy-solar
    icon: mdi:solar-power
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: markdown
            content: >-
              ## Energy data status

              **Solar generation** is measured by the Fronius inverter and is
              suitable for solar reporting. **Grid import, export, household
              consumption and costs are intentionally not configured in the
              Energy dashboard yet.** The inverter Smart Meter counters do not
              reconcile with the SA Power Networks interval meter data, so they
              must not be used for billing or cost calculations until the meter
              position and configuration have been checked.
          - type: entities
            title: Verified solar generation
            show_header_toggle: false
            entities:
              - entity: sensor.2001614171_energy_day
                name: Solar generation today
              - entity: sensor.2001614171_energy_year
                name: Solar generation this year
              - entity: sensor.2001614171_total_energy
                name: Solar generation lifetime
      - type: grid
        cards:
          - type: gauge
            entity: sensor.solarnet_power_photovoltaics
            name: Live solar production
            min: 0
            max: 8200
            needle: true
            severity:
              red: 0
              yellow: 1000
              green: 3000
          - type: entities
            title: Inverter power flow — diagnostic only
            show_header_toggle: false
            entities:
              - entity: sensor.solarnet_power_photovoltaics
                name: Solar production
              - entity: sensor.solarnet_power_load_consumed
                name: Estimated home consumption
              - entity: sensor.solarnet_power_grid_import
                name: Reported grid import
              - entity: sensor.solarnet_power_grid_export
                name: Reported grid export
              - entity: sensor.solarnet_relative_autonomy
                name: Estimated self-sufficiency
              - entity: sensor.solarnet_relative_self_consumption
                name: Estimated solar self-consumption
      - type: grid
        cards:
          - type: entities
            title: Inverter Smart Meter totals — do not use for billing
            show_header_toggle: false
            entities:
              - entity: sensor.smart_meter_63a_1_real_energy_consumed
                name: Reported energy consumed
              - entity: sensor.smart_meter_63a_1_real_energy_produced
                name: Reported energy produced
      - type: grid
        cards:
          - type: history-graph
            title: Inverter-reported power flow — last 24 hours
            hours_to_show: 24
            entities:
              - entity: sensor.solarnet_power_photovoltaics
                name: Solar
              - entity: sensor.solarnet_power_load_consumed
                name: Home
              - entity: sensor.solarnet_power_grid_import
                name: Grid import
              - entity: sensor.solarnet_power_grid_export
                name: Grid export
