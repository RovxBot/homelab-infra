apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false

      # Home Assistant uses mDNS, SSDP, and other LAN multicast discovery
      # protocols. A pod network cannot receive those LAN broadcasts reliably.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 300

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: install-airtouch-timer-picker
          # Install the reviewed dashboard module from the generated ConfigMap
          # before Home Assistant starts serving /local assets.
          image: alpine/git:v2.54.0@sha256:1e9d9a40acbd02aeb3cb005ff43f9e51ac09ba0c241bb2298f811d3f426a2ffd
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              mkdir -p /config/www
              cp /gitops-assets/airtouch-timer-picker.js /config/www/.airtouch-timer-picker.js.new
              chmod 0644 /config/www/.airtouch-timer-picker.js.new
              mv /config/www/.airtouch-timer-picker.js.new /config/www/airtouch-timer-picker.js
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: default-config
              mountPath: /gitops-assets
              readOnly: true
        - name: install-airtouch2plus
          # The custom component is not available through Home Assistant Core.
          # Pin both the installer image and source revision so component
          # upgrades are reviewed GitOps changes rather than mutable HACS pulls.
          image: alpine/git:v2.54.0@sha256:1e9d9a40acbd02aeb3cb005ff43f9e51ac09ba0c241bb2298f811d3f426a2ffd
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              revision='6b0b5a90656dc13d68e6390ac6ba4989df6815fd'
              patch_hash="$(sha256sum /gitops-assets/airtouch2plus-reliability.patch | cut -d ' ' -f 1)"
              patch_revision="$revision-homelab.$patch_hash"
              component='/config/custom_components/airtouch2plus'

              if [ -d "$component" ]; then
                installed_revision="$(cat "$component/.gitops-revision" 2>/dev/null || true)"
                if [ "$installed_revision" = "$patch_revision" ]; then
                  exit 0
                fi
                case "$installed_revision" in
                  "$revision"|"$revision"-homelab.*) ;;
                  *) echo "Refusing to replace an unexpected AirTouch 2+ component" >&2; exit 1 ;;
                esac
              fi

              staging="$(mktemp -d /config/.airtouch2plus.XXXXXX)"
              cleanup() {
                if [ ! -d "$component" ] && [ -d "$staging/previous" ]; then
                  mv "$staging/previous" "$component" || return 1
                fi
                rm -rf "$staging"
              }
              trap cleanup EXIT
              git init "$staging/repository"
              git -C "$staging/repository" remote add origin https://github.com/nathanvdh/homeassistant-airtouch2plus.git
              # Fetch the reviewed commit directly, independent of upstream HEAD.
              git -C "$staging/repository" fetch --depth 1 origin "$revision"
              git -C "$staging/repository" checkout --detach FETCH_HEAD
              test "$(git -C "$staging/repository" rev-parse HEAD)" = "$revision"
              git -C "$staging/repository" apply --check /gitops-assets/airtouch2plus-reliability.patch
              git -C "$staging/repository" apply /gitops-assets/airtouch2plus-reliability.patch
              test -f "$staging/repository/custom_components/airtouch2plus/manifest.json"
              printf '%s\n' "$patch_revision" > "$staging/repository/custom_components/airtouch2plus/.gitops-revision"
              mkdir -p /config/custom_components
              if [ -d "$component" ]; then mv "$component" "$staging/previous"; fi
              mv "$staging/repository/custom_components/airtouch2plus" "$component"
              echo "Installed reviewed AirTouch 2+ reliability patch"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: default-config
              mountPath: /gitops-assets
              readOnly: true
        - name: install-pirate-weather
          # Pirate Weather is a custom Home Assistant component. Pin the
          # release revision so upgrades are reviewed GitOps changes rather
          # than mutable HACS pulls.
          image: alpine/git:v2.54.0@sha256:1e9d9a40acbd02aeb3cb005ff43f9e51ac09ba0c241bb2298f811d3f426a2ffd
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              revision='e3515a23afdddaf89274782d176b3fb80db83bd8'
              component='/config/custom_components/pirateweather'

              if [ -d "$component" ]; then
                installed_revision="$(cat "$component/.gitops-revision" 2>/dev/null || true)"
                if [ "$installed_revision" = "$revision" ]; then
                  exit 0
                fi

                echo "Refusing to replace an unexpected Pirate Weather component" >&2
                exit 1
              fi

              staging="$(mktemp -d)"
              git clone --depth 1 --branch v1.9.1 https://github.com/Pirate-Weather/pirate-weather-ha.git "$staging/repository"
              actual_revision="$(git -C "$staging/repository" rev-parse HEAD)"
              test "$actual_revision" = "$revision"
              test -f "$staging/repository/custom_components/pirateweather/manifest.json"

              mkdir -p /config/custom_components
              mv "$staging/repository/custom_components/pirateweather" "$component"
              printf '%s\n' "$revision" > "$component/.gitops-revision"
              echo "Installed Pirate Weather custom component v1.9.1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /config

      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.9.1@sha256:31076d37e3b7dc9681b32d892aa4413fa866c9a90e5c8a50324b397dce415d17
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          env:
            - name: TZ
              value: Australia/Adelaide
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /config
            - name: default-config
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
              readOnly: true
            - name: default-config
              mountPath: /config/dashboards
              readOnly: true
          securityContext:
            # The upstream S6 init process currently runs as root. The
            # corresponding Kyverno exception is limited to this Deployment.
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: default-config
          configMap:
            name: home-assistant-default-config
