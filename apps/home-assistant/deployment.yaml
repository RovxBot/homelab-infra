apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false

      # Home Assistant uses mDNS, SSDP, and other LAN multicast discovery
      # protocols. A pod network cannot receive those LAN broadcasts reliably.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 300

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: install-airtouch2plus
          # The custom component is not available through Home Assistant Core.
          # Pin both the installer image and source revision so component
          # upgrades are reviewed GitOps changes rather than mutable HACS pulls.
          image: alpine/git:2.49.1@sha256:53a6239398162098fed2f49a46512f9cbba9e3f31b9f2cea4fa90129ee069a99
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              revision='6b0b5a90656dc13d68e6390ac6ba4989df6815fd'
              component='/config/custom_components/airtouch2plus'

              if [ -d "$component" ]; then
                installed_revision="$(cat "$component/.gitops-revision" 2>/dev/null || true)"
                if [ "$installed_revision" = "$revision" ]; then
                  exit 0
                fi

                echo "Refusing to replace an unexpected AirTouch 2+ component" >&2
                exit 1
              fi

              staging="$(mktemp -d)"
              git clone --depth 1 https://github.com/nathanvdh/homeassistant-airtouch2plus.git "$staging/repository"
              actual_revision="$(git -C "$staging/repository" rev-parse HEAD)"
              test "$actual_revision" = "$revision"
              test -f "$staging/repository/custom_components/airtouch2plus/manifest.json"

              mkdir -p /config/custom_components
              mv "$staging/repository/custom_components/airtouch2plus" "$component"
              printf '%s\n' "$revision" > "$component/.gitops-revision"
              echo "Installed AirTouch 2+ component for controller 192.168.20.14"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /config
        - name: install-pirate-weather
          # Pirate Weather is a custom Home Assistant component. Pin the
          # release revision so upgrades are reviewed GitOps changes rather
          # than mutable HACS pulls.
          image: alpine/git:2.49.1@sha256:53a6239398162098fed2f49a46512f9cbba9e3f31b9f2cea4fa90129ee069a99
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              revision='e3515a23afdddaf89274782d176b3fb80db83bd8'
              component='/config/custom_components/pirateweather'

              if [ -d "$component" ]; then
                installed_revision="$(cat "$component/.gitops-revision" 2>/dev/null || true)"
                if [ "$installed_revision" = "$revision" ]; then
                  exit 0
                fi

                echo "Refusing to replace an unexpected Pirate Weather component" >&2
                exit 1
              fi

              staging="$(mktemp -d)"
              git clone --depth 1 --branch v1.9.1 https://github.com/Pirate-Weather/pirate-weather-ha.git "$staging/repository"
              actual_revision="$(git -C "$staging/repository" rev-parse HEAD)"
              test "$actual_revision" = "$revision"
              test -f "$staging/repository/custom_components/pirateweather/manifest.json"

              mkdir -p /config/custom_components
              mv "$staging/repository/custom_components/pirateweather" "$component"
              printf '%s\n' "$revision" > "$component/.gitops-revision"
              echo "Installed Pirate Weather custom component v1.9.1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /config

      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.8.3@sha256:8e9751cb66d3ba6624f5360a7d31b0c6821f7f5b3fb8ba0d10d58f0f481c540c
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          env:
            - name: TZ
              value: Australia/Adelaide
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /config
            - name: default-config
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
              readOnly: true
            - name: default-config
              mountPath: /config/dashboards
              readOnly: true
          securityContext:
            # The upstream S6 init process currently runs as root. The
            # corresponding Kyverno exception is limited to this Deployment.
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: default-config
          configMap:
            name: home-assistant-default-config
