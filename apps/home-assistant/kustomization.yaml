apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: home-assistant

labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      homelab.cooked.beer/owner: sam

resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
