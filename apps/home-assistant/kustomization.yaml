apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: home-assistant

labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      homelab.cooked.beer/owner: sam

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml

# A hashed name updates the Deployment's volume reference, ensuring a
# configuration change rolls Home Assistant and refreshes its subPath mount.
configMapGenerator:
  - name: home-assistant-default-config
    files:
      - configuration.yaml=config/configuration.yaml
      - home-dashboard.yaml=config/dashboards/home-dashboard.yaml
      - weather-dashboard.yaml=config/dashboards/weather-dashboard.yaml
      - power-dashboard.yaml=config/dashboards/power-dashboard.yaml
      - internet-dashboard.yaml=config/dashboards/internet-dashboard.yaml
      - security-dashboard.yaml=config/dashboards/security-dashboard.yaml
      - air-quality-dashboard.yaml=config/dashboards/air-quality-dashboard.yaml
      - airtouch-timer-picker.js=config/www/airtouch-timer-picker.js
