apiVersion: apps/v1
kind: Deployment
metadata:
  name: sabnzbd
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: sabnzbd
  template:
    metadata:
      labels:
        app: sabnzbd
    spec:
      initContainers:
        - name: ensure-download-dirs
          image: alpine:3.23@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -lc
            - |
              set -eu
              mkdir -p /downloads/Downloading
              mkdir -p /downloads/Downloads/Done
          volumeMounts:
            - name: downloads
              mountPath: /downloads
      containers:
        - name: sabnzbd
          image: linuxserver/sabnzbd:5.0.2-ls254@sha256:52651d44a649e135ce9cb3758ecd0294b96e6979219d9b653af724f9d198e861
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Australia/Melbourne
          volumeMounts:
            - name: config
              mountPath: /config
            # Downloads on NAS #2 (192.168.1.154) - /volume1/Plex Media
            # Downloads go to /downloads/Downloads (in-progress and complete)
            - name: downloads
              mountPath: /downloads
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sabnzbd-config
        - name: downloads
          persistentVolumeClaim:
            claimName: nfs-plex-media
