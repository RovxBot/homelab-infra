apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: immich
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      homelab.cooked.beer/owner: sam

resources:
  - namespace.yaml
  # Keep the credentials consumed by server.yaml and postgres.yaml under the
  # same Flux reconciliation as their workloads.
  - ../../secrets/immich.enc.yaml
  - nfs-pv-uploads.yaml
  - pvc.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - server.yaml
  - machine-learning.yaml
  - networkpolicies.yaml
