apiVersion: apps/v1
kind: Deployment
metadata:
  name: wger-celery-worker
  namespace: wger
spec:
  revisionHistoryLimit: 2
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wger-celery-worker
  template:
    metadata:
      labels:
        app: wger-celery-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: celery-worker
          image: wger/server:2.7@sha256:25aacc6091329a8247149aebea1c72dc9521662306202eecfddda21ba11a23e5
          imagePullPolicy: IfNotPresent
          command:
            - /start-worker
          envFrom:
            - configMapRef:
                name: wger-config
            - secretRef:
                name: wger-secrets
          volumeMounts:
            - name: entra-settings
              mountPath: /home/wger/src/settings/entra.py
              subPath: entra.py
              readOnly: true
            - name: entra-settings
              mountPath: /home/wger/src/wger/entra_adapter.py
              subPath: entra_adapter.py
              readOnly: true
            - name: media
              mountPath: /home/wger/media
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: entra-settings
          configMap:
            name: wger-entra-settings
        - name: media
          persistentVolumeClaim:
            claimName: wger-media
---
