apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wger

labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      homelab.cooked.beer/owner: sam

resources:
  - namespace.yaml
  - configmap.yaml
  - entra-settings-configmap.yaml
  - nginx-configmap.yaml
  - pvc.yaml
  - postgres.yaml
  - redis.yaml
  - web.yaml
  - celery.yaml
  - powersync.yaml
  - service.yaml
  - ../../secrets/wger.enc.yaml
  - networkpolicies.yaml
