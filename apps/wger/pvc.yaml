apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wger-postgres
  namespace: wger
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
