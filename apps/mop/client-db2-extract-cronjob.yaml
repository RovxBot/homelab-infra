apiVersion: batch/v1
kind: CronJob
metadata:
  name: skyfire-client-db2-extract
spec:
  # One-time recovery for an early extractor run which left db2 in its
  # ephemeral workspace. It runs mapextractor only; maps, vmaps, and mmaps are
  # left untouched.
  suspend: true
  schedule: "0 4 1 1 *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 604800
      activeDeadlineSeconds: 3600
      backoffLimit: 0
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: extract-db2
              image: ghcr.io/rovxbot/skyfire-mop:core-11bd16f87d0cafbc9e02be2b94e214523c080291-8f0528f025b104f69307c269ca412e99a7223e1e@sha256:6f5fd91bdf92945d63e8fad25d275adac4f8bf81a5f286b0b715f00071b09b65
              imagePullPolicy: Always
              resources:
                requests:
                  cpu: "2"
                  memory: 4Gi
                limits:
                  cpu: "4"
                  memory: 8Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                privileged: false
              command:
                - sh
                - -ec
                - |
                  client_data=""
                  for candidate in /client/Data /client/data; do
                    if [ -d "${candidate}" ]; then
                      client_data="${candidate}"
                      break
                    fi
                  done
                  if [ -z "${client_data}" ]; then
                    client_data="$(find /client -maxdepth 4 -type d \( -name Data -o -name data \) -print -quit || true)"
                  fi
                  test -n "${client_data}" && test -d "${client_data}" || {
                    echo 'Expected a WoW 5.4.8 client Data/ directory beneath /client.' >&2
                    exit 1
                  }
                  rm -rf /work/extract
                  mkdir -p /work/extract
                  ln -s "${client_data}" /work/extract/Data
                  cd /work/extract
                  /opt/skyfire/bin/mapextractor
                  db2_count="$(find db2 -maxdepth 1 -type f -name '*.db2' | wc -l)"
                  test "${db2_count}" -ge 21 || {
                    echo "Expected at least 21 DB2 files, found ${db2_count}." >&2
                    exit 1
                  }
                  rm -rf /data/db2
                  mv db2 /data/db2
              volumeMounts:
                - name: client
                  mountPath: /client
                  readOnly: true
                - name: data
                  mountPath: /data
                - name: work
                  mountPath: /work
          volumes:
            - name: client
              persistentVolumeClaim:
                claimName: skyfire-client-files
            - name: data
              persistentVolumeClaim:
                claimName: skyfire-data-rwx
            - name: work
              emptyDir: {}
