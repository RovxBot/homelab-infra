---
# Read-only NFS PV for the WoW 5.4.8 build 18414 client on NAS #2.
# Source: 192.168.1.154:/volume1/Plex Media/Games/MOP-5.4.8
apiVersion: v1
kind: PersistentVolume
metadata:
  # Separate PV identity lets the fresh MoP app bind the read-only client data.
  name: nfs-wow-mop-client-mop
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  mountOptions:
    - nfsvers=3
    - nolock
    - ro
  nfs:
    server: 192.168.1.154
    path: "/volume1/Plex Media/Games/MOP-5.4.8"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: skyfire-client-files
  namespace: mop
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: nfs
  volumeName: nfs-wow-mop-client-mop
  resources:
    requests:
      storage: 100Gi
