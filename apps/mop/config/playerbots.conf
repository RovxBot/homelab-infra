[worldserver]
# Dedicated RNDBOT accounts are auto-created incrementally. Their password is
# injected at runtime from the SOPS-encrypted skyfire-playerbots Secret; it is
# never stored in this ConfigMap or reused from a player/database credential.
# SkyFire legacy accounts cap passwords at 16 characters.
Playerbots.Enable = 1
# Temporary client-crash isolation: keep random bots offline after the managed restart.
Playerbots.RandomBots.Enable = 0
Playerbots.RandomBots.MaxBots = 250
Playerbots.RandomBots.AccountPrefix = "RNDBOT"
Playerbots.RandomBots.LoginInterval = 250
Playerbots.RandomBots.MaxPendingLogins = 4
Playerbots.RandomBots.LoginsPerTick = 1
Playerbots.RandomBotJoinLfg = 1
Playerbots.RandomBotJoinLfg.MaxBots = 20
Playerbots.RandomBotJoinLfg.LevelRange = 5
Playerbots.DeleteRandomBotAccounts = 0
Playerbots.AutoCreate.OnStartup = 1
Playerbots.AutoCreate.AccountCount = 250
Playerbots.AutoCreate.AccountPassword = "${PLAYERBOTS_ACCOUNT_PASSWORD}"
Playerbots.AutoCreate.CharactersPerAccount = 1
Playerbots.AutoCreate.AlliancePct = 50
Playerbots.AutoCreate.TankPct = 20
Playerbots.AutoCreate.HealerPct = 20
Playerbots.AutoCreate.Level = 90
Playerbots.AutoCreate.MinLevel = 1
Playerbots.AutoCreate.MaxLevel = 90
Playerbots.AutoCreate.InitOnCreate = 0
Playerbots.AutoCreate.TeleportOnInit = 1
Playerbots.Init.PerTick = 2
Playerbots.Gear.MinQuality = 2
Playerbots.Gear.MaxQuality = 3
