[worldserver]
DataDir = "/data"
LogsDir = ""
BindIP = "0.0.0.0"
WorldServerPort = 8085
RealmID = 1
# SkyFire defaults a missing value to expansion 1 and clamps every account to
# that cap during world login. Build 18414 supports Mists of Pandaria (4).
Expansion = 4
# Temporary client-crash isolation: minimise the initial continent object set.
# The core clamps this setting to its safe 45-yard minimum.
Visibility.Distance.Continents = 45
# Normal continent transports are temporarily disabled in the world DB;
# this config revision restarts the server so it reloads that narrow test state.
LoginDatabaseInfo = "${DB_HOST};${DB_PORT};${DB_USER};${DB_PASSWORD};skyfire_auth"
WorldDatabaseInfo = "${DB_HOST};${DB_PORT};${DB_USER};${DB_PASSWORD};skyfire_world"
CharacterDatabaseInfo = "${DB_HOST};${DB_PORT};${DB_USER};${DB_PASSWORD};skyfire_characters"
LoginDatabase.WorkerThreads = 1
LoginDatabase.SynchThreads = 1
WorldDatabase.WorkerThreads = 1
WorldDatabase.SynchThreads = 1
CharacterDatabase.WorkerThreads = 1
CharacterDatabase.SynchThreads = 2
WorldDatabase.AutoSetup = 1
WorldDatabase.AutoCreate = 0
WorldDatabase.AutoBaseline = 0
WorldDatabase.AllowUpdateHashMismatch = 0
WorldDatabase.SqlPath = "/opt/skyfire/sql"
WorldDatabase.BaseSqlFile = "/opt/skyfire/sql/world_database.sql"
CharacterDatabase.AutoSetup = 1
CharacterDatabase.AutoCreate = 0
CharacterDatabase.AutoBaseline = 0
CharacterDatabase.AllowUpdateHashMismatch = 0
CharacterDatabase.SqlPath = "/opt/skyfire/sql"
Console.Enable = 0
Ra.Enable = 0
SOAP.Enabled = 0
Appender.Console = 1,5,0
Logger.root = 2,Console
