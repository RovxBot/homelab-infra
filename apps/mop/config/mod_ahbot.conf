[worldserver]
# Five dedicated, non-loginable listing owners were provisioned by the
# skyfire-ahbot-owner-bootstrap Job after the MoP character schema initialized.
# They must never be used for players or playerbots.
AuctionHouseBot.EnableSeller = true
AuctionHouseBot.GUIDs = 1000,1001,1002,1003,1004
AuctionHouseBot.ItemsPerCycle = 150
AuctionHouseBot.MinutesBetweenSellCycle = 1
AuctionHouseBot.MinutesBetweenBuyCycle = 1
AuctionHouseBot.ReturnExpiredAuctionItemsToBot = false
AuctionHouseBot.ListingExpireTimeInSecondsMin = 3600
AuctionHouseBot.ListingExpireTimeInSecondsMax = 172800
AuctionHouseBot.Alliance.AuctioneerGuid = 0
AuctionHouseBot.Horde.AuctioneerGuid = 0
AuctionHouseBot.Neutral.AuctioneerGuid = 0
# Start the new realm with a seller-managed market. Buyers remain off until
# there is enough real player supply to make automatic purchasing meaningful.
AuctionHouseBot.Alliance.MinItems = 5000
AuctionHouseBot.Alliance.MaxItems = 5000
AuctionHouseBot.Horde.MinItems = 5000
AuctionHouseBot.Horde.MaxItems = 5000
AuctionHouseBot.Neutral.MinItems = 5000
AuctionHouseBot.Neutral.MaxItems = 5000
AuctionHouseBot.Buyer.Enabled = false
