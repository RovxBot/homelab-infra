apiVersion: batch/v1
kind: CronJob
metadata:
  name: skyfire-client-extract
spec:
  # Bind skyfire-client-files to a WoW 5.4.8 build 18414 client, then start a
  # one-off Job from this CronJob. Full mmaps generation can take hours.
  suspend: true
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 604800
      activeDeadlineSeconds: 172800
      backoffLimit: 0
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: extract
              image: ghcr.io/rovxbot/skyfire-mop:core-7d71dc05a4dcb2a1ea4916302c692794aaa9a364-fb822bbc0abad93e8d9fdf690df5ad4b7c32fc2a@sha256:753c1d841e99e4dcb4479b7a2b81643e898f105b1005b409cfe572a6ed170c26
              imagePullPolicy: Always
              resources:
                requests:
                  cpu: "4"
                  memory: 8Gi
                limits:
                  cpu: "6"
                  memory: 16Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                privileged: false
              command:
                - sh
                - -ec
                - |
                  client_data=""
                  for candidate in /client/Data /client/data; do
                    if [ -d "${candidate}" ]; then
                      client_data="${candidate}"
                      break
                    fi
                  done
                  if [ -z "${client_data}" ]; then
                    client_data="$(find /client -maxdepth 4 -type d \( -name Data -o -name data \) -print -quit || true)"
                  fi
                  test -n "${client_data}" && test -d "${client_data}" || {
                    echo 'Expected a WoW 5.4.8 client Data/ directory beneath /client.' >&2
                    exit 1
                  }
                  rm -rf /work/extract
                  mkdir -p /work/extract
                  ln -s "${client_data}" /work/extract/Data
                  cd /work/extract
                  /opt/skyfire/bin/mapextractor
                  /opt/skyfire/bin/vmap4extractor
                  /opt/skyfire/bin/vmap4assembler Buildings vmaps
                  /opt/skyfire/bin/mmaps_generator
                  # mapextractor writes DBC and DB2 files to separate output
                  # directories; worldserver expects both beneath DataDir.
                  rm -rf /data/dbc /data/db2 /data/maps /data/vmaps /data/mmaps
                  mv dbc db2 maps vmaps mmaps /data/
              volumeMounts:
                - name: client
                  mountPath: /client
                  readOnly: true
                - name: data
                  mountPath: /data
                - name: work
                  mountPath: /work
          volumes:
            - name: client
              persistentVolumeClaim:
                claimName: skyfire-client-files
            - name: data
              persistentVolumeClaim:
                claimName: skyfire-data-rwx
            - name: work
              emptyDir: {}
