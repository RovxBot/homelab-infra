apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mop
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      homelab.cooked.beer/owner: sam
configMapGenerator:
  - name: skyfire-config
    files:
      - worldserver.conf=config/worldserver.conf
      - authserver.conf=config/authserver.conf
    options:
      disableNameSuffixHash: false
resources:
  - namespace.yaml
  - mariadb-init-configmap.yaml
  - mariadb-pvc.yaml
  - mariadb-service.yaml
  - mariadb-statefulset.yaml
  - data-pvc-rwx.yaml
  - client-files-pv.yaml
  - authserver-service.yaml
  - authserver-deployment.yaml
  - worldserver-service.yaml
  - worldserver-deployment.yaml
  - client-extract-cronjob.yaml
  - client-db2-extract-cronjob.yaml
  - ../../secrets/mop-mariadb-auth.enc.yaml
