apiVersion: apps/v1
kind: Deployment
metadata:
  name: skyfire-authserver
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: skyfire-authserver
  template:
    metadata:
      labels:
        app: skyfire-authserver
    spec:
      automountServiceAccountToken: false
      # The launcher routes both legacy-auth and world traffic to this node.
      nodeSelector:
        kubernetes.io/hostname: metal8
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: render-config
          image: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          command:
            - sh
            - -ec
            - |
              escape_sed_replacement() {
                printf '%s' "$1" | sed 's/[\\&|]/\\&/g'
              }
              host="$(escape_sed_replacement "$DB_HOST")"
              port="$(escape_sed_replacement "$DB_PORT")"
              user="$(escape_sed_replacement "$DB_USER")"
              password="$(escape_sed_replacement "$DB_PASSWORD")"
              # Init containers can run again after a node restart. Replace
              # the existing read-only config atomically instead of truncating it.
              staging="$(mktemp /config/.authserver.conf.XXXXXX)"
              trap 'rm -f "$staging"' EXIT
              sed \
                -e "s|\${DB_HOST}|${host}|g" \
                -e "s|\${DB_PORT}|${port}|g" \
                -e "s|\${DB_USER}|${user}|g" \
                -e "s|\${DB_PASSWORD}|${password}|g" \
                /config-template/authserver.conf > "$staging"
              chmod 0440 "$staging"
              mv "$staging" /config/authserver.conf
          env:
            - name: DB_HOST
              value: skyfire-mariadb.mop.svc.cluster.local
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mop-mariadb-auth
                  key: MARIADB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mop-mariadb-auth
                  key: MARIADB_PASSWORD
          volumeMounts:
            - name: config-template
              mountPath: /config-template
              readOnly: true
            - name: config
              mountPath: /config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            privileged: false
      containers:
        - name: authserver
          # Build and push this immutable-source tag with the SkyFire MoP image
          # workflow before applying this rollout.
          image: ghcr.io/rovxbot/skyfire-mop:core-e9658923c192413496093f6df2f263f85cb05ba4-fc70ceebce646a2e82129c52dcf7546a3debe0fb@sha256:cfe57aae778528b2d830a960807ac063ab9ad0047849a0a818ad330b4daa505b
          imagePullPolicy: Always
          command: [/opt/skyfire/bin/authserver]
          ports:
            - name: auth
              containerPort: 3724
              hostPort: 3724
              hostIP: 192.168.1.84
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: auth
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 120
          readinessProbe:
            tcpSocket:
              port: auth
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: auth
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            privileged: false
          volumeMounts:
            - name: config
              mountPath: /opt/skyfire/etc
              readOnly: true
      volumes:
        - name: config-template
          configMap:
            name: skyfire-config
        - name: config
          emptyDir: {}
