# Reference for secrets/birdnet-go.enc.yaml's config.yaml key. Replace the
# placeholders in a private temporary file, then encrypt with SOPS.
main:
  name: Cooked Birds
  timeas24h: true
birdnet:
  # Current operator selection; dynamic lowering remains disabled below.
  threshold: 0.7
  sensitivity: 1.0
  overlap: 2.2
  threads: 2
  locale: en-us
  latitude: REPLACE_WITH_HOME_ASSISTANT_LATITUDE
  longitude: REPLACE_WITH_HOME_ASSISTANT_LONGITUDE
  locationconfigured: true
  usexnnpack: true
  rangefilter:
    model: v3
    modelpath: /config/.config/birdnet-go/models/shared/geomodel_v3.0.2_fp16.onnx
    labelspath: /config/.config/birdnet-go/models/shared/geomodel_v3.0.2_labels.txt
    # Seasonal occurrence score, distinct from detection confidence.
    threshold: 0.05
    passunmappedspecies: false
models:
  enabled: [birdnet, perch_v2]
perch:
  modelpath: /config/.config/birdnet-go/models/perch-v2/perch_v2_australia-east_no_dft.onnx
  labelpath: /config/.config/birdnet-go/models/perch-v2/perch_v2_australia-east_labels.txt
  overridethreshold: false
realtime:
  interval: 15
  dynamicthreshold:
    enabled: false
    trigger: 0.95
    min: 0.9
    validhours: 24
  falsepositivefilter:
    level: 2 # Moderate; repeat confirmations rather than a single prediction.
  audio:
    # Network audio only; no ALSA device or host networking required.
    sources: []
    soundlevel:
      enabled: true
      interval: 10
    export:
      enabled: true
      path: /data/clips
      type: flac
      retention:
        policy: usage
        maxusage: 75%
        minclips: 0
        keepspectrograms: false
        checkinterval: 15
  rtsp:
    streams:
      - name: Shed front
        url: REPLACE_WITH_SHED_FRONT_RTSPS_URL
        type: rtsp
        transport: tcp
        enabled: true
        models: [birdnet, perch_v2]
      - name: Shed
        url: REPLACE_WITH_SHED_RTSPS_URL
        type: rtsp
        transport: tcp
        enabled: true
        models: [birdnet, perch_v2]
  mqtt:
    enabled: true
    broker: tcp://mosquitto.mqtt.svc.cluster.local:1883
    topic: birdnet
    username: birdnet
    password: REPLACE_WITH_BIRDNET_MQTT_PASSWORD
    # Events must not be replayed as fresh phone alerts after reconnecting.
    retain: false
    homeassistant:
      enabled: true
      discovery_prefix: homeassistant
      device_name: Cooked Birds
  privacyfilter:
    enabled: true
    confidence: 0.05
    vad:
      enabled: true
      threshold: 0.35
  birdweather:
    enabled: false
  weather:
    provider: none
webserver:
  enabled: true
  port: "8080"
  allowembedding: false
security:
  host: birds.cooked.beer
  baseurl: https://birds.cooked.beer
  tlsMode: ""
  privatemode: true
  publicaccess:
    liveaudio: false
  allowsubnetbypass:
    enabled: false
  basicauth:
    enabled: false
  sessionduration: 24h
  sessionsecret: REPLACE_WITH_RANDOM_SESSION_SECRET
  oauthProviders:
    - provider: oidc
      enabled: true
      issuerUrl: https://login.microsoftonline.com/345cd18b-5bee-4ac4-b729-a3f7059a28f3/v2.0
      clientId: REPLACE_WITH_ENTRA_APP_ID
      clientSecret: REPLACE_WITH_ENTRA_APP_SECRET
      redirectUri: https://birds.cooked.beer/auth/openid-connect/callback
      scopes: [openid, profile, email]
      userId: sam@cooked.beer,rachael@cooked.beer
output:
  sqlite:
    enabled: true
    path: /data/birdnet.db
  mysql:
    enabled: false
sentry:
  enabled: false
