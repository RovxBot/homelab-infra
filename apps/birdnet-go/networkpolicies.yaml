# Documentary while Cilium policyEnforcementMode is "never". Native OIDC
# and private mode protect data independently of NetworkPolicy enforcement.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: birdnet-go-ingress
spec:
  podSelector:
    matchLabels:
      app: birdnet-go
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
          podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - protocol: TCP
          port: 8080
