apiVersion: v1
kind: Service
metadata:
  name: birdnet-go
spec:
  selector:
    app: birdnet-go
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: birdnet-dashboard
spec:
  selector:
    app: birdnet-go
  ports:
    - name: dashboard
      port: 8090
      targetPort: dashboard
