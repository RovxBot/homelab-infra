# These policies are documentary while Cilium policyEnforcementMode is "never".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: koito-ingress
  namespace: koito
spec:
  podSelector:
    matchLabels:
      app: koito
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
          podSelector:
            matchLabels:
              app: cloudflared
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: gatus
              app.kubernetes.io/name: gatus
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: homepage
          podSelector:
            matchLabels:
              app: homepage
        - podSelector:
            matchLabels:
              app: koito-lastfm-bridge
      ports:
        - protocol: TCP
          port: 4110
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: koito-lastfm-bridge-ingress
  namespace: koito
spec:
  podSelector:
    matchLabels:
      app: koito-lastfm-bridge
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: gatus
              app.kubernetes.io/name: gatus
      ports:
        - protocol: TCP
          port: 9078
