apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: koito

labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      homelab.cooked.beer/owner: sam

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - lastfm-bridge.yaml
  - service.yaml
  - networkpolicies.yaml
  - ../../secrets/koito.enc.yaml

configMapGenerator:
  - name: koito-lastfm-bridge-config
    files:
      - config.json=lastfm-bridge-config.json
