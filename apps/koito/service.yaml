apiVersion: v1
kind: Service
metadata:
  name: koito-web
  namespace: koito
spec:
  selector:
    app: koito
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: koito-lastfm-bridge
  namespace: koito
spec:
  selector:
    app: koito-lastfm-bridge
  ports:
    - name: http
      port: 9078
      targetPort: http
