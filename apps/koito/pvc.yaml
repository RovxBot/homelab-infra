apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: koito-data
  namespace: koito
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: koito-lastfm-bridge-data
  namespace: koito
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
