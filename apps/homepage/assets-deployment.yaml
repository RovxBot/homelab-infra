apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage-assets
  namespace: homepage
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: homepage-assets
  template:
    metadata:
      labels:
        app: homepage-assets
    spec:
      serviceAccountName: homepage
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: sync-assets
          image: bitnami/kubectl@sha256:08afc880eea24f36572644ccae85fb3e573a6ff1b7161135a3ae9a5eab222df2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsUser: 101
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          command:
            - sh
            - -c
            - |
              set -eu
              dst="/usr/share/nginx/html/assets/998981.jpg"
              if [ -s "$dst" ]; then
                echo "Asset already present: $dst"
                exit 0
              fi

              artifact_url="$(kubectl -n flux-system get gitrepository flux-system -o jsonpath='{.status.artifact.url}' 2>/dev/null || true)"
              if [ -z "$artifact_url" ]; then
                echo "No Flux artifact URL found; skipping"
                exit 0
              fi

              tmp="$(mktemp -d)"
              trap 'rm -rf "$tmp"' EXIT

              echo "Fetching Flux artifact: $artifact_url"
              if ! curl -fsSL --retry 3 --retry-delay 2 --max-time 60 -o "$tmp/artifact.tar.gz" "$artifact_url"; then
                echo "Failed to fetch artifact; skipping"
                exit 0
              fi

              path="$(tar -tzf "$tmp/artifact.tar.gz" | grep -E '(^|/)998981\.jpg$' | head -n 1 || true)"
              if [ -n "$path" ]; then
                echo "Extracting $path -> $dst"
                mkdir -p "$(dirname "$dst")"
                tar -xzf "$tmp/artifact.tar.gz" -O "$path" > "$dst"
                exit 0
              fi

              b64_path="$(tar -tzf "$tmp/artifact.tar.gz" | grep -E '(^|/)998981\.jpg\.b64$' | head -n 1 || true)"
              if [ -z "$b64_path" ]; then
                echo "No jpg or base64 asset found in artifact; skipping"
                exit 0
              fi

              echo "Decoding $b64_path -> $dst"
              mkdir -p "$(dirname "$dst")"
              tar -xzf "$tmp/artifact.tar.gz" -O "$b64_path" | base64 -D > "$dst" 2>/dev/null || \
              tar -xzf "$tmp/artifact.tar.gz" -O "$b64_path" | base64 -d > "$dst"
          volumeMounts:
            - name: assets
              mountPath: /usr/share/nginx/html
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31-alpine@sha256:26b5d4920434bc4d8c17a68201488cf4b3d2391f0d25305cdfe66ccdc6d18aa4
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8080
              name: http
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: assets
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: assets
          persistentVolumeClaim:
            claimName: homepage-assets
        - name: tmp
          emptyDir: {}
