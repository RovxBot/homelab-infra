apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-mcp
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: gitea-mcp
  template:
    metadata:
      labels:
        app: gitea-mcp
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: docker.gitea.com/gitea-mcp-server:1.12.0@sha256:7abff2c58718f80fc777b9b1a04885332e182814921cc61967313eea4136c3b2
          command: [/app/gitea-mcp]
          args: [-t, http, -p, "8080", -oauth]
          env:
            # Also the OAuth issuer, so this must be Gitea's public HTTPS URL.
            - name: GITEA_HOST
              value: https://git.cooked.beer
            - name: GITEA_MCP_PUBLIC_URL
              value: https://git.cooked.beer
            # Match Codex's enabled_tools; enforce the boundary on the server.
            - name: GITEA_TOOLS
              value: >-
                get_me,repo_read,branch_read,commit_read,get_repository_tree,get_file_contents,get_dir_contents,search_issues,list_issues,issue_read,issue_write,label_read,label_write,list_pull_requests,pull_request_read,pull_request_write,pull_request_review_write,actions_run_read,actions_run_write,release_read,release_write
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-mcp
spec:
  selector:
    app: gitea-mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Documentary while Cilium policyEnforcementMode is never.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gitea-mcp-ingress
spec:
  podSelector:
    matchLabels:
      app: gitea-mcp
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
