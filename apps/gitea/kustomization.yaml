apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gitea
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      homelab.cooked.beer/owner: sam
resources:
  - namespace.yaml
  - storage.yaml
  - database.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - networkpolicies.yaml
  - mirroring.yaml
  - ../../secrets/gitea.enc.yaml
  - ../../secrets/gitea-admin.enc.yaml
  - ../../secrets/gitea-entra.enc.yaml
  - ../../secrets/gitea-mirror.enc.yaml
configMapGenerator:
  - name: gitea-protection
    files:
      - protect.py=../../ops/gitea/protect.py
      - protected-repositories.json=../../ops/gitea/protected-repositories.json
  - name: gitea-mirror-config
    envs: [mirror.env]
