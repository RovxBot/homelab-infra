apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gitea
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      homelab.cooked.beer/owner: sam
resources:
  - namespace.yaml
  - storage.yaml
  - database.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - networkpolicies.yaml
  - mirroring.yaml
  - backups.yaml
  - synchronization.yaml
  - ../../secrets/gitea.enc.yaml
  - ../../secrets/gitea-admin.enc.yaml
  - ../../secrets/gitea-entra.enc.yaml
  - ../../secrets/gitea-mirror.enc.yaml
  - ../../secrets/gitea-backup.enc.yaml
configMapGenerator:
  - name: gitea-synchronization
    files:
      - synchronize.py=../../ops/gitea/synchronize.py
      - discussions.py=../../ops/gitea/discussions.py
      - protected-repositories.json=../../ops/gitea/protected-repositories.json
  - name: gitea-database-init
    files:
      - 01-gitea.sh=../../ops/gitea/database-init.sh
  - name: gitea-protection-scripts
    files:
      - protect.py=../../ops/gitea/protect.py
      - protected-repositories.json=../../ops/gitea/protected-repositories.json
  - name: gitea-mirror-config
    envs: [mirror.env]
  - name: gitea-backup-scripts
    files:
      - backup.sh=../../ops/gitea/backup.sh
