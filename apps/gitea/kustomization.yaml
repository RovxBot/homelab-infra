apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gitea
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      homelab.cooked.beer/owner: sam
resources:
  - namespace.yaml
  - storage.yaml
  - database.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - ../../secrets/gitea.enc.yaml
  - ../../secrets/gitea-admin.enc.yaml
