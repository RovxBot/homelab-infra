apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbrew
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openbrew
  template:
    metadata:
      labels:
        app: openbrew
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-runtime
          image: austinderbique/openbrew:sha-024137b34f88eb1a5d24fb34b247dfb6408d4cf7@sha256:e3e4f198e727a00ab2d9cfe06d476b82958132f1b542b2a997728252096b025a
          command: [/bin/bash, /adapter/prepare.sh]
          envFrom:
            - configMapRef:
                name: openbrew-config
          env:
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openbrew
                  key: MSSQL_SA_PASSWORD
            - name: OPENBREW_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: openbrew
                  key: OPENBREW_CONNECTION_STRING
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: runtime
              mountPath: /runtime
            - name: sso
              mountPath: /adapter
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: openbrew
          image: austinderbique/openbrew:sha-024137b34f88eb1a5d24fb34b247dfb6408d4cf7@sha256:e3e4f198e727a00ab2d9cfe06d476b82958132f1b542b2a997728252096b025a
          command: [xsp4, --address=127.0.0.1, --port=8085, --nonstop, --applications=/:/runtime]
          workingDir: /runtime
          envFrom:
            - configMapRef:
                name: openbrew-config
          env:
            - name: OPENBREW_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: openbrew
                  key: OPENBREW_CONNECTION_STRING
            - name: OPENBREW_BLOG_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: openbrew
                  key: OPENBREW_CONNECTION_STRING
            - name: OPENBREW_PROXY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openbrew
                  key: OPENBREW_PROXY_PASSWORD
          startupProbe:
            exec:
              command: [/bin/bash, -ec, 'exec 3<>/dev/tcp/127.0.0.1/8085']
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            exec:
              command: [/bin/bash, -ec, 'exec 3<>/dev/tcp/127.0.0.1/8085; printf "GET /healthz HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; head -1 <&3 | grep -q " 200 "']
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: [/bin/bash, -ec, 'exec 3<>/dev/tcp/127.0.0.1/8085']
            periodSeconds: 30
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: runtime
              mountPath: /runtime
            - name: media
              mountPath: /runtime/Media
            - name: tmp
              mountPath: /tmp
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
          args:
            - --http-address=0.0.0.0:4180
            - --upstream=http://127.0.0.1:8085/
            - --provider=oidc
            - --provider-display-name=Microsoft Entra ID
            - --oidc-issuer-url=https://login.microsoftonline.com/345cd18b-5bee-4ac4-b729-a3f7059a28f3/v2.0
            - --redirect-url=https://openbrew.cooked.beer/oauth2/callback
            - --scope=openid profile email
            - --oidc-email-claim=preferred_username
            - --insecure-oidc-skip-nonce=false
            - --skip-claims-from-profile-url=true
            - --authenticated-emails-file=/sso/allowed-emails
            - --code-challenge-method=S256
            - --reverse-proxy=true
            - --trusted-proxy-ip=10.245.0.0/16
            - --skip-provider-button=true
            - --pass-basic-auth=true
            - --pass-user-headers=true
            - --prefer-email-to-user=false
            - --cookie-name=__Host-openbrew
            - --cookie-secure=true
            - --cookie-httponly=true
            - --cookie-samesite=lax
            - --cookie-expire=8h
            - --session-cookie-minimal=true
            - --cookie-csrf-per-request=true
            - --cookie-csrf-expire=10m
            - --whitelist-domain=login.microsoftonline.com
            - --request-logging=false
            - --standard-logging=true
            - --auth-logging=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: openbrew
                  key: OAUTH2_PROXY_CLIENT_ID
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: openbrew
                  key: OAUTH2_PROXY_CLIENT_SECRET
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: openbrew
                  key: OAUTH2_PROXY_COOKIE_SECRET
            - name: OAUTH2_PROXY_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openbrew
                  key: OPENBREW_PROXY_PASSWORD
          ports:
            - name: http
              containerPort: 4180
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: sso
              mountPath: /sso
              readOnly: true
      volumes:
        - name: runtime
          emptyDir:
            sizeLimit: 1Gi
        - name: media
          persistentVolumeClaim:
            claimName: openbrew-media
        - name: sso
          configMap:
            name: openbrew-sso
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
