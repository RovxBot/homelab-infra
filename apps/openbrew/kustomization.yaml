apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openbrew
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      homelab.cooked.beer/owner: sam
resources:
  - namespace.yaml
  - pvc.yaml
  - database.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicies.yaml
  - ../../secrets/openbrew.enc.yaml
configMapGenerator:
  - name: openbrew-config
    envs: [settings.env]
  - name: openbrew-sso
    files: [EntraSso.cs, prepare.sh, allowed-emails]
