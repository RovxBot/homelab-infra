apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbrew-db
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openbrew-db
  template:
    metadata:
      labels:
        app: openbrew-db
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 90
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sqlserver
          image: ghcr.io/rovxbot/openbrew-sqlserver:2022-CU25-ubuntu-22.04@sha256:e07b9699a2b749969f19d86563ceeea22bd3a69f7f1db85a8d1ac4bdaf0c6f56
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: Express
            - name: MSSQL_MEMORY_LIMIT_MB
              value: "1536"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openbrew
                  key: MSSQL_SA_PASSWORD
          ports:
            - name: sql
              containerPort: 1433
          startupProbe:
            tcpSocket:
              port: sql
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            exec:
              command: [/bin/bash, -ec, 'SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q "SELECT 1" -b -o /dev/null']
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket:
              port: sql
            periodSeconds: 30
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              # Microsoft's sqlservr executable carries this file capability.
              # It cannot execute when the capability is outside the bounding set.
              add: [NET_BIND_SERVICE]
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openbrew-database
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
