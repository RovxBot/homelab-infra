# Documentary while Cilium policy enforcement is "never". The web application
# binds loopback and independently rejects requests without proxy credentials.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbrew-ingress
spec:
  podSelector:
    matchLabels:
      app: openbrew
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: homepage
      ports:
        - protocol: TCP
          port: 4180
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbrew-database
spec:
  podSelector:
    matchLabels:
      app: openbrew-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: openbrew
      ports:
        - protocol: TCP
          port: 1433
