apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  releaseName: cilium
  maxHistory: 3
  chartRef:
    kind: OCIRepository
    name: cilium
    namespace: flux-system
  install:
    # Keep a failed CNI release present for diagnosis; do not uninstall it
    # between retries.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
    timeout: 15m
  upgrade:
    # A CNI rollback can remove resources needed to diagnose a failed rollout.
    # Retry the reviewed revision in place instead of attempting an automatic
    # rollback. The maintenance runbook defines the human recovery gates.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
    timeout: 15m
  values:
    # Cilium owns the primary CNI. The temporary migration wrapper was removed
    # after the completed cutover.
    kubeProxyReplacement: false
    routingMode: tunnel
    tunnelProtocol: geneve
    tunnelPort: 6081
    cni:
      install: true
      customConf: false
      uninstall: false
      # kube-proxy remains enabled, so Cilium's native HostPort implementation
      # is unavailable. Chain the standard CNI portmap plugin to support the
      # narrow WotLK hostPort migration without changing service handling.
      chainingMode: portmap
    ipam:
      mode: cluster-pool
      operator:
        clusterPoolIPv4PodCIDRList:
          - 10.245.0.0/16
        clusterPoolIPv4MaskSize: 24
    policyEnforcementMode: never
    bpf:
      # Talos forwards Kubernetes DNS to the host by default. Keep legacy host
      # routing until that separate Talos/DNS design is explicitly changed.
      hostLegacyRouting: true
      # Talos already mounts bpffs; Cilium must not attempt to mount it.
      autoMount:
        enabled: false
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    tls:
      # L7/TLS policy features remain disabled. Retain a
      # dedicated, labelled namespace for future TLS-aware policies rather
      # than granting the agent access to kube-system Secrets.
      readSecretsOnlyFromSecretsNamespace: true
      secretsNamespace:
        create: true
        name: cilium-secrets
      secretSync:
        enabled: false
    # The chart owns its dedicated Secret namespace, so make it conform to the
    # cluster's namespace governance policy from the first render.
    secretsNamespaceLabels:
      homelab.cooked.beer/owner: platform
      pod-security.kubernetes.io/enforce: restricted
      pod-security.kubernetes.io/enforce-version: latest
      pod-security.kubernetes.io/audit: restricted
      pod-security.kubernetes.io/audit-version: latest
      pod-security.kubernetes.io/warn: restricted
      pod-security.kubernetes.io/warn-version: latest
    securityContext:
      # Talos does not permit Kubernetes workloads to load kernel modules.
      # This is Cilium's current default capability set without SYS_MODULE.
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
          - SYSLOG
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    # Preserve dataplane availability during a deliberate or chart-driven
    # Cilium agent rollout.
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
    priorityClassName: system-node-critical
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
    hubble:
      enabled: false
      relay:
        enabled: false
      ui:
        enabled: false
    # No existing policy requires L7 matching. Keep the agent-side L7 proxy
    # and the standalone Envoy DaemonSet disabled until that changes.
    l7Proxy: false
    # This lab deliberately uses Gatus and Upptime rather than a Prometheus
    # stack. Disable every chart-provided metrics endpoint/ServiceMonitor.
    prometheus:
      enabled: false
      metricsService: false
      serviceMonitor:
        enabled: false
    envoy:
      enabled: false
      prometheus:
        enabled: false
        serviceMonitor:
          enabled: false
    operator:
      replicas: 2
      priorityClassName: system-cluster-critical
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
        maxUnavailable: null
      # Keep CNI management and Cilium Node status publication enabled in the
      # completed primary-CNI state.
      unmanagedPodWatcher:
        restart: true
      removeNodeTaints: true
      setNodeTaints: true
      setNodeNetworkStatus: true
      prometheus:
        enabled: false
        metricsService: false
        serviceMonitor:
          enabled: false
