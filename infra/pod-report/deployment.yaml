apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-report
  namespace: homepage
  labels:
    homelab.cooked.beer/component: cluster-health
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: pod-report
  template:
    metadata:
      labels:
        app: pod-report
        homelab.cooked.beer/component: cluster-health
    spec:
      serviceAccountName: pod-report
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: generator
          image: bitnami/kubectl@sha256:ae71f848f057a71029d092e98548cabf7cd17b11da0adad0a8f4145a9c87c830
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-lc"]
          args:
            - |
              set -eu
              out="/work/index.html"
              tmp="/work/index.html.tmp"
              health="/work/health.json"
              health_tmp="/work/health.json.tmp"

              # A request-timeout override bypasses kubectl's implicit in-cluster
              # fallback. Configure the API explicitly; tokenFile follows rotation
              # without copying the token into this file or process arguments.
              export KUBECONFIG=/var/run/pod-report/kubeconfig
              cat > "$KUBECONFIG" <<EOF
              apiVersion: v1
              kind: Config
              clusters:
              - name: in-cluster
                cluster:
                  server: https://kubernetes.default.svc:443
                  certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              users:
              - name: pod-report
                user:
                  tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              contexts:
              - name: pod-report
                context:
                  cluster: in-cluster
                  user: pod-report
                  namespace: homepage
              current-context: pod-report
              EOF

              valid_status_rows() {
                # Keep independently valid rows, but flag any incomplete or
                # malformed evidence before numeric coercion or health checks.
                awk -v kind="$1" '
                  BEGIN {
                    FS = (kind == "jobs" ? "[|]" : "\t")
                    name = "[a-z0-9][-a-z0-9.]*"
                    namespaced = "^" name "/" name "$"
                    timestamp = "^[0-9][0-9][0-9][0-9]-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]([.][0-9]+)?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])$"
                  }
                  function condition(value) { return value ~ /^(True|False|Unknown)$/ }
                  function flux_identity(value, parts, label, subdomain) {
                    label = "[a-z0-9]([-a-z0-9]*[a-z0-9])?"
                    subdomain = label "([.]" label ")*"
                    return split(value, parts, "/") == 3 && length(parts[1]) <= 63 && parts[1] ~ ("^" label "$") && parts[2] ~ /^(Kustomization|HelmRelease)$/ && length(parts[3]) <= 253 && parts[3] ~ ("^" subdomain "$")
                  }
                  function count(value, optional) {
                    # Kubernetes replica and failed-Job counters are int32.
                    return (optional && value == "") || (value ~ /^[0-9]+$/ && length(value) <= 10 && value + 0 <= 2147483647)
                  }
                  {
                    valid = 0
                    if (kind == "replicas")
                      valid = NF == 3 && $1 ~ namespaced && count($2, 0) && count($3, 1)
                    else if (kind == "nodes")
                      valid = NF == 5 && $1 ~ ("^" name "$") && condition($2) && condition($3) && condition($4) && condition($5)
                    else if (kind == "pvcs")
                      valid = NF == 2 && $1 ~ namespaced && $2 ~ /^(Pending|Bound|Lost)$/
                    else if (kind == "flux") {
                      valid = NF == 3 && flux_identity($1) && ($3 == "" || $3 ~ /^(true|false)$/)
                      # Explicit allowlist: staged Kubescape has never reconciled.
                      # Omit this neutral row; never synthesize Ready=True.
                      if (valid && $1 == "kubescape/HelmRelease/kubescape" && $3 == "true" && $2 == "") next
                      # The Ready= marker distinguishes an absent condition from
                      # a present condition with a malformed or missing status.
                      # A suspended resource cannot establish successful health
                      # from a stale Ready=True; retain explicit failure conditions.
                      valid = valid && $2 ~ /^Ready=(True|False|Unknown)$/ && ($3 != "true" || $2 != "Ready=True")
                    }
                    else if (kind == "longhornVolumes")
                      valid = NF == 3 && $1 ~ ("^" name "$") && $2 ~ /^(creating|attached|detached|attaching|detaching|deleting)$/ && $3 ~ /^(healthy|degraded|faulted|unknown)$/
                    else if (kind == "longhornNodes")
                      valid = NF == 2 && $1 ~ ("^" name "$") && condition($2)
                    else if (kind == "jobs")
                      valid = NF == 4 && $1 ~ namespaced && count($2, 1) && ($3 == "" || $3 ~ timestamp) && ($4 == "" || condition($4))
                    if (valid && kind == "flux") print $1 "\t" substr($2, 7) "\t" $3
                    else if (valid) print
                    else invalid = 1
                  }
                  END { exit (invalid ? 2 : 0) }
                '
              }

              # Check return codes: 0 = ok, 1 = confirmed unhealthy, 2 = unknown.
              # Discard stdout from failed queries, including any partial results.
              nodes_ok() {
                node_statuses="$(kubectl --request-timeout=15s get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{range .status.conditions[?(@.type=="Ready")]}{.status}{end}{"\t"}{range .status.conditions[?(@.type=="DiskPressure")]}{.status}{end}{"\t"}{range .status.conditions[?(@.type=="MemoryPressure")]}{.status}{end}{"\t"}{range .status.conditions[?(@.type=="PIDPressure")]}{.status}{end}{"\n"}{end}')" || { node_statuses=""; collection_reason="query_failed"; return 2; }
                [ -n "$node_statuses" ] || { collection_reason="empty_result"; return 2; }
                node_statuses="$(printf '%s\n' "$node_statuses" | valid_status_rows nodes)" || collection_reason="invalid_data"
                [ -z "$node_statuses" ] || printf '%s\n' "$node_statuses" | awk -F '\t' '$2 != "True" || $3 != "False" || $4 != "False" || $5 != "False" { bad = 1 } END { exit bad }' || return $?
                [ -z "${collection_reason:-}" ] || return 2
              }

              deployments_ok() {
                deployment_statuses="$(kubectl --request-timeout=15s get deployments -A -o jsonpath='{range .items[*]}{.metadata.namespace}{"/"}{.metadata.name}{"\t"}{.spec.replicas}{"\t"}{.status.availableReplicas}{"\n"}{end}')" || { deployment_statuses=""; collection_reason="query_failed"; return 2; }
                [ -z "$deployment_statuses" ] && return 0
                deployment_statuses="$(printf '%s\n' "$deployment_statuses" | valid_status_rows replicas)" || collection_reason="invalid_data"
                [ -z "$deployment_statuses" ] || printf '%s\n' "$deployment_statuses" | awk -F '\t' '$2 + 0 != $3 + 0 { bad = 1 } END { exit bad }' || return $?
                [ -z "${collection_reason:-}" ] || return 2
              }

              statefulsets_ok() {
                statefulset_statuses="$(kubectl --request-timeout=15s get statefulsets -A -o jsonpath='{range .items[*]}{.metadata.namespace}{"/"}{.metadata.name}{"\t"}{.spec.replicas}{"\t"}{.status.readyReplicas}{"\n"}{end}')" || { statefulset_statuses=""; collection_reason="query_failed"; return 2; }
                [ -z "$statefulset_statuses" ] && return 0
                statefulset_statuses="$(printf '%s\n' "$statefulset_statuses" | valid_status_rows replicas)" || collection_reason="invalid_data"
                [ -z "$statefulset_statuses" ] || printf '%s\n' "$statefulset_statuses" | awk -F '\t' '$2 + 0 != $3 + 0 { bad = 1 } END { exit bad }' || return $?
                [ -z "${collection_reason:-}" ] || return 2
              }

              daemonsets_ok() {
                daemonset_statuses="$(kubectl --request-timeout=15s get daemonsets -A -o jsonpath='{range .items[*]}{.metadata.namespace}{"/"}{.metadata.name}{"\t"}{.status.desiredNumberScheduled}{"\t"}{.status.numberAvailable}{"\n"}{end}')" || { daemonset_statuses=""; collection_reason="query_failed"; return 2; }
                [ -z "$daemonset_statuses" ] && return 0
                daemonset_statuses="$(printf '%s\n' "$daemonset_statuses" | valid_status_rows replicas)" || collection_reason="invalid_data"
                [ -z "$daemonset_statuses" ] || printf '%s\n' "$daemonset_statuses" | awk -F '\t' '$2 + 0 != $3 + 0 { bad = 1 } END { exit bad }' || return $?
                [ -z "${collection_reason:-}" ] || return 2
              }

              pvcs_ok() {
                pvc_statuses="$(kubectl --request-timeout=15s get persistentvolumeclaims -A -o jsonpath='{range .items[*]}{.metadata.namespace}{"/"}{.metadata.name}{"\t"}{.status.phase}{"\n"}{end}')" || { pvc_statuses=""; collection_reason="query_failed"; return 2; }
                [ -z "$pvc_statuses" ] && return 0
                pvc_statuses="$(printf '%s\n' "$pvc_statuses" | valid_status_rows pvcs)" || collection_reason="invalid_data"
                [ -z "$pvc_statuses" ] || printf '%s\n' "$pvc_statuses" | awk -F '\t' '$2 != "Bound" { bad = 1 } END { exit bad }' || return $?
                [ -z "${collection_reason:-}" ] || return 2
              }

              flux_ok() {
                flux_statuses="$(kubectl --request-timeout=15s get kustomizations.kustomize.toolkit.fluxcd.io,helmreleases.helm.toolkit.fluxcd.io -A -o jsonpath='{range .items[*]}{.metadata.namespace}{"/"}{.kind}{"/"}{.metadata.name}{"\t"}{range .status.conditions[?(@.type=="Ready")]}{.type}{"="}{.status}{end}{"\t"}{.spec.suspend}{"\n"}{end}')" || { flux_statuses=""; collection_reason="query_failed"; return 2; }
                [ -n "$flux_statuses" ] || { collection_reason="empty_result"; return 2; }
                flux_statuses="$(printf '%s\n' "$flux_statuses" | valid_status_rows flux)" || collection_reason="invalid_data"
                # Neutral suspensions alone cannot establish observed health.
                [ -n "$flux_statuses" ] || { collection_reason="${collection_reason:-empty_result}"; return 2; }
                printf '%s\n' "$flux_statuses" | awk -F '\t' '$2 != "True" { bad = 1 } END { exit bad }' || return $?
                [ -z "${collection_reason:-}" ] || return 2
              }

              longhorn_volumes_ok() {
                volume_statuses="$(kubectl --request-timeout=15s get volumes.longhorn.io -n longhorn-system -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.state}{"\t"}{.status.robustness}{"\n"}{end}')" || { volume_statuses=""; collection_reason="query_failed"; return 2; }
                [ -n "$volume_statuses" ] || { collection_reason="empty_result"; return 2; }
                volume_statuses="$(printf '%s\n' "$volume_statuses" | valid_status_rows longhornVolumes)" || collection_reason="invalid_data"
                # A detached Longhorn volume normally reports unknown robustness because
                # it has no running engine to assess. Treat it as healthy only when it is
                # scheduled; attached volumes must still have full replica health.
                [ -z "$volume_statuses" ] || printf '%s\n' "$volume_statuses" | awk -F '\t' '\
                  ($2 == "attached" && $3 != "healthy") ||
                  ($2 == "detached" && $3 != "unknown") ||
                  ($2 != "attached" && $2 != "detached") { bad = 1 }
                  END { exit bad }
                ' || return $?
                [ -z "${collection_reason:-}" ] || return 2
              }

              longhorn_nodes_ok() {
                node_statuses="$(kubectl --request-timeout=15s get nodes.longhorn.io -n longhorn-system -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{range .status.conditions[?(@.type=="Schedulable")]}{.status}{end}{"\n"}{end}')" || { node_statuses=""; collection_reason="query_failed"; return 2; }
                [ -n "$node_statuses" ] || { collection_reason="empty_result"; return 2; }
                node_statuses="$(printf '%s\n' "$node_statuses" | valid_status_rows longhornNodes)" || collection_reason="invalid_data"
                [ -z "$node_statuses" ] || printf '%s\n' "$node_statuses" | awk -F '\t' '$2 != "True" { bad = 1 } END { exit bad }' || return $?
                [ -z "${collection_reason:-}" ] || return 2
              }

              recent_jobs_ok() {
                job_statuses="$(kubectl --request-timeout=15s get jobs -A -o jsonpath='{range .items[*]}{.metadata.namespace}{"/"}{.metadata.name}{"|"}{.status.failed}{"|"}{.status.startTime}{"|"}{range .status.conditions[?(@.type=="Complete")]}{.status}{end}{"\n"}{end}')" || { job_statuses=""; collection_reason="query_failed"; return 2; }
                [ -z "$job_statuses" ] && return 0
                job_statuses="$(printf '%s\n' "$job_statuses" | valid_status_rows jobs)" || collection_reason="invalid_data"
                cutoff_epoch="$(date -u -d '6 hours ago' +%s)" || return 2
                job_failures=""
                while IFS='|' read -r job_name failed_count start_time complete; do
                  [ "$complete" != True ] || continue
                  [ "${failed_count:-0}" -gt 0 ] || continue
                  # Keep checking other Jobs if one timestamp cannot be evaluated.
                  [ -n "$start_time" ] || { collection_reason="invalid_data"; continue; }
                  start_epoch="$(date -u -d "$start_time" +%s)" || { collection_reason="invalid_data"; continue; }
                  [ "$start_epoch" -lt "$cutoff_epoch" ] || job_failures="${job_failures}${job_name} failed-attempts=${failed_count}\n"
                done <<EOF
              $job_statuses
              EOF
                [ -z "$job_failures" ] || return 1
                [ -z "${collection_reason:-}" ] || return 2
              }

              check_health() {
                check_category="$1"; check_name="$2"; shift 2
                collection_reason=""
                check_result=0
                "$@" || check_result=$?
                case "$check_result" in
                  0) ;;
                  1) failed_checks="$failed_checks $check_category" ;;
                  *) collection_reason="${collection_reason:-check_failed}" ;;
                esac
                if [ -n "$collection_reason" ]; then
                  unknown_checks="$unknown_checks $check_category"
                  # Keys are the nine fixed subcheck names below; reasons are
                  # allowlisted constants. Never include command output here.
                  case "$collection_reason" in
                    query_failed|empty_result|invalid_data) ;;
                    *) collection_reason="check_failed" ;;
                  esac
                  collection_errors="${collection_errors}${collection_errors:+,}\"${check_name}\":\"${collection_reason}\""
                fi
              }

              check_state() {
                # A category can have both confirmed failures and unknown subchecks.
                case " $failed_checks " in *" $1 "*) printf failed; return ;; esac
                case " $unknown_checks " in *" $1 "*) printf unknown; return ;; esac
                printf ok
              }

              diagnostic_json() {
                awk 'BEGIN { printf "[" } NF && count < 10 { gsub(/[^a-zA-Z0-9_.:\/ =-]/, "_"); printf "%s\"%s\"", (count++ ? "," : ""), $0 } END { printf "]" }'
              }

              evaluate_health() {
                deployment_statuses=""; statefulset_statuses=""; daemonset_statuses=""
                flux_statuses=""; pvc_statuses=""; job_failures=""
                failed_checks=""; unknown_checks=""; collection_errors=""

                check_health nodes nodes nodes_ok
                check_health workloads deployments deployments_ok
                check_health workloads statefulsets statefulsets_ok
                check_health workloads daemonsets daemonsets_ok
                check_health pvcs pvcs pvcs_ok
                check_health flux flux flux_ok
                check_health longhorn longhornVolumes longhorn_volumes_ok
                check_health longhorn longhornNodes longhorn_nodes_ok
                check_health recentJobs recentJobs recent_jobs_ok

                health_status="healthy"
                [ -z "$unknown_checks" ] || health_status="unknown"
                [ -z "$failed_checks" ] || health_status="unhealthy"

                # JSON-safe, bounded diagnostic identities. These status fields
                # cannot contain credentials; omit arbitrary object messages.
                workload_failures="$(printf '%s\n' "$deployment_statuses" "$statefulset_statuses" "$daemonset_statuses" | awk -F '\t' 'NF == 3 && $2 + 0 != $3 + 0 { print $1 " desired=" $2 " available=" ($3 + 0) }')"
                flux_failures="$(printf '%s\n' "$flux_statuses" | awk -F '\t' 'NF && $2 != "True" { print $1 " Ready=" $2 }')"
                pvc_failures="$(printf '%s\n' "$pvc_statuses" | awk -F '\t' 'NF && $2 != "Bound" { print $1 " phase=" $2 }')"
                {
                  printf '{"status":"%s","observedAt":"%s","checks":{"nodes":"%s","workloads":"%s","pvcs":"%s","flux":"%s","longhorn":"%s","recentJobs":"%s"},"failures":{' \
                    "$health_status" "$now" "$(check_state nodes)" "$(check_state workloads)" "$(check_state pvcs)" "$(check_state flux)" "$(check_state longhorn)" "$(check_state recentJobs)"
                  printf '"workloads":'; printf '%s\n' "$workload_failures" | diagnostic_json
                  printf ',"flux":'; printf '%s\n' "$flux_failures" | diagnostic_json
                  printf ',"pvcs":'; printf '%s\n' "$pvc_failures" | diagnostic_json
                  printf ',"recentJobs":'; printf '%b' "${job_failures:-}" | diagnostic_json
                  printf '},"collectionErrors":{%s}}\n' "$collection_errors"
                } > "$health_tmp"
                mv "$health_tmp" "$health"
              }

              assessment_health() {
                assessment_rows="$(kubectl --request-timeout=15s get configmap kubescape-assessment-status -n kubescape -o go-template='{{index .data "vulnerability.lastSuccessfulAssessmentAt"}}|{{index .data "posture.lastSuccessfulAssessmentAt"}}|{{index .data "vulnerability.state"}}|{{index .data "posture.state"}}|{{index .data "database.built"}}|{{index .data "coverage.state"}}|{{index .data "coverage.validUntil"}}|{{index .data "coverage.expected"}}|{{index .data "coverage.healthy"}}')" || assessment_rows="||||||||"
                IFS='|' read -r vulnerability_time posture_time vulnerability_state posture_state database_built coverage_state coverage_until coverage_expected coverage_healthy <<EOF
              $assessment_rows
              EOF
                assessment_now="$(date -u +%s)"
                mode_health() {
                  # Accept only timestamps, never copy arbitrary ConfigMap text.
                  evidence_epoch=""
                  case "$2" in
                    ????-??-??T*Z) evidence_epoch="$(date -u -d "$2" +%s 2>/dev/null)" || evidence_epoch="" ;;
                  esac
                  evidence_age=null
                  mode_state=unknown
                  if [ -n "$evidence_epoch" ]; then
                    evidence_age=$((assessment_now - evidence_epoch))
                    if [ "$evidence_age" -ge 0 ]; then
                      mode_state=stale
                      [ "$evidence_age" -gt "$3" ] || mode_state=healthy
                    else
                      evidence_age=null
                    fi
                  fi
                  case "$4" in healthy|stale|failed|unknown) attempt_state="$4" ;; *) attempt_state=unknown ;; esac
                  if [ "$1" != database ]; then
                    # Preserve evidence age, but never mask the latest failure
                    # or interrupted/unknown attempt with a cached success.
                    case "$attempt_state" in
                      failed|unknown) mode_state="$attempt_state" ;;
                      stale) [ "$mode_state" = unknown ] || mode_state=stale ;;
                    esac
                  fi
                  printf '"%s":{"state":"%s","evidenceAgeSeconds":%s,"maximumAgeSeconds":%s,"lastAttemptState":"%s"}' "$1" "$mode_state" "$evidence_age" "$3" "$attempt_state"
                }
                vulnerability_health="$(mode_health vulnerability "$vulnerability_time" 259200 "$vulnerability_state")"
                posture_health="$(mode_health posture "$posture_time" 93600 "$posture_state")"
                database_health="$(mode_health database "$database_built" 1209600 unknown)"
                database_epoch="$(date -u -d "$database_built" +%s 2>/dev/null)" || database_epoch=""
                database_freshness=unknown
                if [ -n "$database_epoch" ]; then
                  database_age=$((assessment_now - database_epoch))
                  if [ "$database_age" -ge 0 ]; then
                    database_freshness=expired
                    [ "$database_age" -gt 1209600 ] || database_freshness=grace
                    [ "$database_age" -gt 604800 ] || database_freshness=fresh
                  fi
                fi
                # Report only bounded aggregate counts, never private inventory rows.
                cohort_state=unknown
                cohort_expected=null
                cohort_healthy=null
                case "$coverage_expected:$coverage_healthy" in
                  [1-9]:[0-9])
                    if [ "$coverage_healthy" -le "$coverage_expected" ]; then
                      cohort_expected="$coverage_expected"
                      cohort_healthy="$coverage_healthy"
                      if [ "$coverage_state" = healthy ] && [ "$coverage_healthy" = "$coverage_expected" ]; then
                        case "$coverage_until" in
                          ????-??-??T*Z)
                            cohort_expiry="$(date -u -d "$coverage_until" +%s 2>/dev/null)" || cohort_expiry=""
                            if [ -n "$cohort_expiry" ]; then
                              cohort_state=stale
                              [ "$cohort_expiry" -lt "$assessment_now" ] || cohort_state=healthy
                            fi ;;
                        esac
                      fi
                    fi ;;
                esac
                assessment_state="$cohort_state"
                case "$vulnerability_health$posture_health$database_health" in *'"state":"stale"'*) assessment_state=stale ;; esac
                case "$vulnerability_health$posture_health$database_health" in *'"state":"unknown"'*) assessment_state=unknown ;; esac
                case "$vulnerability_health$posture_health$database_health" in *'"state":"failed"'*) assessment_state=failed ;; esac
                printf '{"status":"%s","observedAt":"%s","databaseFreshness":"%s",%s,%s,%s,"coverage":{"state":"%s","expected":%s,"healthy":%s}}\n' "$assessment_state" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$database_freshness" "$vulnerability_health" "$posture_health" "$database_health" "$cohort_state" "$cohort_expected" "$cohort_healthy" > /work/kubescape-health.json.tmp
                mv /work/kubescape-health.json.tmp /work/kubescape-health.json
              }

              reporter_health() {
                # Existing list-only Job RBAC; select the exact CronJob controller owner.
                # Latest attempt wins, even if an older successful Job is retained.
                rows="$(kubectl --request-timeout=15s get jobs -n "$1" -o jsonpath='{range .items[*]}{.metadata.creationTimestamp}{"|"}{range .metadata.ownerReferences[?(@.controller==true)]}{.kind}{"/"}{.name}{end}{"|"}{range .status.conditions[?(@.type=="Complete")]}{.status}{end}{"|"}{range .status.conditions[?(@.type=="Failed")]}{.status}{end}{"|"}{.status.completionTime}{"\n"}{end}' 2>/dev/null)" || { printf unknown; return; }
                latest="$(printf '%s\n' "$rows" | awk -F '|' -v owner="CronJob/$2" '$2 == owner' | sort -r | head -n 1)"
                [ -n "$latest" ] || { printf unknown; return; }
                IFS='|' read -r created owner complete failed finished <<EOF
              $latest
              EOF
                case "$created" in ????-??-??T*Z) ;; *) printf unknown; return ;; esac
                started="$(date -u -d "$created" +%s 2>/dev/null)" || { printf unknown; return; }
                current="$(date -u +%s)"
                [ "$started" -le "$current" ] || { printf unknown; return; }
                [ "$failed" != True ] || { printf failed; return; }
                [ "$complete" = True ] || { printf unknown; return; }
                case "$finished" in ????-??-??T*Z) ;; *) printf unknown; return ;; esac
                ended="$(date -u -d "$finished" +%s 2>/dev/null)" || { printf unknown; return; }
                [ "$ended" -ge "$started" ] && [ "$ended" -le "$current" ] || { printf unknown; return; }
                [ "$((current - started))" -le "$3" ] || { printf stale; return; }
                printf healthy
              }

              kyverno_controllers_health() {
                rows="$(kubectl --request-timeout=15s get deployments -n kyverno -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.metadata.generation}{"|"}{.status.observedGeneration}{"|"}{.spec.replicas}{"|"}{.status.availableReplicas}{"\n"}{end}' 2>/dev/null)" || { printf unknown; return; }
                printf '%s\n' "$rows" | awk -F '|' '
                  BEGIN { required["kyverno-admission-controller"]=2; required["kyverno-background-controller"]=1;
                          required["kyverno-reports-controller"]=1; required["kyverno-cleanup-controller"]=1 }
                  $1 in required {
                    seen[$1]++
                    if (NF != 5 || $2 !~ /^[0-9]+$/ || $3 !~ /^[0-9]+$/ || $4 !~ /^[0-9]+$/) unknown=1
                    else if ($2 != $3 || $4+0 < required[$1] || $5+0 != $4+0) failed=1
                  }
                  END { for (name in required) if (seen[name] != 1) unknown=1;
                        print (failed ? "failed" : unknown ? "unknown" : "healthy") }
                '
              }

              security_reporting_health() {
                native_state="$(reporter_health monitoring security-incident-publisher 1200)"
                policy_state="$(reporter_health kyverno kyverno-github-issue-sync 5400)"
                controllers_state="$(kyverno_controllers_health)"
                reporting_state=healthy
                for state in "$native_state" "$policy_state" "$controllers_state"; do
                  [ "$state" = healthy ] || reporting_state=unhealthy
                done
                printf '{"status":"%s","observedAt":"%s","nativePublisher":"%s","kyvernoPublisher":"%s","kyvernoControllers":"%s"}\n' "$reporting_state" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$native_state" "$policy_state" "$controllers_state" > /work/security-reporting-health.json.tmp
                mv /work/security-reporting-health.json.tmp /work/security-reporting-health.json
              }

              while true; do
                now="$(date -u '+%Y-%m-%d %H:%M:%SZ')"
                assessment_health
                security_reporting_health
                evaluate_health
                {
                  cat <<'HTML'
              <!doctype html>
              <html lang="en">
              <head>
                <meta charset="utf-8">
                <meta name="viewport" content="width=device-width, initial-scale=1">
                <title>Pods by Node</title>
                <style>
                  body { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; margin: 16px; }
                  h1 { font-size: 18px; margin: 0 0 10px; }
                  h2 { font-size: 14px; margin: 18px 0 6px; }
                  .muted { color: #666; font-size: 12px; }
                  pre { background: #0b1020; color: #e6edf3; padding: 12px; border-radius: 10px; overflow: auto; }
                  code { white-space: pre; }
                  a { color: #3b82f6; text-decoration: none; }
                </style>
              </head>
              <body>
              HTML
                  printf '<h1>Pods by Node</h1><div class="muted">Generated %s</div>\n' "$now"
                  echo '<div class="muted">Tip: search in-page (Ctrl/Cmd+F).</div>'
                  echo '<pre><code>'

                  for node in $(kubectl --request-timeout=15s get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | sort); do
                    echo ""
                    echo "### ${node}"
                    kubectl --request-timeout=15s get pods -A \
                      --field-selector "spec.nodeName=${node},status.phase=Running" \
                      -o custom-columns='NAMESPACE:.metadata.namespace,POD:.metadata.name,READY:.status.containerStatuses[*].ready' \
                      --no-headers 2>/dev/null | sort || true
                  done

                  echo '</code></pre>'
                  cat <<'HTML'
              </body>
              </html>
              HTML
                } > "$tmp"
                mv "$tmp" "$out"
                sleep 30
              done
          volumeMounts:
            - name: web
              mountPath: /work
            - name: kubeconfig
              mountPath: /var/run/pod-report
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  report=/work/health.json
                  [ -f "$report" ]
                  [ -r "$report" ]
                  [ -s "$report" ]
                  modified="$(stat -c %Y "$report")"
                  now="$(date +%s)"
                  age=$((now - modified))
                  # Allow five minutes between completed reports, including collection.
                  [ "$age" -ge 0 ] && [ "$age" -le 300 ]
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

        - name: web
          image: nginxinc/nginx-unprivileged:1.31-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: web
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

      volumes:
        - name: web
          emptyDir: {}
        - name: kubeconfig
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
