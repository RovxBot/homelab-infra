apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  # Receiver TLS Secrets are encrypted at rest; encrypted manifests are
  # reconciled by the Kubescape Flux Kustomization's SOPS decryption.
  # Receiver workload and agent HTTP export remain disabled separately.
  - ../../secrets
  - recurring/rbac.yaml
  - recurring/cronjobs.yaml
  - collector
  # Explicitly approved disposable R1000 runtime acceptance on metal3.
  - ../../ops/security-collector/acceptance/trigger
configMapGenerator:
  - name: kubescape-assessment-code
    namespace: kubescape
    files:
      - recurring/runner.py
      - recurring/client-bundle.json
  - name: kubescape-assessment-config
    namespace: kubescape
    files:
      - recurring/config.json
      - grype-database.json
