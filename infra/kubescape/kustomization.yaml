apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  # Receiver TLS Secrets are encrypted at rest; encrypted manifests are
  # reconciled by the Kubescape Flux Kustomization's SOPS decryption.
  # Eight-node native HTTPS exporter is active; retain SOPS trust.
  - ../../secrets
  - recurring/rbac.yaml
  - recurring/cronjobs.yaml
  # Independent authenticated native HTTPS receiver; disposable trigger retired.
  - receiver
configMapGenerator:
  - name: kubescape-assessment-code
    namespace: kubescape
    files:
      - recurring/runner.py
      - recurring/client-bundle.json
  - name: kubescape-assessment-config
    namespace: kubescape
    files:
      - recurring/config.json
      - grype-database.json
