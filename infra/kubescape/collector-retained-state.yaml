apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: security-collector-state
  namespace: kubescape
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    homelab.cooked.beer/owner: sam
spec:
  storageClassName: longhorn
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi
