apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubescape
  namespace: kubescape
spec:
  # Qualified scanners. Chart schedulers stay suspended; recurring/ owns bounded scheduling.
  suspend: false
  interval: 30m
  releaseName: kubescape
  chart:
    spec:
      chart: kubescape-operator
      version: 1.42.0
      sourceRef:
        kind: HelmRepository
        name: kubescape
        namespace: flux-system
      interval: 12h
  install:
    crds: Create
    remediation:
      retries: 0
  upgrade:
    # Add the runtime binding CRD; do not replace existing scanner/storage CRDs.
    crds: Create
    remediation:
      retries: 0
  timeout: 10m
  # configurationScan enables a daily CronJob independently of continuousScan.
  # The chart has no scheduler-disable value. Keep that job suspended as well.
  postRenderers:
    - kustomize:
        patches:
          # Kubescape documents node-agent ConfigMap native HTTP exporter.
          # This exact chart 1.42.0 byte-test prevents silent chart drift.
          # No Synchronizer, second JSON exporters map or unsupported env.
          - target:
              version: v1
              kind: ConfigMap
              name: node-agent
              namespace: kubescape
            patch: |-
              - op: test
                path: /data/config.json
                value: "{\n    \"applicationProfileServiceEnabled\": true,\n    \"prometheusExporterEnabled\": false,\n    \"runtimeDetectionEnabled\": true,\n    \"httpDetectionEnabled\": false,\n    \"networkServiceEnabled\": false,\n    \"malwareDetectionEnabled\": false,\n    \"hostSensorEnabled\": false,\n    \"hostSensorInterval\": \"5m\",\n    \"nodeProfileServiceEnabled\": false,\n    \"networkStreamingEnabled\": false,\n    \"maxImageSize\": 5.36870912e+08,\n    \"maxSBOMSize\": 2.097152e+07,\n    \"maxTsProfileSize\": 2.097152e+06,\n    \"sbomGenerationEnabled\": false,\n    \"enableEmbeddedSBOMs\": false,\n    \"seccompServiceEnabled\": false,\n    \"seccompProfileBackend\": \"storage\",\n    \"sandboxSeccompEnabled\": false,\n    \"initialDelay\": \"2m\",\n    \"updateDataPeriod\": \"10m\",\n    \"nodeProfileInterval\": \"10m\",\n    \"networkStreamingInterval\": \"2m\",\n    \"maxSniffingTimePerContainer\": \"24h\",\n    \"includeNamespaces\": \"memos\",\n    \"excludeLabels\":null,\n    \"exporters\": {\n      \"alertManagerExporterUrls\":[],\n      \"stdoutExporter\":true,\n      \"syslogExporterURL\": \"\"\n    },\n    \"excludeJsonPaths\":null,\n    \"ruleCooldown\": {\n        \"ruleCooldownDuration\": \"1h\",\n        \"ruleCooldownAfterCount\": 1,\n        \"ruleCooldownOnProfileFailure\": true,\n        \"ruleCooldownMaxSize\": 20000\n    },\n    \"alertDeduplication\": {\n        \"bypass\": false\n    },\n    \"dCapSys\": false,\n    \"dDns\": false,\n    \"dExec\": false,\n    \"dExit\": false,\n    \"dFork\": false,\n    \"dHardlink\": false,\n    \"dHttp\": false,\n    \"dIouring\": false,\n    \"dNetwork\": false,\n    \"dOpen\": false,\n    \"dPtrace\": false,\n    \"dRandomx\": false,\n    \"dSeccomp\": false,\n    \"dSsh\": false,\n    \"dSymlink\": false,\n    \"dKmod\": false,\n    \"dUnshare\": false,\n    \"dBpf\": false,\n    \"dTop\": false,\n    \"hostMonitoringEnabled\": false\n}\n"
              - op: replace
                path: /data/config.json
                value: "{\n    \"applicationProfileServiceEnabled\": true,\n    \"prometheusExporterEnabled\": false,\n    \"runtimeDetectionEnabled\": true,\n    \"httpDetectionEnabled\": false,\n    \"networkServiceEnabled\": false,\n    \"malwareDetectionEnabled\": false,\n    \"hostSensorEnabled\": false,\n    \"hostSensorInterval\": \"5m\",\n    \"nodeProfileServiceEnabled\": false,\n    \"networkStreamingEnabled\": false,\n    \"maxImageSize\": 5.36870912e+08,\n    \"maxSBOMSize\": 2.097152e+07,\n    \"maxTsProfileSize\": 2.097152e+06,\n    \"sbomGenerationEnabled\": false,\n    \"enableEmbeddedSBOMs\": false,\n    \"seccompServiceEnabled\": false,\n    \"seccompProfileBackend\": \"storage\",\n    \"sandboxSeccompEnabled\": false,\n    \"initialDelay\": \"2m\",\n    \"updateDataPeriod\": \"10m\",\n    \"nodeProfileInterval\": \"10m\",\n    \"networkStreamingInterval\": \"2m\",\n    \"maxSniffingTimePerContainer\": \"24h\",\n    \"includeNamespaces\": \"memos\",\n    \"excludeLabels\":null,\n    \"exporters\": {\n      \"httpExporterConfig\": {\"url\":\"https://security-receiver.kubescape.svc:8443\",\"method\":\"POST\",\"tokenFile\":\"/var/run/secrets/kubescape.io/api-token/token\",\"timeoutSeconds\":8,\"maxAlertsPerMinute\":30,\"enableAlertBulking\":false},\n      \"alertManagerExporterUrls\":[],\n      \"stdoutExporter\":true,\n      \"syslogExporterURL\": \"\"\n    },\n    \"excludeJsonPaths\":null,\n    \"ruleCooldown\": {\n        \"ruleCooldownDuration\": \"1h\",\n        \"ruleCooldownAfterCount\": 1,\n        \"ruleCooldownOnProfileFailure\": true,\n        \"ruleCooldownMaxSize\": 20000\n    },\n    \"alertDeduplication\": {\n        \"bypass\": false\n    },\n    \"dCapSys\": false,\n    \"dDns\": false,\n    \"dExec\": false,\n    \"dExit\": false,\n    \"dFork\": false,\n    \"dHardlink\": false,\n    \"dHttp\": false,\n    \"dIouring\": false,\n    \"dNetwork\": false,\n    \"dOpen\": false,\n    \"dPtrace\": false,\n    \"dRandomx\": false,\n    \"dSeccomp\": false,\n    \"dSsh\": false,\n    \"dSymlink\": false,\n    \"dKmod\": false,\n    \"dUnshare\": false,\n    \"dBpf\": false,\n    \"dTop\": false,\n    \"hostMonitoringEnabled\": false\n}\n"
          # Runtime canary: detection-only rules and bounded eBPF permissions.
          - target:
              group: kubescape.io
              version: v1
              kind: RuntimeRuleAlertBinding
              name: all-rules-all-pods
            patch: |-
              - op: replace
                path: /spec
                value:
                  namespaceSelector:
                    matchExpressions:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values:
                      - homepage
                      - memos
                      - kubescape-runtime-test
                  rules:
                  - ruleID: R0001
                  - ruleID: R0004
                  - ruleID: R0007
                  - ruleID: R1000
                  - ruleID: R1002
          - target:
              group: apps
              version: v1
              kind: DaemonSet
              name: node-agent
              namespace: kubescape
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/securityContext/allowPrivilegeEscalation
                value: false
              - op: add
                path: /spec/template/spec/containers/0/securityContext/capabilities/drop
                value:
                - ALL
              - op: add
                path: /spec/template/spec/containers/0/securityContext/seccompProfile
                value:
                  type: Unconfined
              - op: remove
                path: /spec/template/spec/containers/0/securityContext/seLinuxOptions
              - op: add
                path: /spec/template/spec/affinity
                value:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                        - matchExpressions:
                            - key: kubernetes.io/hostname
                              operator: In
                              values: [metal3, metal6]
          # Agent kubelet access follows the two-node cohort; collector has none.
          - target:
              group: rbac.authorization.k8s.io
              version: v1
              kind: ClusterRole
              name: node-agent
            patch: |-
              - op: test
                path: /rules/0
                value:
                  apiGroups:
                  - ''
                  resources:
                  - nodes
                  - nodes/proxy
                  - services
                  - endpoints
                  - namespaces
                  - configmaps
                  verbs:
                  - get
                  - watch
                  - list
              - op: replace
                path: /rules/0/resources
                value:
                - nodes
                - services
                - endpoints
                - namespaces
                - configmaps
              - op: add
                path: /rules/-
                value:
                  apiGroups:
                  - ''
                  resources:
                  - nodes/proxy
                  resourceNames:
                  - metal3
                  - metal6
                  verbs:
                  - get
          # Wait for the new mirror before the engine checks the retained cache.
          # This init never mounts/writes the DB PVC. Pin it with the mirror below.
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: kubevuln
              namespace: kubescape
            patch: |-
              - op: add
                path: /spec/template/spec/initContainers
                value:
                  - name: wait-for-verified-mirror
                    image: quay.io/kubescape/grype-offline-db@sha256:cd4f2c18691791b2c7754a619d011eb388773cdc39c973b621cbcc4217356449
                    command:
                      - sh
                      - -ec
                      - >-
                        for attempt in $(seq 1 60); do if wget -T 5 -q -O /tmp/grype-mirror-latest.json http://grype-offline-db:80/databases/v6/latest.json && cmp -s /tmp/grype-mirror-latest.json /www/databases/v6/latest.json; then exit 0; fi; sleep 2; done; exit 1
                    resources:
                      requests: {cpu: 10m, memory: 32Mi}
                      limits: {cpu: 100m, memory: 128Mi}
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      runAsNonRoot: true
                      capabilities:
                        drop: [ALL]
                    volumeMounts:
                      - name: tmp-dir
                        mountPath: /tmp
          # Chart has no manual-only switch: only operator mounts this data.
          # Provision Kubevuln but disable its automatic event/command routing.
          - target:
              version: v1
              kind: ConfigMap
              name: ks-capabilities
              namespace: kubescape
            patch: |-
              - op: replace
                path: /data/capabilities
                value: >-
                  {"capabilities":{"admissionController":"disable","agentRuntimePosture":"disable","autoUpgrading":"disable","configurationScan":"enable","continuousScan":"disable","httpDetection":"disable","kubescapeOffline":"enable","malwareDetection":"disable","manageWorkloads":"disable","networkEventsStreaming":"disable","networkPolicyService":"disable","nodeProfileService":"disable","nodeSbomGeneration":"disable","nodeScan":"disable","operator":"enable","prometheusExporter":"disable","relevancy":"disable","remediation":"disable","riskAcceptance":"disable","runtimeDetection":"enable","runtimeObservability":"enable","sandboxSeccomp":"disable","scanEmbeddedSBOMs":"disable","seccompProfileBackend":"storage","seccompProfileService":"disable","syncSBOM":"disable","testing":{"nodeAgentMultiplication":{"enabled":false,"replicas":5}},"vexGeneration":"disable","vulnerabilityScan":"enable"},"effectiveCapabilities":{"configurationScan":"enable","httpDetection":"disable","malwareDetection":"disable","networkEventsStreaming":"disable","nodeProfileService":"disable","nodeScan":"disable","vulnerabilityScan":"enable"},"capabilityWarnings":[],"components":{"autoUpdater":{"enabled":false},"cloudSecret":{"create":true,"name":"cloud-secret"},"customCaCertificates":{"name":"custom-ca-certificates"},"kubescape":{"enabled":true},"kubescapeScheduler":{"enabled":true},"kubevuln":{"enabled":false},"kubevulnScheduler":{"enabled":false},"nodeAgent":{"enabled":true},"operator":{"enabled":true},"prometheusExporter":{"enabled":false},"sbomScanner":{"enabled":false},"serviceDiscovery":{"enabled":false},"storage":{"enabled":true},"synchronizer":{"enabled":false}},"configurations":{"excludeJsonPaths":null,"otelUrl":null,"persistence":"enable","priorityClass":{"daemonset":100000100,"enabled":false},"prometheusAnnotations":"disable"},"serviceScanConfig":{"enabled":false,"interval":"1h"}}
          - target:
              group: batch
              version: v1
              kind: CronJob
              name: kubevuln-scheduler
              namespace: kubescape
            patch: |-
              - op: add
                path: /spec/suspend
                value: true
          # Retain findings and DB cache on any future chart removal/rollback.
          - target:
              version: v1
              kind: PersistentVolumeClaim
              name: kubescape-(storage|kubevuln)
              namespace: kubescape
            patch: |-
              - op: add
                path: /metadata/annotations/helm.sh~1resource-policy
                value: keep
          # Manual public-image requests do not use registry credential Secrets.
          - target:
              group: rbac.authorization.k8s.io
              version: v1
              kind: Role
              name: operator
              namespace: kubescape
            patch: |-
              - op: test
                path: /rules/1
                value:
                  apiGroups: [""]
                  resources: [secrets]
                  verbs: [create, get, update, watch, list, patch, delete]
              - op: remove
                path: /rules/1
          # Certificate initialization only patches this release's APIService.
          - target:
              group: rbac.authorization.k8s.io
              version: v1
              kind: ClusterRole
              name: storage-certgen-kubescape
            patch: |-
              - op: add
                path: /rules/0/resourceNames
                value: [v1beta1.spdx.softwarecomposition.kubescape.io]
          - target:
              group: batch
              version: v1
              kind: CronJob
              name: kubescape-scheduler
              namespace: kubescape
            patch: |-
              - op: add
                path: /spec/suspend
                value: true
          # Chart 1.42.0 omits certgen budgets. Merge by name, preserving TLS
          # bootstrap commands, images, security contexts and all other fields.
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: storage
              namespace: kubescape
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: storage
                namespace: kubescape
              spec:
                template:
                  spec:
                    initContainers:
                      - name: certgen-create
                        resources:
                          requests:
                            cpu: 10m
                            memory: 32Mi
                          limits:
                            cpu: 100m
                            memory: 128Mi
                      - name: certgen-patch
                        resources:
                          requests:
                            cpu: 10m
                            memory: 32Mi
                          limits:
                            cpu: 100m
                            memory: 128Mi
  values:
    clusterName: home
    ksNamespace: kubescape
    additionalLabels:
      homelab.cooked.beer/owner: sam
    # Initial canary scope only; do not silently claim cluster-wide coverage.
    includeNamespaces: memos
    excludeNamespaces: ""
    defaultFrameworks:
      - nsa
    certificates:
      strategy: initContainer
    server: ""
    account: ""
    accessKey: ""
    credentials:
      cloudSecret: ""
    capabilities:
      operator: enable
      configurationScan: enable
      continuousScan: disable
      nodeScan: disable
      nodeSbomGeneration: disable
      scanEmbeddedSBOMs: disable
      vulnerabilityScan: enable
      relevancy: disable
      vexGeneration: disable
      runtimeObservability: enable
      networkPolicyService: disable
      networkEventsStreaming: disable
      runtimeDetection: enable
      malwareDetection: disable
      nodeProfileService: disable
      admissionController: disable
      httpDetection: disable
      seccompProfileService: disable
      seccompProfileBackend: storage
      sandboxSeccomp: disable
      manageWorkloads: disable
      syncSBOM: disable
      agentRuntimePosture: disable
      riskAcceptance: disable
      remediation: disable
      autoUpgrading: disable
      kubescapeOffline: enable
      prometheusExporter: disable
      testing:
        nodeAgentMultiplication:
          enabled: false
    global:
      enableClusterWideSecretAccess: false
      # Official chart support for one trusted receiver CA, mounted read-only
      # under /etc/ssl/certs. Secret already exists from merged #2214.
      # Keep default certificate trust; never replace or disable system roots.
      extraCaCertificates:
        enabled: true
        secretName: security-receiver-ca
      apiAuth:
        enabled: true
      kubescapePsp:
        enabled: false
      networkPolicy:
        enabled: false
        createEgressRules: false
      openshift:
        scc:
          enabled: false
    configurations:
      persistence: enable
      prometheusAnnotations: disable
      priorityClass:
        enabled: false
    alertCRD:
      installDefault: true
      scopeClustered: true
      scopeNamespaced: false
    serviceScanConfig:
      enabled: false
    namespaceFilters:
      enabled: false
    nodeAgent:
      image:
        tag: v0.3.310@sha256:99152dbefd07e524418f682882ad300cb74821aaa4e42e6477c42a9fa4686e60
      nodeSelector:
        kubernetes.io/os: linux
      resources:
        requests: {cpu: 100m, memory: 180Mi}
        limits: {cpu: 500m, memory: 1400Mi}
      # v0.3.310 uses Viper AutomaticEnv. Scope runtime independently of scanners.
      env:
        - name: INCLUDENAMESPACES
          value: homepage,memos,kubescape-runtime-test
      privileged: false
      config:
        stdoutExporter: true
        extra:
          hostMonitoringEnabled: false
        hostSensor:
          enabled: false
        prometheusExporter: disable
      sbomScanner:
        enabled: false
      autoscaler:
        enabled: false
      multipleDaemonSets:
        enabled: false
      gVisorStart:
        enabled: false
    # Immutable local mirror; verify DB build age before every manual assessment.
    grypeOfflineDB:
      enabled: true
      image:
        tag: ""
        sha: sha256:cd4f2c18691791b2c7754a619d011eb388773cdc39c973b621cbcc4217356449
        pullPolicy: IfNotPresent
    kubevuln:
      podAnnotations:
        homelab.cooked.beer/grype-index: sha256:cd4f2c18691791b2c7754a619d011eb388773cdc39c973b621cbcc4217356449
      image:
        repository: ghcr.io/rovxbot/kubevuln
        tag: 65ab8b472ec2685fc0c14032717a584dc99f2ff7@sha256:c97020711ba19a215f19f1858a846b2962584fd4e0b7afcb9272d7da915569b2
      resources:
        requests:
          cpu: 300m
          memory: 1Gi
          ephemeral-storage: 1Gi
        limits:
          cpu: 1000m
          memory: 3Gi
          ephemeral-storage: 3Gi
      env:
        - name: CA_MAX_VULN_SCAN_ROUTINES
          value: "1"
        - name: MAXQUEUEDEPTH
          value: "1"
      sbomScanner:
        enabled: false
      config:
        grypeDbPersistence: true
        maxImageSize: 536870912
        maxSBOMSize: 20971520
        scanTimeout: 5m
        cveMatchingMode: "off"
      tmpDirPersistence:
        enabled: false
    kubescape:
      image:
        repository: quay.io/kubescape/kubescape
        tag: v4.0.20@sha256:439bab2d738f8bd27c742b15444cde77e607ce7d769e805ee1bc25605b355060
      downloadArtifacts: false
      skipUpdateCheck: true
      serviceMonitor:
        enabled: false
      resources:
        requests:
          cpu: 250m
          memory: 400Mi
        limits:
          cpu: 600m
          memory: 1Gi
    operator:
      image:
        repository: quay.io/kubescape/operator
        tag: v0.2.209@sha256:b280f5154451d1d075d49e3fade361e934063fe5dc26e18e673f67a4cca3a558
      triggerSecurityFramework: false
      rulesUpdateConfig:
        enabled: false
      env:
        workerConcurrency:
          name: WORKERCONCURRENCY
          value: "1"
      resources:
        requests:
          cpu: 50m
          memory: 100Mi
        limits:
          cpu: 300m
          memory: 300Mi
    storage:
      enabled: true
      image:
        repository: quay.io/kubescape/storage
        tag: v0.0.382@sha256:270e22b65e95de4054d6b9ed3aad2d63296e4941ba1aa49b356d5be94d41863b
      mtls:
        enabled: true
      hostNetwork: false
      mcp:
        enabled: false
        readerClusterRoles: false
      resources:
        requests:
          cpu: 100m
          memory: 400Mi
        limits:
          cpu: 1500m
          memory: 1500Mi
    kubescapeOpsTool:
      image:
        repository: quay.io/kubescape/kubescape-ops-tool
        tag: 0.2.0-r1@sha256:2f1d8c9a76f05049f73ebefa292d4b65ce3ef3811317c4cc023b4df792a592e4
    kubevulnScheduler:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
    kubescapeScheduler:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      requestBody:
        commands:
          - CommandName: kubescapeScan
            args:
              scanV1:
                targetType: framework
                targetNames: [nsa]
                hostScanner: false
                keepLocal: true
    persistence:
      storageClass: longhorn
      accessMode: ReadWriteOnce
      size:
        backingStorage: 5Gi
        kubevuln: 10Gi
