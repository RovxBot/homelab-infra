apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubescape
  namespace: kubescape
spec:
  # Qualified scanners. Chart schedulers stay suspended; recurring/ owns bounded scheduling.
  suspend: false
  interval: 30m
  releaseName: kubescape
  chart:
    spec:
      chart: kubescape-operator
      version: 1.42.0
      sourceRef:
        kind: HelmRepository
        name: kubescape
        namespace: flux-system
      interval: 12h
  install:
    crds: Create
    remediation:
      retries: 0
  upgrade:
    crds: Skip
    remediation:
      retries: 0
  timeout: 10m
  # configurationScan enables a daily CronJob independently of continuousScan.
  # The chart has no scheduler-disable value. Keep that job suspended as well.
  postRenderers:
    - kustomize:
        patches:
          # Wait for the new mirror before the engine checks the retained cache.
          # This init never mounts/writes the DB PVC. Pin it with the mirror below.
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: kubevuln
              namespace: kubescape
            patch: |-
              - op: add
                path: /spec/template/spec/initContainers
                value:
                  - name: wait-for-verified-mirror
                    image: quay.io/kubescape/grype-offline-db@sha256:cd4f2c18691791b2c7754a619d011eb388773cdc39c973b621cbcc4217356449
                    command:
                      - sh
                      - -ec
                      - >-
                        for attempt in $(seq 1 60); do if wget -T 5 -q -O /tmp/grype-mirror-latest.json http://grype-offline-db:80/databases/v6/latest.json && cmp -s /tmp/grype-mirror-latest.json /www/databases/v6/latest.json; then exit 0; fi; sleep 2; done; exit 1
                    resources:
                      requests: {cpu: 10m, memory: 32Mi}
                      limits: {cpu: 100m, memory: 128Mi}
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      runAsNonRoot: true
                      capabilities:
                        drop: [ALL]
                    volumeMounts:
                      - name: tmp-dir
                        mountPath: /tmp
          # Chart has no manual-only switch: only operator mounts this data.
          # Provision Kubevuln but disable its automatic event/command routing.
          - target:
              version: v1
              kind: ConfigMap
              name: ks-capabilities
              namespace: kubescape
            patch: |-
              - op: replace
                path: /data/capabilities
                value: >-
                  {"capabilities":{"admissionController":"disable","agentRuntimePosture":"disable","autoUpgrading":"disable","configurationScan":"enable","continuousScan":"disable","httpDetection":"disable","kubescapeOffline":"enable","malwareDetection":"disable","manageWorkloads":"disable","networkEventsStreaming":"disable","networkPolicyService":"disable","nodeProfileService":"disable","nodeSbomGeneration":"disable","nodeScan":"disable","operator":"enable","prometheusExporter":"disable","relevancy":"disable","remediation":"disable","riskAcceptance":"disable","runtimeDetection":"disable","runtimeObservability":"disable","sandboxSeccomp":"disable","scanEmbeddedSBOMs":"disable","seccompProfileBackend":"storage","seccompProfileService":"disable","syncSBOM":"disable","testing":{"nodeAgentMultiplication":{"enabled":false,"replicas":5}},"vexGeneration":"disable","vulnerabilityScan":"enable"},"effectiveCapabilities":{"configurationScan":"enable","httpDetection":"disable","malwareDetection":"disable","networkEventsStreaming":"disable","nodeProfileService":"disable","nodeScan":"disable","vulnerabilityScan":"enable"},"capabilityWarnings":[],"components":{"autoUpdater":{"enabled":false},"cloudSecret":{"create":true,"name":"cloud-secret"},"customCaCertificates":{"name":"custom-ca-certificates"},"kubescape":{"enabled":true},"kubescapeScheduler":{"enabled":true},"kubevuln":{"enabled":false},"kubevulnScheduler":{"enabled":false},"nodeAgent":{"enabled":false},"operator":{"enabled":true},"prometheusExporter":{"enabled":false},"sbomScanner":{"enabled":false},"serviceDiscovery":{"enabled":false},"storage":{"enabled":true},"synchronizer":{"enabled":false}},"configurations":{"excludeJsonPaths":null,"otelUrl":null,"persistence":"enable","priorityClass":{"daemonset":100000100,"enabled":false},"prometheusAnnotations":"disable"},"serviceScanConfig":{"enabled":false,"interval":"1h"}}
          - target:
              group: batch
              version: v1
              kind: CronJob
              name: kubevuln-scheduler
              namespace: kubescape
            patch: |-
              - op: add
                path: /spec/suspend
                value: true
          # Retain findings and DB cache on any future chart removal/rollback.
          - target:
              version: v1
              kind: PersistentVolumeClaim
              name: kubescape-(storage|kubevuln)
              namespace: kubescape
            patch: |-
              - op: add
                path: /metadata/annotations/helm.sh~1resource-policy
                value: keep
          # Manual public-image requests do not use registry credential Secrets.
          - target:
              group: rbac.authorization.k8s.io
              version: v1
              kind: Role
              name: operator
              namespace: kubescape
            patch: |-
              - op: test
                path: /rules/1
                value:
                  apiGroups: [""]
                  resources: [secrets]
                  verbs: [create, get, update, watch, list, patch, delete]
              - op: remove
                path: /rules/1
          # Certificate initialization only patches this release's APIService.
          - target:
              group: rbac.authorization.k8s.io
              version: v1
              kind: ClusterRole
              name: storage-certgen-kubescape
            patch: |-
              - op: add
                path: /rules/0/resourceNames
                value: [v1beta1.spdx.softwarecomposition.kubescape.io]
          - target:
              group: batch
              version: v1
              kind: CronJob
              name: kubescape-scheduler
              namespace: kubescape
            patch: |-
              - op: add
                path: /spec/suspend
                value: true
          # Chart 1.42.0 omits certgen budgets. Merge by name, preserving TLS
          # bootstrap commands, images, security contexts and all other fields.
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: storage
              namespace: kubescape
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: storage
                namespace: kubescape
              spec:
                template:
                  spec:
                    initContainers:
                      - name: certgen-create
                        resources:
                          requests:
                            cpu: 10m
                            memory: 32Mi
                          limits:
                            cpu: 100m
                            memory: 128Mi
                      - name: certgen-patch
                        resources:
                          requests:
                            cpu: 10m
                            memory: 32Mi
                          limits:
                            cpu: 100m
                            memory: 128Mi
  values:
    clusterName: home
    ksNamespace: kubescape
    additionalLabels:
      homelab.cooked.beer/owner: sam
    # Initial canary scope only; do not silently claim cluster-wide coverage.
    includeNamespaces: memos
    excludeNamespaces: ""
    defaultFrameworks:
      - nsa
    certificates:
      strategy: initContainer
    server: ""
    account: ""
    accessKey: ""
    credentials:
      cloudSecret: ""
    capabilities:
      operator: enable
      configurationScan: enable
      continuousScan: disable
      nodeScan: disable
      nodeSbomGeneration: disable
      scanEmbeddedSBOMs: disable
      vulnerabilityScan: enable
      relevancy: disable
      vexGeneration: disable
      runtimeObservability: disable
      networkPolicyService: disable
      networkEventsStreaming: disable
      runtimeDetection: disable
      malwareDetection: disable
      nodeProfileService: disable
      admissionController: disable
      httpDetection: disable
      seccompProfileService: disable
      seccompProfileBackend: storage
      sandboxSeccomp: disable
      manageWorkloads: disable
      syncSBOM: disable
      agentRuntimePosture: disable
      riskAcceptance: disable
      remediation: disable
      autoUpgrading: disable
      kubescapeOffline: enable
      prometheusExporter: disable
      testing:
        nodeAgentMultiplication:
          enabled: false
    global:
      enableClusterWideSecretAccess: false
      apiAuth:
        enabled: true
      kubescapePsp:
        enabled: false
      networkPolicy:
        enabled: false
        createEgressRules: false
      openshift:
        scc:
          enabled: false
    configurations:
      persistence: enable
      prometheusAnnotations: disable
      priorityClass:
        enabled: false
    alertCRD:
      installDefault: false
      scopeClustered: false
      scopeNamespaced: false
    serviceScanConfig:
      enabled: false
    namespaceFilters:
      enabled: false
    nodeAgent:
      privileged: false
      config:
        hostSensor:
          enabled: false
        prometheusExporter: disable
      sbomScanner:
        enabled: false
      autoscaler:
        enabled: false
      multipleDaemonSets:
        enabled: false
      gVisorStart:
        enabled: false
    # Immutable local mirror; verify DB build age before every manual assessment.
    grypeOfflineDB:
      enabled: true
      image:
        tag: ""
        sha: sha256:cd4f2c18691791b2c7754a619d011eb388773cdc39c973b621cbcc4217356449
        pullPolicy: IfNotPresent
    kubevuln:
      podAnnotations:
        homelab.cooked.beer/grype-index: sha256:cd4f2c18691791b2c7754a619d011eb388773cdc39c973b621cbcc4217356449
      image:
        repository: quay.io/kubescape/kubevuln
        tag: v0.3.578@sha256:925ced171a8d262e95ea72c04b0ebfec43d9128dbe4d875e783b80df56e54416
      resources:
        requests:
          cpu: 300m
          memory: 1Gi
          ephemeral-storage: 1Gi
        limits:
          cpu: 1000m
          memory: 3Gi
          ephemeral-storage: 3Gi
      env:
        - name: CA_MAX_VULN_SCAN_ROUTINES
          value: "1"
        - name: MAXQUEUEDEPTH
          value: "1"
      sbomScanner:
        enabled: false
      config:
        grypeDbPersistence: true
        maxImageSize: 536870912
        maxSBOMSize: 20971520
        scanTimeout: 5m
        cveMatchingMode: "off"
      tmpDirPersistence:
        enabled: false
    kubescape:
      image:
        repository: quay.io/kubescape/kubescape
        tag: v4.0.20@sha256:439bab2d738f8bd27c742b15444cde77e607ce7d769e805ee1bc25605b355060
      downloadArtifacts: false
      skipUpdateCheck: true
      serviceMonitor:
        enabled: false
      resources:
        requests:
          cpu: 250m
          memory: 400Mi
        limits:
          cpu: 600m
          memory: 1Gi
    operator:
      image:
        repository: quay.io/kubescape/operator
        tag: v0.2.209@sha256:b280f5154451d1d075d49e3fade361e934063fe5dc26e18e673f67a4cca3a558
      triggerSecurityFramework: false
      rulesUpdateConfig:
        enabled: false
      env:
        workerConcurrency:
          name: WORKERCONCURRENCY
          value: "1"
      resources:
        requests:
          cpu: 50m
          memory: 100Mi
        limits:
          cpu: 300m
          memory: 300Mi
    storage:
      enabled: true
      image:
        repository: quay.io/kubescape/storage
        tag: v0.0.382@sha256:270e22b65e95de4054d6b9ed3aad2d63296e4941ba1aa49b356d5be94d41863b
      mtls:
        enabled: true
      hostNetwork: false
      mcp:
        enabled: false
        readerClusterRoles: false
      resources:
        requests:
          cpu: 100m
          memory: 400Mi
        limits:
          cpu: 1500m
          memory: 1500Mi
    kubescapeOpsTool:
      image:
        repository: quay.io/kubescape/kubescape-ops-tool
        tag: 0.2.0-r1@sha256:2f1d8c9a76f05049f73ebefa292d4b65ce3ef3811317c4cc023b4df792a592e4
    kubevulnScheduler:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
    kubescapeScheduler:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      requestBody:
        commands:
          - CommandName: kubescapeScan
            args:
              scanV1:
                targetType: framework
                targetNames: [nsa]
                hostScanner: false
                keepLocal: true
    persistence:
      storageClass: longhorn
      accessMode: ReadWriteOnce
      size:
        backingStorage: 5Gi
        kubevuln: 10Gi
