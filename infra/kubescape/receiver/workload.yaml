apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-receiver
  namespace: kubescape
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: security-receiver-state
  namespace: kubescape
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  storageClassName: longhorn
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-receiver
  namespace: kubescape
  labels:
    homelab.cooked.beer/owner: sam
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: security-receiver
  template:
    metadata:
      # One-time, source-controlled restart after the first native R1000
      # receipt. Change only this Pod-template annotation; never modify,
      # recreate or prune the Longhorn PVC or its SQLite database.
      annotations:
        homelab.cooked.beer/persistence-acceptance: "r1000-receipt-20261124-01"
        # Recreate the receiver only after the SOPS-encrypted strict-X509
        # leaf is included in this same GitOps PR; keep Longhorn state.
        homelab.cooked.beer/tls-leaf-reissue: "strict-x509-aki-20261124-01"
      labels:
        app.kubernetes.io/name: security-receiver
        homelab.cooked.beer/owner: sam
        kubescape.io/ignore: "true"
    spec:
      serviceAccountName: security-receiver
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: receiver
          # Candidate immutable digest; receiver-image CI must qualify and verify
          # anonymous retrieval before this change is merged.
          image: ghcr.io/rovxbot/security-receiver@sha256:5ca6be935f42c5253913eb199b9cda8cb073f729a49f7e7ecdcee6f0868f340e
          imagePullPolicy: IfNotPresent
          args: ["--config", "/config/config.json"]
          ports:
            - name: https
              containerPort: 8443
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            periodSeconds: 30
            timeoutSeconds: 3
          volumeMounts:
            - name: state
              mountPath: /state
            - name: config
              mountPath: /config
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: api
              mountPath: /var/run/receiver-api
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: security-receiver-state
        - name: config
          configMap:
            name: security-receiver-config
        - name: tls
          secret:
            secretName: security-receiver-tls
            defaultMode: 0440
        - name: api
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  # A Kubernetes API-server token, NOT the agent's kubescape.io token.
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: security-receiver
  namespace: kubescape
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: security-receiver
  ports:
    - name: https
      port: 8443
      targetPort: https
