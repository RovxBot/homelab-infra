apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-collector
  namespace: kubescape
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: security-collector-state
  namespace: kubescape
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    homelab.cooked.beer/owner: sam
spec:
  storageClassName: longhorn
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-collector
  namespace: kubescape
  labels:
    homelab.cooked.beer/owner: sam
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: security-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: security-collector
        homelab.cooked.beer/owner: sam
        kubescape.io/ignore: 'true'
    spec:
      serviceAccountName: security-collector
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: ghcr.io/rovxbot/security-collector@sha256:878bd903b267ae6ac3831fa0565db406c98c68355c13293282c0b890d37c9e58
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 32Mi
          startupProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 30
            timeoutSeconds: 3
          volumeMounts:
            - name: state
              mountPath: /state
            - name: config
              mountPath: /config
              readOnly: true
            - name: assessment-config
              mountPath: /assessment-config
              readOnly: true
            - name: api
              mountPath: /var/run/collector-api
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: security-collector-state
        - name: config
          configMap:
            name: security-collector-config
        - name: assessment-config
          configMap:
            name: kubescape-assessment-config
        - name: api
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  # Omitted audience defaults to this API server's audience.
                  # kubescape.io is for the scanner's separate HTTP service.
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: security-collector
  namespace: kubescape
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: security-collector
  ports:
    - name: health
      port: 8080
      targetPort: health
