apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: security-collector
  namespace: kubescape
rules:
  - apiGroups: [apps]
    resources: [daemonsets]
    resourceNames: [node-agent]
    verbs: [get]
  - apiGroups: ['']
    resources: [pods, pods/log]
    # Exact metal3 Pod name is added by reviewed enrollment after rollout.
    # Never grant namespace-wide logs to discover a generated DaemonSet name.
    resourceNames: [node-agent-6krhl]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: security-collector
  namespace: kubescape
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: security-collector
subjects:
  - kind: ServiceAccount
    name: security-collector
    namespace: kubescape
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: security-collector-inventory
  namespace: homepage
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [homepage, homepage-assets]
    verbs: [get]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get]
  - apiGroups: ['']
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: security-collector-inventory
  namespace: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: security-collector-inventory
subjects:
  - kind: ServiceAccount
    name: security-collector
    namespace: kubescape
