apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mqtt
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      homelab.cooked.beer/owner: sam
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicies.yaml
  - ../../secrets/mosquitto.enc.yaml
configMapGenerator:
  - name: mosquitto-config
    files:
      - mosquitto.conf
      - acl
