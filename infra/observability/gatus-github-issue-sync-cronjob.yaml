apiVersion: batch/v1
kind: CronJob
metadata:
  name: gatus-github-issue-sync
  namespace: monitoring
  labels:
    homelab.cooked.beer/component: gatus-alerting
    homelab.cooked.beer/owner: sam
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            homelab.cooked.beer/component: gatus-alerting
            homelab.cooked.beer/owner: sam
        spec:
          serviceAccountName: gatus-github-issue-sync
          automountServiceAccountToken: true
          restartPolicy: OnFailure
          securityContext:
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
              imagePullPolicy: IfNotPresent
              command:
                - python
                - /opt/gatus-github-issue-sync/sync.py
              env:
                - name: DRY_RUN
                  value: "false"
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: gatus-github-token
                      key: token
                - name: MAX_RESULT_AGE_SECONDS
                  value: "900"
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: SUCCESS_THRESHOLD
                  value: "2"
                - name: CLUSTER_SUCCESS_THRESHOLD
                  value: "20"
                - name: CLUSTER_RECOVERY_MIN_SECONDS
                  value: "1140"
                - name: CLUSTER_MAX_SAMPLE_GAP_SECONDS
                  value: "90"
                - name: CLUSTER_MAX_RESULT_AGE_SECONDS
                  value: "120"
                - name: CLUSTER_MAX_HEALTH_AGE_SECONDS
                  value: "300"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              volumeMounts:
                - name: script
                  mountPath: /opt/gatus-github-issue-sync
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: gatus-github-issue-sync
                defaultMode: 0555
