# Private destination credential; receiver and assessment read boundaries are unchanged.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-incident-publisher
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: security-incident-publisher-state
  namespace: monitoring
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  storageClassName: longhorn
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 128Mi
---
# Only the PUBLIC CA certificate (one named Secret with one cert key).
# No secret listing, no other Secret, no TLS private key, no Kubernetes writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: security-incident-publisher-public-ca
  namespace: kubescape
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [security-receiver-ca]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: security-incident-publisher-public-ca
  namespace: kubescape
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: security-incident-publisher-public-ca
subjects:
  - kind: ServiceAccount
    name: security-incident-publisher
    namespace: monitoring
---
# Only the sanitized projection, not the full assessment inventory or reports.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: security-incident-publisher-private-cve
  namespace: kubescape
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [kubescape-private-cve]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: security-incident-publisher-private-cve
  namespace: kubescape
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: security-incident-publisher-private-cve
subjects:
  - kind: ServiceAccount
    name: security-incident-publisher
    namespace: monitoring
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: security-incident-publisher
  namespace: monitoring
  labels:
    homelab.cooked.beer/component: security-native-issues
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: security-incident-publisher
            homelab.cooked.beer/component: security-native-issues
            homelab.cooked.beer/owner: sam
        spec:
          serviceAccountName: security-incident-publisher
          automountServiceAccountToken: false
          restartPolicy: Never
          terminationGracePeriodSeconds: 15
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: publisher
              image: python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
              imagePullPolicy: IfNotPresent
              command: [python3, -B, /opt/publisher/publisher.py]
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: ENABLE_CVE_PUBLISHER
                  value: "true"
                # Dedicated GitHub Actions read-only credential; never reuse the private writer.
                - name: REMEDIATION_GITHUB_READ_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: security-remediation-github-read
                      key: token
                      optional: true
                - name: GITEA_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: homelab-security-gitea
                      key: token
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 150m
                  memory: 128Mi
              volumeMounts:
                - name: state
                  mountPath: /state
                - name: code
                  mountPath: /opt/publisher
                  readOnly: true
                - name: api
                  mountPath: /var/run/publisher-api
                  readOnly: true
                - name: receiver-auth
                  mountPath: /var/run/publisher-receiver
                  readOnly: true
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: security-incident-publisher-state
            - name: code
              configMap:
                name: security-incident-publisher-code
                defaultMode: 0444
            - name: api
              projected:
                defaultMode: 0444
                sources:
                  - serviceAccountToken:
                      expirationSeconds: 3600
                      path: token
                  - configMap:
                      name: kube-root-ca.crt
                      items:
                        - key: ca.crt
                          path: ca.crt
            - name: receiver-auth
              projected:
                defaultMode: 0444
                sources:
                  - serviceAccountToken:
                      audience: kubescape.io
                      expirationSeconds: 3600
                      path: token
