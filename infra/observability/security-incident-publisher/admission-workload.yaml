apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-admission-observer
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: security-admission-observer
  namespace: kyverno
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: security-admission-observer
  namespace: kyverno
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: security-admission-observer
subjects:
  - kind: ServiceAccount
    name: security-admission-observer
    namespace: monitoring
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: security-admission-observer
  namespace: monitoring
spec:
  schedule: "2,12,22,32,42,52 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 90
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            homelab.cooked.beer/owner: sam
            app.kubernetes.io/name: security-admission-observer
        spec:
          serviceAccountName: security-admission-observer
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: publisher
              image: python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
              command: [python3, -B, /opt/publisher/admission.py]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              volumeMounts:
                - name: code
                  mountPath: /opt/publisher
                  readOnly: true
          volumes:
            - name: code
              configMap:
                name: security-incident-publisher-code
                defaultMode: 0444
