apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: gatus
      version: 1.5.0
      sourceRef:
        kind: HelmRepository
        name: twin
        namespace: flux-system
      interval: 12h
  values:
    deployment:
      strategy: RollingUpdate
      revisionHistoryLimit: 2
    image:
      tag: v5.34.0
      sha: 3fff895e77d35ee62e898860f4613755bc2344127d93e3f326429d40270e2115
    podLabels:
      homelab.cooked.beer/component: internal-health
    serviceAccount:
      autoMount: false
    podSecurityContext:
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsGroup: 65534
      runAsNonRoot: true
      runAsUser: 65534
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 128Mi
    persistence:
      enabled: true
      storageClassName: longhorn
      accessModes:
        - ReadWriteOnce
      size: 1Gi
    serviceMonitor:
      enabled: false
    env:
      GATUS_GITHUB_TOKEN:
        valueFrom:
          secretKeyRef:
            name: gatus-github-token
            key: token
    config:
      storage:
        type: sqlite
        path: /data/data.db
      alerting:
        github:
          repository-url: https://github.com/RovxBot/homelab-infra
          token: ${GATUS_GITHUB_TOKEN}
          default-alert:
            description: Internal service health check failed
            failure-threshold: 3
            success-threshold: 2
            send-on-resolved: true
      endpoints:
        - name: cluster-health
          group: cluster
          url: http://pod-report.homepage.svc.cluster.local:80/health.json
          interval: 1m
          conditions:
            - "[STATUS] == 200"
            - "[BODY].status == healthy"
          alerts:
            - type: github
        - name: cloudflared-metrics
          group: cluster
          url: http://cloudflared-metrics.cloudflared.svc.cluster.local:2000/metrics
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: github
        - name: homepage
          group: internal
          url: http://homepage.homepage.svc.cluster.local:3000
          interval: 1m
          conditions:
            - "[STATUS] >= 200"
            - "[STATUS] < 300"
          alerts:
            - type: github
        - name: homepage-assets
          group: internal
          url: http://homepage-assets.homepage.svc.cluster.local:80/assets/998981.jpg
          interval: 1m
          conditions:
            - "[STATUS] >= 200"
            - "[STATUS] < 300"
          alerts:
            - type: github
        - name: vaultwarden
          group: internal
          url: http://vaultwarden.security.svc.cluster.local:80
          interval: 1m
          conditions:
            - "[STATUS] >= 200"
            - "[STATUS] < 300"
          alerts:
            - type: github
        - name: invoice-ninja
          group: internal
          url: http://invoiceninja.invoiceninja.svc.cluster.local:80/health
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: github
        - name: radarr
          group: internal
          url: http://radarr.media.svc.cluster.local:7878
          interval: 1m
          conditions:
            - "[STATUS] >= 200"
            - "[STATUS] < 300"
          alerts:
            - type: github
        - name: sonarr-ping
          group: internal
          url: http://sonarr.media.svc.cluster.local:8989/ping
          interval: 1m
          conditions:
            - "[STATUS] >= 200"
            - "[STATUS] < 300"
          alerts:
            - type: github
        - name: prowlarr-ping
          group: internal
          url: http://prowlarr.media.svc.cluster.local:9696/ping
          interval: 1m
          conditions:
            - "[STATUS] >= 200"
            - "[STATUS] < 300"
          alerts:
            - type: github
        - name: sabnzbd
          group: internal
          url: http://sabnzbd.media.svc.cluster.local:8080
          interval: 1m
          conditions:
            - "[STATUS] >= 200"
            - "[STATUS] < 300"
          alerts:
            - type: github
        - name: jellyseerr-login
          group: internal
          url: http://jellyseerr.media.svc.cluster.local:5055/login
          interval: 1m
          conditions:
            - "[STATUS] >= 200"
            - "[STATUS] < 300"
          alerts:
            - type: github
        - name: jellyfin
          group: internal
          url: http://jellyfin.media.svc.cluster.local:8096
          interval: 1m
          conditions:
            - "[STATUS] >= 200"
            - "[STATUS] < 300"
          alerts:
            - type: github
        - name: immich-server
          group: internal
          url: http://immich-server.immich.svc.cluster.local:2283/api/server/ping
          interval: 1m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: github
        - name: grimguzzler-registration
          group: internal
          url: http://grimguzzler-registration.wotlk.svc.cluster.local:80
          interval: 1m
          conditions:
            - "[STATUS] >= 200"
            - "[STATUS] < 300"
          alerts:
            - type: github
        - name: wotlk-authserver
          group: internal
          url: tcp://192.168.1.197:3724
          interval: 1m
          conditions:
            - "[CONNECTED] == true"
          alerts:
            - type: github
        - name: wotlk-worldserver
          group: internal
          url: tcp://192.168.1.47:8085
          interval: 1m
          conditions:
            - "[CONNECTED] == true"
          alerts:
            - type: github
        - name: longhorn-frontend
          group: internal
          url: http://longhorn-frontend.longhorn-system.svc.cluster.local:80
          interval: 1m
          conditions:
            - "[STATUS] >= 200"
            - "[STATUS] < 300"
          alerts:
            - type: github
        - name: homepage-public
          group: external
          url: https://homepage.cooked.beer
          interval: 1m
          conditions:
            - "[STATUS] >= 200"
            - "[STATUS] < 300"
          alerts:
            - type: github
        - name: vaultwarden-public
          group: external
          url: https://vault.cooked.beer
          interval: 1m
          conditions:
            - "[STATUS] >= 200"
            - "[STATUS] < 300"
          alerts:
            - type: github
        - name: invoice-ninja-public
          group: external
          url: https://invoice.cooked.beer
          interval: 1m
          conditions:
            - "[STATUS] >= 200"
            - "[STATUS] < 400"
          alerts:
            - type: github
        - name: radarr-public
          group: external
          url: https://radarr.cooked.beer
          interval: 1m
          conditions:
            - "[STATUS] >= 200"
            - "[STATUS] < 300"
          alerts:
            - type: github
        - name: sonarr-public
          group: external
          url: https://sonarr.cooked.beer
          interval: 1m
          conditions:
            - "[STATUS] >= 200"
            - "[STATUS] < 300"
          alerts:
            - type: github
        - name: prowlarr-public
          group: external
          url: https://prowlarr.cooked.beer
          interval: 1m
          conditions:
            - "[STATUS] >= 200"
            - "[STATUS] < 300"
          alerts:
            - type: github
        - name: sabnzbd-public
          group: external
          url: https://sabnzbd.cooked.beer
          interval: 1m
          conditions:
            - "[STATUS] >= 200"
            - "[STATUS] < 300"
          alerts:
            - type: github
        - name: jellyseerr-public
          group: external
          url: https://jellyseerr.cooked.beer
          interval: 1m
          conditions:
            - "[STATUS] >= 200"
            - "[STATUS] < 300"
          alerts:
            - type: github
        - name: grimguzzler-registration-public
          group: external
          url: https://grimguzzler.cooked.beer
          interval: 1m
          conditions:
            - "[STATUS] >= 200"
            - "[STATUS] < 300"
          alerts:
            - type: github
        - name: jellyfin-public
          group: external
          url: https://jellyfin.cooked.beer
          interval: 1m
          conditions:
            - "[STATUS] >= 200"
            - "[STATUS] < 300"
          alerts:
            - type: github
        - name: immich-public
          group: external
          url: https://immich.cooked.beer
          interval: 1m
          conditions:
            - "[STATUS] >= 200"
            - "[STATUS] < 300"
          alerts:
            - type: github
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: gatus
            patch: |
              - op: add
                path: /spec/strategy/rollingUpdate
                value:
                  maxSurge: 0
                  maxUnavailable: 1
              - op: add
                path: /spec/template/metadata/labels/homelab.cooked.beer~1owner
                value: sam
