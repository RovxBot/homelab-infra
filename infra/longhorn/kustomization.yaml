apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  # Preserve the existing Longhorn resources during the HelmRelease migration.
  kustomize.toolkit.fluxcd.io/prune: Disabled
resources:
  - namespace.yaml
  - longhorn-helmrepository.yaml
  - longhorn-helmrelease.yaml
  - default-backup-target.yaml
  - recurring-jobs.yaml
  - settings.yaml
