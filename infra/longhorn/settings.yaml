apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: recurring-job-max-retention
  namespace: longhorn-system
value: "10"
---
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: storage-minimal-available-percentage
  namespace: longhorn-system
value: "25"
---
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: storage-over-provisioning-percentage
  namespace: longhorn-system
value: "100"
---
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: concurrent-replica-rebuild-per-node-limit
  namespace: longhorn-system
value: "1"
---
# Longhorn must continue to schedule its system-managed CSI, instance-manager
# and engine-image components on all disk-bearing nodes after control
# planes regain their default NoSchedule taint.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: taint-toleration
  namespace: longhorn-system
value: "node-role.kubernetes.io/control-plane:NoSchedule"
---
# Every existing volume inherits the global setting and is currently healthy.
# Least-effort balancing uses the empty, schedulable storage on metal0 without
# the repeated rebuild churn that best-effort balancing can cause.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: replica-auto-balance
  namespace: longhorn-system
value: least-effort
---
# Refuse a new volume if all three requested replicas cannot be scheduled.
# Existing volumes and the approved Backblaze backup design are unaffected.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: allow-volume-creation-with-degraded-availability
  namespace: longhorn-system
value: "false"
