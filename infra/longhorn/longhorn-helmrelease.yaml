apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 30m
  chart:
    spec:
      chart: longhorn
      version: 1.11.1
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    disableTakeOwnership: false
    remediation:
      retries: 3
    timeout: 15m
  upgrade:
    crds: CreateReplace
    disableTakeOwnership: false
    remediation:
      retries: 3
    timeout: 15m
  values:
    service:
      ui:
        type: NodePort
        nodePort: 30080

    persistence:
      defaultClass: true
      defaultFsType: ext4
      defaultClassReplicaCount: 3
      defaultDataLocality: disabled
      reclaimPolicy: Delete
      volumeBindingMode: Immediate
      disableRevisionCounter: "true"
      unmapMarkSnapChainRemoved: ignored
      dataEngine: v1
      backupTargetName: default

    preUpgradeChecker:
      jobEnabled: false

    defaultSettings:
      priorityClass: longhorn-critical
      disableRevisionCounter: '{"v1":"true"}'

    longhornUI:
      replicas: 2
