apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 30m
  chart:
    spec:
      chart: longhorn
      version: 1.11.1
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    disableTakeOwnership: false
    remediation:
      retries: 3
    timeout: 15m
  upgrade:
    crds: CreateReplace
    disableTakeOwnership: false
    remediation:
      retries: 3
    timeout: 15m
  # The chart defaults the manager DaemonSet to 100% unavailable during a
  # rollout. Limit maintenance to one node so volume control-plane recovery
  # remains available while a manager pod is refreshed.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: DaemonSet
              name: longhorn-manager
            patch: |
              - op: replace
                path: /spec/updateStrategy/rollingUpdate/maxUnavailable
                value: 1
  values:
    service:
      ui:
        type: NodePort
        nodePort: 30080

    persistence:
      defaultClass: true
      defaultFsType: ext4
      defaultClassReplicaCount: 3
      defaultDataLocality: disabled
      reclaimPolicy: Delete
      volumeBindingMode: Immediate
      disableRevisionCounter: "true"
      unmapMarkSnapChainRemoved: ignored
      dataEngine: v1
      backupTargetName: default

    preUpgradeChecker:
      jobEnabled: false

    defaultSettings:
      priorityClass: longhorn-critical
      disableRevisionCounter: '{"v1":"true"}'
      # Keep Longhorn's system-managed components on every disk-bearing node
      # after Talos restores the default control-plane NoSchedule taint.
      taintToleration: "node-role.kubernetes.io/control-plane:NoSchedule"

    # These are user-deployed chart components, so the Longhorn global setting
    # above does not apply to them. Every node contributes Longhorn storage.
    longhornManager:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

    longhornDriver:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

    longhornUI:
      replicas: 2
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
