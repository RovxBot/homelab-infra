apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: mutable-image-tags
  namespace: kyverno
  labels:
    homelab.cooked.beer/owner: platform
  annotations:
    kyverno.cooked.beer/reason: Selected workloads still rely on tag-based updates or upstream-managed image tags.
    kyverno.cooked.beer/expires-at: "2026-08-31"
    github.cooked.beer/issue-create: "true"
spec:
  exceptions:
    - policyName: platform-pod-standards
      ruleNames:
        - require-digest-pinned-images
  match:
    any:
      - resources:
          namespaces:
            - longhorn-system
            - wireguard
            - wotlk
      - resources:
          kinds:
            - Deployment
            - CronJob
            - StatefulSet
          names:
            - cloudflared
            - grimguzzler-registration
            - homepage-assets
            - pod-report
          namespaces:
            - cloudflared
            - homepage
            - wotlk
