apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: mutable-image-tags
  namespace: kyverno
  labels:
    homelab.cooked.beer/owner: platform
  annotations:
    kyverno.cooked.beer/reason: Longhorn chart workloads and WotLK workloads currently include images not pinned by digest.
    kyverno.cooked.beer/expires-at: "2026-08-31"
    github.cooked.beer/issue-create: "true"
spec:
  exceptions:
    - policyName: platform-pod-standards
      ruleNames:
        - require-digest-pinned-images
  match:
    any:
      - resources:
          namespaces:
            - longhorn-system
            - wotlk
