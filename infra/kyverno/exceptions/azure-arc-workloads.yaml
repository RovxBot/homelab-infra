apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: azure-arc-workloads
  namespace: kyverno
  labels:
    homelab.cooked.beer/owner: platform
  annotations:
    kyverno.cooked.beer/reason: Azure Arc agents are vendor-managed and do not expose repo-controlled resource budgets.
    kyverno.cooked.beer/expires-at: "2026-08-31"
    github.cooked.beer/issue-create: "true"
spec:
  exceptions:
    - policyName: platform-pod-standards
      ruleNames:
        - require-requests-and-limits
  match:
    any:
      - resources:
          kinds:
            - Pod
            - Deployment
            - StatefulSet
            - DaemonSet
            - Job
            - CronJob
          namespaces:
            - azure-arc