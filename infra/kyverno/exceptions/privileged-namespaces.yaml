apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: privileged-namespaces
  namespace: kyverno
  labels:
    homelab.cooked.beer/owner: platform
  annotations:
    kyverno.cooked.beer/reason: Certain namespaces run storage, networking, or game workloads that need privileged runtime behavior.
    kyverno.cooked.beer/expires-at: "2026-08-31"
    github.cooked.beer/issue-create: "true"
spec:
  exceptions:
    - policyName: platform-pod-standards
      ruleNames:
        - require-runtime-hardening
        - disallow-host-network
  match:
    any:
      - resources:
          namespaces:
            - longhorn-system
            - wireguard
            - wotlk
