apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: tocloud9-chart-workloads
  namespace: kyverno
  labels:
    homelab.cooked.beer/owner: platform
  annotations:
    kyverno.cooked.beer/reason: >-
      ToCloud9 v0.1.0's upstream Helm chart does not expose values for workload
      owner labels, health probes, or resource budgets. The exception is limited
      to chart-generated ToCloud9 workloads in the WotLK namespace.
    kyverno.cooked.beer/expires-at: "2026-08-31"
    github.cooked.beer/issue-create: "true"
spec:
  exceptions:
    - policyName: platform-pod-standards
      ruleNames:
        - require-owner-label
        - require-requests-and-limits
        - require-probes
  match:
    any:
      - resources:
          kinds:
            - Deployment
            - StatefulSet
          names:
            - tocloud9-*
          namespaces:
            - wotlk
