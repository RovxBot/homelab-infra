apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: runtime-hardening-workloads
  namespace: kyverno
  labels:
    homelab.cooked.beer/owner: platform
  annotations:
    kyverno.cooked.beer/reason: WireGuard and WotLK need targeted runtime-hardening exceptions; neither uses host networking.
    kyverno.cooked.beer/expires-at: "2026-08-31"
    github.cooked.beer/issue-create: "true"
spec:
  exceptions:
    - policyName: platform-pod-standards
      ruleNames:
        - require-runtime-hardening
  match:
    any:
      - resources:
          namespaces:
            - wireguard
            - wotlk
