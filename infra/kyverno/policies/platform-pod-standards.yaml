apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: platform-pod-standards
  annotations:
    policies.kyverno.io/title: Platform Pod Standards
    policies.kyverno.io/category: Security, Operations
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
spec:
  background: true
  emitWarning: true
  rules:
    - name: require-owner-label
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
                - Job
                - CronJob
      exclude:
        any:
          - resources:
              namespaces:
                - flux-system
                - kube-node-lease
                - kube-public
                - kube-system
                - kyverno
      validate:
        failureAction: Enforce
        message: Workload pod templates must carry the homelab owner label.
        anyPattern:
          - spec:
              template:
                metadata:
                  labels:
                    homelab.cooked.beer/owner: "?*"
          - spec:
              jobTemplate:
                spec:
                  template:
                    metadata:
                      labels:
                        homelab.cooked.beer/owner: "?*"
    - name: require-requests-and-limits
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
                - Job
                - CronJob
      exclude:
        any:
          - resources:
              namespaces:
                - flux-system
                - kube-node-lease
                - kube-public
                - kube-system
                - kyverno
      validate:
        failureAction: Enforce
        message: Containers in workload pod templates must define CPU and memory requests and limits.
        foreach:
          - list: "request.object.spec.template.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: "{{ element.resources.requests.cpu || '' }}"
                    operator: Equals
                    value: ""
                  - key: "{{ element.resources.requests.memory || '' }}"
                    operator: Equals
                    value: ""
                  - key: "{{ element.resources.limits.cpu || '' }}"
                    operator: Equals
                    value: ""
                  - key: "{{ element.resources.limits.memory || '' }}"
                    operator: Equals
                    value: ""
          - list: "request.object.spec.template.spec.initContainers[]"
            deny:
              conditions:
                any:
                  - key: "{{ element.resources.requests.cpu || '' }}"
                    operator: Equals
                    value: ""
                  - key: "{{ element.resources.requests.memory || '' }}"
                    operator: Equals
                    value: ""
                  - key: "{{ element.resources.limits.cpu || '' }}"
                    operator: Equals
                    value: ""
                  - key: "{{ element.resources.limits.memory || '' }}"
                    operator: Equals
                    value: ""
          - list: "request.object.spec.jobTemplate.spec.template.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: "{{ element.resources.requests.cpu || '' }}"
                    operator: Equals
                    value: ""
                  - key: "{{ element.resources.requests.memory || '' }}"
                    operator: Equals
                    value: ""
                  - key: "{{ element.resources.limits.cpu || '' }}"
                    operator: Equals
                    value: ""
                  - key: "{{ element.resources.limits.memory || '' }}"
                    operator: Equals
                    value: ""
          - list: "request.object.spec.jobTemplate.spec.template.spec.initContainers[]"
            deny:
              conditions:
                any:
                  - key: "{{ element.resources.requests.cpu || '' }}"
                    operator: Equals
                    value: ""
                  - key: "{{ element.resources.requests.memory || '' }}"
                    operator: Equals
                    value: ""
                  - key: "{{ element.resources.limits.cpu || '' }}"
                    operator: Equals
                    value: ""
                  - key: "{{ element.resources.limits.memory || '' }}"
                    operator: Equals
                    value: ""
    - name: require-runtime-hardening
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
                - Job
                - CronJob
      exclude:
        any:
          - resources:
              namespaces:
                - flux-system
                - kube-node-lease
                - kube-public
                - kube-system
                - kyverno
      validate:
        failureAction: Enforce
        message: >-
          Containers should run as non-root, disable privilege escalation,
          drop all capabilities, avoid privileged mode, and use RuntimeDefault
          seccomp.
        foreach:
          - list: "request.object.spec.template.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.runAsNonRoot || request.object.spec.template.spec.securityContext.runAsNonRoot || `false` }}"
                    operator: NotEquals
                    value: true
                  - key: "{{ element.securityContext.allowPrivilegeEscalation == `false` }}"
                    operator: Equals
                    value: false
                  - key: "{{ element.securityContext.privileged || `false` }}"
                    operator: NotEquals
                    value: false
                  - key: "{{ contains(element.securityContext.capabilities.drop || `[]`, 'ALL') }}"
                    operator: NotEquals
                    value: true
                  - key: "{{ element.securityContext.seccompProfile.type || request.object.spec.template.spec.securityContext.seccompProfile.type || '' }}"
                    operator: NotEquals
                    value: RuntimeDefault
          - list: "request.object.spec.template.spec.initContainers[]"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.runAsNonRoot || request.object.spec.template.spec.securityContext.runAsNonRoot || `false` }}"
                    operator: NotEquals
                    value: true
                  - key: "{{ element.securityContext.allowPrivilegeEscalation == `false` }}"
                    operator: Equals
                    value: false
                  - key: "{{ element.securityContext.privileged || `false` }}"
                    operator: NotEquals
                    value: false
                  - key: "{{ contains(element.securityContext.capabilities.drop || `[]`, 'ALL') }}"
                    operator: NotEquals
                    value: true
                  - key: "{{ element.securityContext.seccompProfile.type || request.object.spec.template.spec.securityContext.seccompProfile.type || '' }}"
                    operator: NotEquals
                    value: RuntimeDefault
          - list: "request.object.spec.jobTemplate.spec.template.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.runAsNonRoot || request.object.spec.jobTemplate.spec.template.spec.securityContext.runAsNonRoot || `false` }}"
                    operator: NotEquals
                    value: true
                  - key: "{{ element.securityContext.allowPrivilegeEscalation == `false` }}"
                    operator: Equals
                    value: false
                  - key: "{{ element.securityContext.privileged || `false` }}"
                    operator: NotEquals
                    value: false
                  - key: "{{ contains(element.securityContext.capabilities.drop || `[]`, 'ALL') }}"
                    operator: NotEquals
                    value: true
                  - key: "{{ element.securityContext.seccompProfile.type || request.object.spec.jobTemplate.spec.template.spec.securityContext.seccompProfile.type || '' }}"
                    operator: NotEquals
                    value: RuntimeDefault
          - list: "request.object.spec.jobTemplate.spec.template.spec.initContainers[]"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.runAsNonRoot || request.object.spec.jobTemplate.spec.template.spec.securityContext.runAsNonRoot || `false` }}"
                    operator: NotEquals
                    value: true
                  - key: "{{ element.securityContext.allowPrivilegeEscalation == `false` }}"
                    operator: Equals
                    value: false
                  - key: "{{ element.securityContext.privileged || `false` }}"
                    operator: NotEquals
                    value: false
                  - key: "{{ contains(element.securityContext.capabilities.drop || `[]`, 'ALL') }}"
                    operator: NotEquals
                    value: true
                  - key: "{{ element.securityContext.seccompProfile.type || request.object.spec.jobTemplate.spec.template.spec.securityContext.seccompProfile.type || '' }}"
                    operator: NotEquals
                    value: RuntimeDefault
    - name: disallow-host-network
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
                - Job
                - CronJob
      exclude:
        any:
          - resources:
              namespaces:
                - flux-system
                - kube-node-lease
                - kube-public
                - kube-system
                - kyverno
      validate:
        failureAction: Enforce
        message: hostNetwork should only be used via an explicit exception.
        anyPattern:
          - spec:
              template:
                spec:
                  =(hostNetwork): false
          - spec:
              jobTemplate:
                spec:
                  template:
                    spec:
                      =(hostNetwork): false
    - name: require-digest-pinned-images
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
                - Job
                - CronJob
      exclude:
        any:
          - resources:
              namespaces:
                - flux-system
                - kube-node-lease
                - kube-public
                - kube-system
                - kyverno
      validate:
        failureAction: Enforce
        message: Container images in workload pod templates should be pinned by digest.
        foreach:
          - list: "request.object.spec.template.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: "{{ contains(element.image || '', '@sha256:') }}"
                    operator: Equals
                    value: false
          - list: "request.object.spec.jobTemplate.spec.template.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: "{{ contains(element.image || '', '@sha256:') }}"
                    operator: Equals
                    value: false
    - name: disallow-latest-tags
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
                - Job
                - CronJob
      exclude:
        any:
          - resources:
              namespaces:
                - flux-system
                - kube-node-lease
                - kube-public
                - kube-system
                - kyverno
      validate:
        failureAction: Enforce
        message: latest tags are not allowed without an explicit exception.
        foreach:
          - list: "request.object.spec.template.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: "{{ contains(element.image || '', ':latest') }}"
                    operator: Equals
                    value: true
          - list: "request.object.spec.jobTemplate.spec.template.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: "{{ contains(element.image || '', ':latest') }}"
                    operator: Equals
                    value: true
    - name: require-probes
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
      exclude:
        any:
          - resources:
              namespaces:
                - flux-system
                - kube-node-lease
                - kube-public
                - kube-system
                - kyverno
      validate:
        failureAction: Enforce
        message: Containers that expose ports should define readiness and liveness probes.
        foreach:
          - list: "request.object.spec.template.spec.containers[]"
            preconditions:
              all:
                - key: "{{ length(element.ports || `[]`) }}"
                  operator: GreaterThanOrEquals
                  value: 1
            pattern:
              readinessProbe:
                {}
              livenessProbe:
                {}
