apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- platform-namespace-standards.yaml
- platform-pod-standards.yaml
- policy-exception-accountability.yaml
- platform-flux-guardrails.yaml
- platform-namespace-bootstrap.yaml
- longhorn-csi-registrar-lifecycle.yaml
patches:
- target:
    kind: ClusterPolicy
    name: platform-namespace-bootstrap
  patch: "- op: add\n  path: /spec/rules/0/generate/orphanDownstreamOnPolicyDelete\n\
    \  value: true\n- op: add\n  path: /spec/rules/1/generate/orphanDownstreamOnPolicyDelete\n\
    \  value: true\n- op: add\n  path: /spec/rules/2/generate/orphanDownstreamOnPolicyDelete\n\
    \  value: true\n"
