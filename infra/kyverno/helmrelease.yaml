apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 30m
  chart:
    spec:
      chart: kyverno
      version: 3.10.0
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    timeout: 15m
    remediation:
      retries: 3
  values:
    image:
      registry: ghcr.io
    crds:
      migration:
        image:
          registry: ghcr.io
    config:
      matchConditions:
      - name: exclude-dynamic-longhorn-crds
        expression: (request.resource.group != "longhorn.io" || request.resource.resource
          == "backuptargets") && (request.resource.group != "cilium.io" || request.resource.resource
          != "ciliumnodes") && (request.resource.group != "coordination.k8s.io" ||
          request.resource.resource != "leases" || request.namespace != "kube-node-lease")
      resourceFiltersExcludeNamespaces:
      - kyverno
      - flux-system
      - kube-system
      - kube-public
      - kube-node-lease
    admissionController:
      replicas: 2
      initContainer:
        image:
          registry: ghcr.io
      container:
        image:
          registry: ghcr.io
        lifecycle:
          preStop:
            sleep:
              seconds: 10
    backgroundController:
      replicas: 1
      image:
        registry: ghcr.io
      podAnnotations:
        migration.cooked.beer/namespace-generator-retired: 'true'
    cleanupController:
      replicas: 1
      image:
        registry: ghcr.io
    reportsController:
      replicas: 1
      image:
        registry: ghcr.io
    features:
      policyExceptions:
        enabled: true
        namespace: kyverno
    upgrade:
      legacyPolicyCheck:
        enabled: true
        image:
          registry: ghcr.io
      acknowledgeLegacyPoliciesNotEnforced: false
