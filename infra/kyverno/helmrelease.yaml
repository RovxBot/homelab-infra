apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 30m
  chart:
    spec:
      chart: kyverno
      version: 3.8.0
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    timeout: 15m
    remediation:
      retries: 3
  values:
    image:
      registry: ghcr.io
    crds:
      migration:
        # The chart defaults this post-upgrade hook to reg.kyverno.io. That
        # registry is intentionally sinkholed on this network, so use the
        # same registry as the deployed Kyverno controllers.
        image:
          registry: ghcr.io
    config:
      # The Flux guardrail deliberately has a wildcard match so that manual
      # edits to any Flux-managed resource are audited.  Do not send
      # high-churn Longhorn controller CR updates through that webhook: no
      # workload policy applies to those CRs, and admission latency can stall
      # storage recovery.  Keep BackupTarget requests so its existing,
      # narrowly scoped guardrail exception still distinguishes the Longhorn
      # controller from a manual edit.
      matchConditions:
        - name: exclude-dynamic-longhorn-crds
          expression: >-
            request.resource.group != "longhorn.io" ||
            request.resource.resource == "backuptargets"
      resourceFiltersExcludeNamespaces:
        - kyverno
        - flux-system
        - kube-system
        - kube-public
        - kube-node-lease
    admissionController:
      replicas: 2
      initContainer:
        image:
          registry: ghcr.io
      container:
        image:
          registry: ghcr.io
    backgroundController:
      replicas: 1
      image:
        registry: ghcr.io
    cleanupController:
      replicas: 1
      image:
        registry: ghcr.io
    reportsController:
      replicas: 1
      image:
        registry: ghcr.io
    features:
      policyExceptions:
        enabled: true
        namespace: kyverno
  # Before the final Flannel node is migrated, move the fail-closed admission
  # webhook onto already-selected Cilium nodes. Validate a ready Cilium
  # endpoint and server-side admission dry-runs before migrating that final
  # node; failurePolicy remains Fail throughout the handoff.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: kyverno-admission-controller
            patch: |
              - op: add
                path: /spec/template/spec/affinity/nodeAffinity
                value:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                      - matchExpressions:
                          - key: io.cilium.migration/cilium-default
                            operator: In
                            values:
                              - "true"
