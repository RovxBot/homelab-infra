# DRAFT: integration fixtures only; activation gates are not satisfied.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: longhorn-csi-registrar-lifecycle
  annotations:
    policies.kyverno.io/title: Longhorn CSI Registrar Shutdown
    policies.kyverno.io/category: Operations
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: DaemonSet
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/description: Longhorn's registrar images have no shell, so their shell-based preStop hook
      fails. The registrar removes its registration socket on SIGTERM. Remove only that redundant hook on the known
      Longhorn CSI DaemonSet.
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - daemonsets
  matchConditions:
  - name: exact-legacy-preconditions
    expression: request.namespace == 'longhorn-system' && object.metadata.name == 'longhorn-csi-plugin' && has(object.spec.template.spec.containers)
      && size(object.spec.template.spec.containers) > 0 && object.spec.template.spec.containers[0].?name.orValue('')
      == 'node-driver-registrar' && object.spec.template.spec.containers[0].?image.orValue('') in ["docker.io/longhornio/csi-node-driver-registrar:v2.16.0",
      "docker.io/longhornio/csi-node-driver-registrar:v2.17.0", "docker.io/longhornio/csi-node-driver-registrar:v2.18.0",
      "longhornio/csi-node-driver-registrar:v2.16.0", "longhornio/csi-node-driver-registrar:v2.17.0", "longhornio/csi-node-driver-registrar:v2.18.0"]
      && has(object.spec.template.spec.containers[0].lifecycle) && has(object.spec.template.spec.containers[0].lifecycle.preStop)
      && has(object.spec.template.spec.containers[0].lifecycle.preStop.exec) && has(object.spec.template.spec.containers[0].lifecycle.preStop.exec.command)
      && size(object.spec.template.spec.containers[0].lifecycle.preStop.exec.command) > 0 && object.spec.template.spec.containers[0].lifecycle.preStop.exec.command[0]
      == '/bin/sh'
  mutations:
  - patchType: JSONPatch
    jsonPatch:
      expression: '[JSONPatch{op: "remove", path: "/spec/template/spec/containers/0/lifecycle/preStop"}]'
