apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: nvidia-device-plugin
      version: 0.19.1
      sourceRef:
        kind: HelmRepository
        name: nvidia-device-plugin
        namespace: kube-system
      interval: 12h
  install:
    remediation:
      retries: 3
    timeout: 10m
  upgrade:
    remediation:
      retries: 3
    timeout: 10m
  values:
    runtimeClassName: nvidia
    nodeSelector:
      nvidia.com/gpu.present: "true"
