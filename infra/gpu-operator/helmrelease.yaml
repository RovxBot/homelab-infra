apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
  namespace: gpu-operator
spec:
  interval: 30m
  chart:
    spec:
      chart: gpu-operator
      version: v26.3.3
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
    timeout: 15m
  upgrade:
    crds: CreateReplace
    # Retrying in place is safe for this host-driver deployment and avoids
    # attempting a rollback when an initial reconciliation has no prior
    # successful Helm revision to roll back to.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
    remediation:
      retries: 3
    timeout: 15m
  values:
    # Talos owns both the kernel driver and the NVIDIA container toolkit.
    # The Operator only discovers and advertises that pre-installed GPU.
    # Talos system extensions expose the driver under /usr/local rather than
    # the /run/nvidia/driver path used by an Operator-managed driver.
    hostPaths:
      driverInstallDir: /usr/local
    driver:
      enabled: false
    toolkit:
      enabled: false
    operator:
      runtimeClass: nvidia
    nfd:
      enabled: true
      nodefeaturerules: false
    cdi:
      enabled: false
    devicePlugin:
      enabled: true
    gfd:
      enabled: true
    validator:
      hostNetwork: false
    dcgm:
      enabled: false
    dcgmExporter:
      enabled: false
    mig:
      strategy: none
    migManager:
      enabled: false
    sandboxWorkloads:
      enabled: false
    sandboxDevicePlugin:
      enabled: false
    kataSandboxDevicePlugin:
      enabled: false
    vgpuDeviceManager:
      enabled: false
    vfioManager:
      enabled: false
    ccManager:
      enabled: false
