apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-mcp
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # One state writer and RWO volume; replacement briefly interrupts diagnostics.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kubernetes-mcp
  template:
    metadata:
      annotations:
        homelab.cooked.beer/oauth-state-format: encrypted-json-v1
      labels:
        app: kubernetes-mcp
    spec:
      serviceAccountName: kubernetes-mcp
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: ghcr.io/rovxbot/kubernetes-mcp@sha256:62d22031ce83c42d0d6546565eefab560a4362122dc930a8f0d826bc286d20f3
          env:
            - name: ALLOWED_NAMESPACES
              value: "*"
            - name: FASTMCP_HOME
              value: /state/fastmcp
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: api-identity
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: oauth
              mountPath: /var/run/oauth
              readOnly: true
            - name: state
              mountPath: /state
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: api-identity
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: oauth
          secret:
            secretName: kubernetes-mcp-oauth
            defaultMode: 0440
        - name: state
          persistentVolumeClaim:
            claimName: kubernetes-mcp-oauth
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-mcp
spec:
  selector:
    app: kubernetes-mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kubernetes-mcp-oauth
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
