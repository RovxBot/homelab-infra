# Opt-in, finite acceptance fixture. It deliberately exits 42 and never contacts
# a service or mounts credentials. Remove its temporary Flux entry after testing.
apiVersion: batch/v1
kind: Job
metadata:
  name: kubernetes-mcp-validation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app: kubernetes-mcp-validation
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: intentional-failure
          image: python:3.14.10-slim-bookworm@sha256:3fe1a0b6c2d6b2ebb572906cdabeca75aeb558c0c17db5ffefbcf8094871c32b
          command: [python, -u, -c]
          args:
            - |
              import sys, time
              print("Intentional MCP acceptance fixture: exit 42; password=fixture-redaction-check", flush=True)
              time.sleep(3)
              sys.exit(42)
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 48Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
