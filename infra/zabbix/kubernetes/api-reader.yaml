# Only the two API health requests retained by the cluster-state profile.
# This identity is never mounted into a Pod and cannot read objects.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zabbix-api-reader
  namespace: zabbix
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zabbix-api-reader
rules:
  - nonResourceURLs: [/livez, /readyz]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zabbix-api-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: zabbix-api-reader
subjects:
  - kind: ServiceAccount
    name: zabbix-api-reader
    namespace: zabbix
