# Keep optional vendor TLS loopback-only if certificates are later mounted.
# Do not include listen-ipv6-ssl.conf: it adds a wildcard IPv6 listener.
server {
    listen 127.0.0.1:8443 ssl;

    http2 on;

    include /etc/nginx/includes/real-ip.conf;
    include /etc/nginx/includes/server-ssl.conf;
    include /etc/nginx/includes/server-common.conf;
}
