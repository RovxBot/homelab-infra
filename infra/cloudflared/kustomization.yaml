apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      homelab.cooked.beer/owner: sam
resources:
  - namespace.yaml
  - deployment.yaml
  - pdb.yaml
  # Keep the tunnel's health endpoint with the workload it exposes.
  - cloudflared-metrics-service.yaml
  - ../../secrets/cloudflared-credentials.enc.yaml
configMapGenerator:
  - name: cloudflared-config
    namespace: cloudflared
    files:
      - config.yaml=config.yaml
