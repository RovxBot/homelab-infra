# Retain the accepted private port-forward and health path verbatim.
server {
    listen 127.0.0.1:8080;
    include /etc/nginx/includes/real-ip.conf;
    include /etc/nginx/includes/server-common.conf;
}

# Only the colocated dedicated cloudflared connector uses this origin. It
# validates the Access JWT before forwarding. Never bind either port to Pod IP.
server {
    listen 127.0.0.1:8081;
    if ($http_host != zabbix.cooked.beer) { return 421; }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store" always;

    # Native login and API credentials remain usable only via private 8080.
    # reconnect=1 enters Zabbix's logout branch before any login processing,
    # including for unauthenticated callers. Native logout uses a CSRF-protected
    # POST. All other requests start SAML; local password login stays on 8080.
    location = /index.php {
        if ($request_method !~ ^(GET|POST)$) { return 405; }
        if ($arg_enter != "") { return 403; }
        if ($arg_reconnect != 1) { return 302 https://zabbix.cooked.beer/index_sso.php; }
        fastcgi_pass unix:/tmp/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /usr/share/zabbix/index.php;
        include fastcgi_params;
    }
    # Place before the vendor generic PHP regex. Cover PATH_INFO variants too.
    location ~* ^/(index|index_http|index_mfa|api_jsonrpc|api_scim|setup)\.php(?:/|$) { return 403; }
    location ~ ^/(ping|status|nginx-status)$ { return 404; }

    include /etc/nginx/includes/server-common.conf;
}

# Trusted listener, never client-supplied forwarding headers, determines PHP's
# HTTPS/cookie context. The private HTTP port keeps its existing cookie behavior.
map $server_port $zabbix_https { default $https; 8081 on; }
map $server_port $zabbix_scheme { default $scheme; 8081 https; }
map $server_port $zabbix_port { default $server_port; 8081 443; }
map $server_port $zabbix_host { default $http_host; 8081 zabbix.cooked.beer; }
