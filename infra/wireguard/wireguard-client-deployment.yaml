apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireguard-client
  labels:
    app: wireguard-client
spec:
  revisionHistoryLimit: 2
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: wireguard-client
  template:
    metadata:
      labels:
        app: wireguard-client
    spec:
      # This gateway does not call the Kubernetes API. Avoid projecting a
      # default ServiceAccount credential into this privileged network pod.
      automountServiceAccountToken: false
      # Pin to a single node so we only have one tunnel + NAT gateway.
      nodeSelector:
        kubernetes.io/hostname: metal7
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 10
      initContainers:
        - name: stage-wireguard-config
          image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - sh
            - -lc
            - |
              install -d -m 700 /config/wg_confs
              install -m 600 /source/vps.conf /config/wg_confs/vps.conf
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: wgconfs
              mountPath: /source
              readOnly: true
      volumes:
        - name: config
          emptyDir: {}
        - name: wgconfs
          secret:
            secretName: wireguard-client-conf
            defaultMode: 0440
            items:
              - key: wg0.conf
                path: vps.conf
      
      containers:
        - name: wireguard
          image: lscr.io/linuxserver/wireguard@sha256:3abfd4b82212106e357989750b9c0c9859aa511f5305a9a55c18c8de7198b655
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Australia/Adelaide
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -lc
                  - |
                    # Block pod-local traffic from reaching host WoW ports.
                    iptables -C OUTPUT -d "${HOST_IP}" -p tcp -m multiport --dports 3724,8085 -j REJECT 2>/dev/null || \
                    iptables -I OUTPUT 1 -d "${HOST_IP}" -p tcp -m multiport --dports 3724,8085 -j REJECT
          volumeMounts:
            - name: config
              mountPath: /config
          readinessProbe:
            exec:
              command:
                - sh
                - -lc
                - "wg show vps >/dev/null 2>&1"
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -lc
                - "wg show vps >/dev/null 2>&1"
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
