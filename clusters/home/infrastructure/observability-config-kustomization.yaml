apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-config
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/observability-config
  # The lone Service has already been handed to the infrastructure
  # reconciler. Preserve it when this retired Kustomization is deleted.
  prune: false
  deletionPolicy: Orphan
  wait: true
  timeout: 5m
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
