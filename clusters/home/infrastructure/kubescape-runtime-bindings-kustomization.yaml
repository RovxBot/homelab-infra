apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubescape-runtime-bindings
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  path: ./infra/kubescape/runtime-bindings
  prune: true
  wait: true
  dependsOn:
    - name: kubescape
  sourceRef:
    kind: GitRepository
    name: flux-system
