apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubernetes-mcp
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  wait: true
  path: ./infra/kubernetes-mcp
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure
  decryption:
    provider: sops
    secretRef:
      name: sops-age
