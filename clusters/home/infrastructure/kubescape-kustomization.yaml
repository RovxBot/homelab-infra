apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubescape
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  # Suspended HelmReleases have no Ready status. Do not block infrastructure
  # health on this staged release. Enable health waiting in the activation PR.
  wait: false
  path: ./infra/kubescape
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure
    - name: kyverno-policies
