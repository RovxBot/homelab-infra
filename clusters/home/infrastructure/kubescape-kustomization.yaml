apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubescape
  namespace: flux-system
spec:
  interval: 10m
  timeout: 12m
  # Wait for the active HelmRelease, including its Deployment/PVC readiness.
  wait: true
  path: ./infra/kubescape
  prune: true
  # Decrypt only Kubescape-owned SOPS Secrets; namespace is in the same
  # source composition, so clean-cluster bootstrap does not depend on
  # a Secret being applied before its Namespace exists.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure
    - name: kyverno-policies
