apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubescape
  namespace: flux-system
spec:
  interval: 10m
  timeout: 12m
  # Wait for the active HelmRelease, including its Deployment/PVC readiness.
  wait: true
  path: ./infra/kubescape
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure
    - name: kyverno-policies
