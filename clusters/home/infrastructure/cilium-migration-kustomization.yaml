apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-migration
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/cilium-migration
  prune: true
  # CiliumNodeConfig is intentionally separate from the Helm release: Cilium
  # Operator creates the CRD, so applying it only after Cilium is Ready avoids
  # a CRD discovery race. No node selector matches until a maintenance action.
  dependsOn:
    - name: cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
