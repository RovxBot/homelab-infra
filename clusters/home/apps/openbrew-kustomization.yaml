apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-openbrew
  namespace: flux-system
spec:
  interval: 5m
  path: ./apps/openbrew
  prune: true
  wait: true
  timeout: 15m
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
