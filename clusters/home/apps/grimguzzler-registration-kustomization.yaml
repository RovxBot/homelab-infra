apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-grimguzzler-registration
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/home/apps/grimguzzler-registration
  prune: true
  dependsOn:
    - name: apps-wotlk
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age