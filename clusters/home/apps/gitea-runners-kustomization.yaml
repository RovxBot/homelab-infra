apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-gitea-runners
  namespace: flux-system
spec:
  interval: 5m
  path: ./apps/gitea-runners
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
    - name: apps-gitea
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
