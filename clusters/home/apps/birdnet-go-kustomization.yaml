apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-birdnet-go
  namespace: flux-system
spec:
  interval: 5m
  path: ./apps/birdnet-go
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
    - name: infrastructure
    - name: infrastructure-mosquitto
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
