# Review/rehearsal example only. No production entrypoint references this file.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: namespace-namespace-example
  namespace: flux-system
  labels:
    homelab.cooked.beer/namespace: namespace-example
spec:
  interval: 10s
  retryInterval: 5s
  timeout: 30s
  path: ./scripts/ci/kyverno/fixtures/namespace-example/namespace
  prune: true
  deletionPolicy: Orphan
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: workloads-namespace-example
  namespace: flux-system
spec:
  interval: 10s
  retryInterval: 5s
  timeout: 30s
  path: ./scripts/ci/kyverno/fixtures/namespace-example/workloads
  prune: true
  wait: true
  dependsOn:
    - name: namespace-namespace-example
  sourceRef:
    kind: GitRepository
    name: flux-system
