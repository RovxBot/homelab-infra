name: Kubescape Assessment Checks

on:
  pull_request:
    paths:
      - infra/kubescape/**
      - secrets/security-receiver-*.enc.yaml
      - ops/security-receiver/*.sh
      - scripts/tests/test_security_receiver_deployment.py
      - infra/pod-report/**
      - infra/observability/gatus-helmrelease.yaml
      - scripts/tests/test_kubescape_health.py
      - clusters/home/kustomization.yaml
      - clusters/home/infrastructure/kubescape-kustomization.yaml
      - scripts/ci/kubescape_runtime.py
      - ops/kubescape/runtime-canary-test.yaml
      - infra/kyverno-policies/policies/workloads.yaml
      - infra/kyverno-policies/policies/namespace.yaml
      - scripts/ci/kyverno/**
      - migration/kyverno/** # Retain deletion/rename coverage for the old paths.
      - scripts/ci/check_kubescape.py
      - scripts/ci/tests/test_kubescape.py
      - scripts/grype*.py
      - scripts/kubescape_db.py
      - scripts/kubescape_recurring_bundle.py
      - scripts/ci/check_kubescape_recurring.py
      - scripts/ci/image_reference.py
      - scripts/tests/test_image_reference.py
      - scripts/tests/test_kubescape_recurring.py
      - scripts/tests/test_grype*.py
      - .github/workflows/grype-database-refresh.yml
      - .github/workflows/kubescape-checks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned render and validation tools
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="${RUNNER_TEMP}/kubescape-tools"
          mkdir -p "$tools_dir"
          curl -fsSL https://get.helm.sh/helm-v3.20.2-linux-amd64.tar.gz -o "$tools_dir/helm.tgz"
          tar -xzf "$tools_dir/helm.tgz" -C "$tools_dir"
          mv "$tools_dir/linux-amd64/helm" "$tools_dir/helm"
          curl -fsSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz -o "$tools_dir/kustomize.tgz"
          tar -xzf "$tools_dir/kustomize.tgz" -C "$tools_dir" kustomize
          python3 -m pip install PyYAML==6.0.3 zstandard==0.25.0
          TRUST_SCOPE=cli bash scripts/ci/kyverno/trust.sh
          cp .work/cel/bin/kyverno "$tools_dir/kyverno"
          echo "KYVERNO_EXPECTED_VERSION=$(jq -er .application .work/cel/trust/target.json)" >> "$GITHUB_ENV"
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz -o "$tools_dir/kubeconform.tgz"
          tar -xzf "$tools_dir/kubeconform.tgz" -C "$tools_dir" kubeconform
          echo "$tools_dir" >> "$GITHUB_PATH"
          python3 -m pip install --quiet pyyaml

      - name: Test suspended and active preflight guards
        run: |
          python3 -m unittest discover -s scripts/ci/tests -p test_kubescape.py -v
          python3 -m unittest discover -s scripts/tests -p test_security_receiver_deployment.py -v
          python3 -m unittest discover -s scripts/tests -p 'test_grype*.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_kubescape_recurring.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_kubescape_health.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_cluster_health.py' -v
          python3 scripts/ci/check_kubescape_recurring.py

      - name: Independently reverify a changed database pin
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet "$BASE_REF" -- infra/kubescape/grype-database.json; then
            digest=$(python3 -c 'import json; print(json.load(open("infra/kubescape/grype-database.json"))["indexDigest"])')
            python3 scripts/grype_db.py --reference "$digest" --output .work/grype-db/ci-verification.json
            python3 - <<'PY'
          import json
          actual = json.load(open('.work/grype-db/ci-verification.json'))
          locked = json.load(open('infra/kubescape/grype-database.json'))
          for field in ('image', 'indexDigest', 'manifestDigest', 'configDigest',
                        'layers', 'metadata', 'database', 'storage'):
              assert actual[field] == locked[field], f'Locked database evidence differs: {field}'
          assert actual['publisher']['document'] == locked['publisher']['document']
          PY
          fi

      - name: Preserve independent database verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: grype-ci-verification
          path: .work/grype-db/ci-verification.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Qualify the declared release mode against the released chart
        # Active mode additionally requires Flux health waiting. Both modes
        # retain zero admission failures and a suspended recurring scheduler.
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mode=$(python3 -c 'import yaml; r=yaml.safe_load(open("infra/kubescape/helmrelease.yaml")); print("--staged-review" if r["spec"].get("suspend") is True else "--active-review")')
          python3 scripts/ci/check_kubescape.py "$mode" --base-ref "$BASE_REF" --expected-kyverno-version "$KYVERNO_EXPECTED_VERSION"

      - name: Validate rendered workloads and Flux integration
        shell: bash
        run: |
          set -euo pipefail
          kustomize build infra/kubescape > .work/kubescape-preflight/source.yaml
          kyverno apply infra/kyverno-policies/policies/workloads.yaml infra/kyverno-policies/policies/namespace.yaml \
            --resource .work/kubescape-preflight/source.yaml --policy-report > .work/kubescape-preflight/recurring-kyverno.yaml
          python3 - <<'PY'
          import yaml
          text = open('.work/kubescape-preflight/recurring-kyverno.yaml').read()
          report = yaml.safe_load(text[text.index('apiVersion:'):])
          # Retain the restricted acceptance namespace for receiver inventory
          # RBAC even when the disposable Deployment is absent: one namespace
          # check is unconditional, seven workload checks are opt-in.
          source = yaml.safe_load(open('infra/kubescape/kustomization.yaml'))
          trigger = '../../ops/security-collector/acceptance/trigger'
          count = source['resources'].count(trigger)
          assert count in (0, 1), 'unexpected duplicate R1000 fixture'
          assert source['resources'].count('receiver') == 1, 'receiver activation missing/duplicated'
          receiver = yaml.safe_load(open('infra/kubescape/receiver/kustomization.yaml'))
          assert receiver['resources'].count('acceptance-namespace.yaml') == 1 - count
          docs = [d for d in yaml.safe_load_all(open('.work/kubescape-preflight/source.yaml')) if isinstance(d, dict)]
          namespaces = [d for d in docs if d['kind'] == 'Namespace' and d['metadata']['name'] == 'kubescape-runtime-test']
          assert len(namespaces) == 1, 'missing or duplicate restricted acceptance namespace'
          assert namespaces[0]['metadata']['labels']['pod-security.kubernetes.io/enforce'] == 'restricted'
          fixtures = [d for d in docs if d['kind'] == 'Deployment' and d['metadata']['name'] == 'runtime-acceptance' and d['metadata'].get('namespace') == 'kubescape-runtime-test']
          assert len(fixtures) == count, 'unexpected rendered acceptance workload'
          assert count == 0, 'legacy fixture is retired'
          assert 'collector' not in source['resources']
          assert 'collector-retained-state.yaml' not in source['resources']
          legacy = [d for d in docs if d['metadata']['name'].startswith('security-collector')]
          assert not legacy, 'legacy resources remain in desired state'
          native = [d for d in docs if d['kind'] == 'PersistentVolumeClaim' and d['metadata']['name'] == 'security-receiver-state']
          assert len(native) == 1
          assert native[0]['metadata']['annotations']['kustomize.toolkit.fluxcd.io/prune'] == 'disabled'
          expected = 13 + 1 + 7 + 6  # base without collector Deployment, namespace, receiver, refresh
          assert report['summary'] == {'pass': expected, 'fail': 0, 'error': 0, 'skip': 0, 'warn': 0}, report['summary']
          PY
          kustomize build --load-restrictor LoadRestrictionsNone clusters/home/infrastructure > .work/kubescape-preflight/infrastructure.yaml
          kustomize build --load-restrictor LoadRestrictionsNone clusters/home > .work/kubescape-preflight/entrypoint.yaml
          # Flux SOPS decrypts before Kubernetes admission. kubeconform
          # cannot validate encrypted Secret metadata/ciphertext directly.
          # Check exact encrypted objects first, then use a schema-only copy
          # with placeholder base64 values. No key or decryption in CI.
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          src=Path('.work/kubescape-preflight/source.yaml')
          docs=list(yaml.safe_load_all(src.read_text()))
          allowed={'security-receiver-ca': {'receiver-ca.crt'},
                   'security-receiver-tls': {'tls.crt','tls.key'}}
          found=set()
          for doc in docs:
              if not isinstance(doc,dict) or doc.get('kind')!='Secret':
                  continue
              name=doc.get('metadata',{}).get('name')
              assert name in allowed or 'sops' not in doc, 'unexpected SOPS source Secret'
              if name not in allowed:
                  continue
              assert name not in found, 'duplicate receiver Secret'
              found.add(name)
              assert doc['metadata']['namespace']=='kubescape'
              assert set(doc.get('data',{}))==allowed[name]
              assert doc['sops']['encrypted_regex']==('^(data|stringData)' + chr(36))
              assert all(v.startswith('ENC[AES256_GCM,')
                         for v in doc['data'].values()), 'unexpected plaintext in encrypted Secret'
              doc.pop('sops')
              doc['data']={key:'Y2ktc2NoZW1hLW9ubHk=' for key in allowed[name]}
          assert found==set(allowed), 'missing receiver TLS/CA Secret'
          Path('.work/kubescape-preflight/source-schema.yaml').write_text(
              yaml.safe_dump_all(docs,sort_keys=False))
          PY
          kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.34.0 -summary \
            .work/kubescape-preflight/rendered.yaml .work/kubescape-preflight/source-schema.yaml ops/kubescape/runtime-canary-test.yaml
