name: Repo Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repo-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-repo-check-changes:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.changes.outputs.should_run }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect manifest-relevant changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "$BASE_REF"
          range="$(git merge-base HEAD "origin/$BASE_REF")...HEAD"
          changed_files="$(git diff --name-only "$range")"
          printf 'Changed files in %s:\n%s\n' "$range" "$changed_files"

          if echo "$changed_files" | grep -Eq '^(\.github/workflows/ci\.yml|\.github/kyverno-baseline\.yaml|apps/|clusters/|infra/|scripts/ci/|secrets/)'; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  repo-checks:
    needs: detect-repo-check-changes
    if: needs.detect-repo-check-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure forbidden files are not tracked
        shell: bash
        run: |
          set -euo pipefail
          forbidden_regex='(^|/)(age-key\.txt|.*\.key|.*\.pem|.*\.p12|.*\.pfx|.*\.age|.*\.agekey|immich_backup_.*\.sql|modules/mod-playerbots/data/sql/playerbots/base/playerbots_travelnode_path\.sql)$'
          if git ls-files | grep -E "$forbidden_regex"; then
            echo "Forbidden files are tracked. Remove them before merging."
            exit 1
          fi

      - name: Install kustomize
        shell: bash
        run: |
          set -euo pipefail
          KUSTOMIZE_VERSION="5.5.0"
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" -o /tmp/kustomize.tgz
          tar -xzf /tmp/kustomize.tgz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Render Flux entrypoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work
          kustomize build --load-restrictor LoadRestrictionsNone clusters/home > .work/rendered.yaml
          test -s .work/rendered.yaml

      - name: Install kubeconform
        shell: bash
        run: |
          set -euo pipefail
          KUBECONFORM_VERSION="0.6.7"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" -o /tmp/kubeconform.tgz
          tar -xzf /tmp/kubeconform.tgz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Install Kyverno CLI
        shell: bash
        run: |
          set -euo pipefail
          KYVERNO_VERSION="1.15.2"
          curl -fsSL "https://github.com/kyverno/kyverno/releases/download/v${KYVERNO_VERSION}/kyverno-cli_v${KYVERNO_VERSION}_linux_x86_64.tar.gz" -o /tmp/kyverno.tgz
          tar -xzf /tmp/kyverno.tgz -C /tmp kyverno
          sudo mv /tmp/kyverno /usr/local/bin/kyverno
          kyverno version

      - name: Validate rendered manifests
        shell: bash
        run: |
          set -euo pipefail
          kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.34.0 .work/rendered.yaml

      - name: Check unresolved Secret references
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 scripts/ci/check_secret_refs.py .work/rendered.yaml

      - name: Run Kyverno baseline gate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/kyverno_gate.py check \
            --repo-root . \
            --cluster-root clusters/home \
            --baseline .github/kyverno-baseline.yaml \
            --kyverno-bin /usr/local/bin/kyverno \
            --work-dir .work/kyverno-gate

      - name: Upload Kyverno gate artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kyverno-gate-artifacts
          path: .work/kyverno-gate

  skip-repo-checks:
    needs: detect-repo-check-changes
    if: needs.detect-repo-check-changes.outputs.should_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip repo checks
        shell: bash
        run: echo "No manifest-relevant changes detected; repo checks are not needed."
