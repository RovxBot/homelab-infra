name: Renovate

on:
  workflow_dispatch: {}
  schedule:
    # 20:30 AEST / 21:30 AEDT: one predictable, low-activity daily run.
    - cron: "30 10 * * *"

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    env:
      LOG_LEVEL: info
      RENOVATE_AUTODISCOVER: "true"
      RENOVATE_AUTODISCOVER_FILTER: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Token source
        env:
          HAS_RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN != '' }}
        run: echo "HAS_RENOVATE_TOKEN=$HAS_RENOVATE_TOKEN (workflow uses GITHUB_TOKEN by default)"

      - name: Configure Docker Hub auth (optional)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Docker Hub secrets not set; skipping auth"
            exit 0
          fi

          echo "Configuring Renovate Docker Hub auth via RENOVATE_HOST_RULES"
          cat >> "$GITHUB_ENV" <<EOF
          RENOVATE_HOST_RULES=[{"hostType":"docker","matchHost":"index.docker.io","username":"$DOCKERHUB_USERNAME","password":"$DOCKERHUB_TOKEN"},{"hostType":"docker","matchHost":"registry-1.docker.io","username":"$DOCKERHUB_USERNAME","password":"$DOCKERHUB_TOKEN"}]
          EOF

      - name: Run Renovate
        uses: renovatebot/github-action@973d3e5a68e735a444e8c03432b66eedb343c302 # v46.2.0
        with:
          # Prefer a PAT if provided, otherwise fall back to the workflow's built-in token.
          # If you use a PAT, it must be able to read issues via GraphQL or Renovate can fail during initRepo().
          token: ${{ secrets.RENOVATE_TOKEN != '' && secrets.RENOVATE_TOKEN || github.token }}
          configurationFile: renovate.json
