name: Isolated Kyverno deployment qualification

on:
  push:
    branches: [feat/kyverno-cel-isolated-rehearsal]
    paths:
      - migration/kyverno/harness/**
      - migration/kyverno/policies/**
      - migration/kyverno/exceptions/**
      - migration/kyverno/policy-map.json
      - .github/workflows/kyverno-cel-rehearsal.yml
  workflow_dispatch:
    inputs:
      chart:
        description: Exact proposed chart (blank uses the migration target)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: kyverno-cel-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    uses: ./.github/workflows/kyverno-compatibility.yml
    with:
      chart: ${{ inputs.chart || '3.10.0' }}
