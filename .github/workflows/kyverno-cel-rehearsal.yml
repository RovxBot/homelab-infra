name: Isolated Kyverno CEL rehearsal

on:
  push:
    branches: [feat/kyverno-cel-isolated-rehearsal]
    paths:
      - migration/kyverno/**
      - .github/workflows/kyverno-cel-rehearsal.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kyverno-cel-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify official trust, release identity, signatures and provenance
        run: bash migration/kyverno/harness/trust.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: kyverno-cel-trust
          path: |
            .work/cel/trust/*.json
            .work/cel/trust/*.log
            .work/cel/trust/status
          retention-days: 14
