name: Isolated Kyverno deployment qualification

on:
  workflow_dispatch:
    inputs:
      chart:
        description: Exact proposed chart; blank reads the proposed HelmRelease
        type: string
        default: ''
      scenarios:
        description: JSON array of diagnostic scenarios; blank runs full qualification
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: kyverno-cel-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    uses: ./.github/workflows/kyverno-compatibility.yml # zizmor: ignore[self-repository] -- same-commit call; pinned actionlint lacks $/ syntax
    with:
      chart: ${{ inputs.chart }}
      scenarios: ${{ inputs.scenarios }}
