name: Security Collector Image
on:
  pull_request:
    paths:
      - scripts/security_collector/**
      - scripts/tests/test_security_collector*.py
      - ops/security-collector/**
      - infra/kubescape/collector/**
      - .github/workflows/security-collector-image.yml
      - scripts/ci/scan_image.py
      - scripts/tests/test_security_ci_scan.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-collector-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 -m unittest discover -s scripts/tests -p 'test_security_collector*.py' -v
  image:
    needs: qualify
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: python3 -m pip install PyYAML==6.0.3
      - name: Install checksum-verified crane
        run: |
          curl --fail --location --retry 2 https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz -o /tmp/crane.tgz
          echo '0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0  /tmp/crane.tgz' | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/collector-tools"
          tar -xzf /tmp/crane.tgz -C "$RUNNER_TEMP/collector-tools" crane
          echo "$RUNNER_TEMP/collector-tools" >> "$GITHUB_PATH"
      - name: Build reproducible image and require the reviewed deployment digest
        id: build
        run: |
          python3 ops/security-collector/build-image.py --output /tmp/collector-image
          python3 - <<'PY'
          import json, os, pathlib, yaml
          proof = json.loads(pathlib.Path('/tmp/collector-image/build.json').read_text())
          docs = list(yaml.safe_load_all(pathlib.Path('infra/kubescape/collector/workload.yaml').read_text()))
          deployment = next(d for d in docs if d['kind'] == 'Deployment')
          image = deployment['spec']['template']['spec']['containers'][0]['image']
          assert image == 'ghcr.io/rovxbot/security-collector@' + proof['digest'], 'Deployment image does not match this source'
          retained = json.loads(pathlib.Path('ops/security-collector/production-image.json').read_text())
          assert proof == retained, 'Build inputs differ from retained qualification'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('digest=' + proof['digest'] + '\n')
          PY
      - name: Exercise the built image with production process restrictions
        run: |
          docker load -i /tmp/collector-image/image.tar
          docker run --rm --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --entrypoint python3 ghcr.io/rovxbot/security-collector:build -B -c \
            'import os,sqlite3; from security_collector.service import Service; assert os.getuid()==10001; c=sqlite3.connect("/tmp/smoke.sqlite"); c.execute("create table smoke (id integer)"); c.close()'
          docker run --rm --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges ghcr.io/rovxbot/security-collector:build --help
      - name: Publish the qualified image without changing GitOps desired state
        env:
          GHCR_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '%s' "$GHCR_TOKEN" | crane auth login ghcr.io --username "$ACTOR" --password-stdin
          crane push /tmp/collector-image/image.tar "ghcr.io/rovxbot/security-collector:sha256-${IMAGE_DIGEST#sha256:}"
      - name: Require anonymous digest retrieval before operator merge
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          registry_config=$(mktemp -d)
          DOCKER_CONFIG="$registry_config" crane validate --remote "ghcr.io/rovxbot/security-collector@${IMAGE_DIGEST}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: security-collector-image
          path: /tmp/collector-image/build.json

  scan:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate digest-scanning contract
        run: python3 -m unittest discover -s scripts/tests -p 'test_security_ci_scan.py' -v
      - name: Scan qualified published immutable image
        env:
          SCAN_IMAGE_REPOSITORY: ghcr.io/rovxbot/security-collector@
          SCANNED_DIGEST: ${{ needs.image.outputs.digest }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci/scan_image.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: security-collector-scan-provenance
          path: .work/image-scan/provenance.json
          if-no-files-found: error
          retention-days: 14
