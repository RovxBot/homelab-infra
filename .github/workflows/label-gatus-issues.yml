name: Label Gatus Issues

on:
  issues:
    types:
      - opened
      - reopened
      - closed

permissions:
  issues: write

jobs:
  label-gatus-issues:
    if: startsWith(github.event.issue.title, 'alert(gatus):')
    runs-on: ubuntu-latest
    steps:
      - name: Apply Gatus incident labels
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const existingLabels = context.payload.issue.labels.map((label) => label.name);

            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: issueNumber,
              labels: ['observability', 'incident', 'source:gatus', 'auto-created', 'internal'],
            });

            if (existingLabels.includes('resolved')) {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: issueNumber,
                name: 'resolved',
              });
            }

      - name: Mark Gatus incidents resolved
        if: github.event.action == 'closed'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.payload.issue.number,
              labels: ['resolved'],
            });
