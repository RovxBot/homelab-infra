name: OpenBrew database image

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/openbrew-database-image.yml

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    env:
      SOURCE_IMAGE: mcr.microsoft.com/mssql/server@sha256:e07b9699a2b749969f19d86563ceeea22bd3a69f7f1db85a8d1ac4bdaf0c6f56
      TARGET_IMAGE: ghcr.io/rovxbot/openbrew-sqlserver:2022-CU25-ubuntu-22.04
    steps:
      - name: Install registry tooling
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends skopeo
      - name: Mirror the unmodified Microsoft image
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          skopeo copy --preserve-digests "docker://${SOURCE_IMAGE}" "docker://${TARGET_IMAGE}"
          skopeo inspect --format '{{.Digest}}' "docker://${TARGET_IMAGE}"
