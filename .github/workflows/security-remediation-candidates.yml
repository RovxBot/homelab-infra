name: Security Remediation Candidates

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: security-remediation-candidates
  cancel-in-progress: false

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install parser
        run: python3 -m pip install PyYAML==6.0.3

      - name: Discover reviewed replacement candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .work/security-remediation
          python3 scripts/security_remediation_candidates.py --live > .work/security-remediation/candidates.json

      - name: Retain public manifest candidate metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: security-remediation-candidates
          path: .work/security-remediation/candidates.json
          retention-days: 2
          if-no-files-found: error
