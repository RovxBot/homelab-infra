name: Kubescape Bounded Scanner Image
on:
  pull_request:
    paths:
      - infra/kubescape/recurring/scanner/**
      - .github/workflows/kubescape-scanner-image.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kubescape-scanner-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify a previously tested immutable artifact when only deployment evidence changed
        id: artifact
        working-directory: infra/kubescape/recurring/scanner
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, json
          from pathlib import Path
          proof = Path('build-evidence.json')
          if not proof.exists():
              print('rebuild=true')
          else:
              evidence = json.loads(proof.read_text())
              assert evidence['status'] == 'verified'
              for name, digest in evidence['inputs'].items():
                  assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
              assert set(evidence['inputs']) == {'Dockerfile', 'force-rescan.patch', 'force_rescan_test.go'}
              assert '@sha256:' in evidence['image']
              Path('../../../../scanner-image-digest.txt').write_text(evidence['image'] + '\n')
              print('rebuild=false')
          PY
      - name: Fetch the exact qualified scanner source
        if: steps.artifact.outputs.rebuild == 'true'
        working-directory: infra/kubescape/recurring/scanner
        run: |
          curl --fail --location --retry 2 https://github.com/kubescape/kubevuln/archive/45d265e3b46af4d7fc1c896ecc22a93915f2d6fe.tar.gz --output /tmp/kubevuln.tar.gz
          echo '1d805eca4b3a2075214ba39bb2cdf5d6bd588626f11cd4b7be1d8b9420cc1058  /tmp/kubevuln.tar.gz' | sha256sum --check --strict
          mkdir upstream
          tar -xzf /tmp/kubevuln.tar.gz --strip-components=1 -C upstream
          patch --fuzz=0 --dry-run -p1 -d upstream < force-rescan.patch
          patch --fuzz=0 -p1 -d upstream < force-rescan.patch
      - name: Build and test the bounded scanner extension
        if: steps.artifact.outputs.rebuild == 'true'
        env:
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: docker build --tag "ghcr.io/rovxbot/kubevuln:${REVISION}" infra/kubescape/recurring/scanner
      - name: Publish the tested same-repository artifact
        if: steps.artifact.outputs.rebuild == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GHCR_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker push "ghcr.io/rovxbot/kubevuln:${REVISION}"
          docker inspect "ghcr.io/rovxbot/kubevuln:${REVISION}" --format '{{index .RepoDigests 0}}' > scanner-image-digest.txt
      - name: Verify anonymous retrieval of the previously tested deployment pin
        if: steps.artifact.outputs.rebuild == 'false'
        shell: bash
        run: |
          image=$(cat scanner-image-digest.txt)
          registry_config=$(mktemp -d)
          DOCKER_CONFIG="$registry_config" docker manifest inspect "$image" > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: kubescape-scanner-image
          path: scanner-image-digest.txt
