name: Kubescape Bounded Scanner Image
on:
  pull_request:
    paths:
      - infra/kubescape/recurring/scanner/**
      - .github/workflows/kubescape-scanner-image.yml
      - scripts/ci/scanner_build_evidence.py
      - scripts/ci/tests/test_scanner_build_evidence.py
  workflow_dispatch:
    inputs:
      build_candidate:
        description: Build ONE reviewed scanner candidate from this ref; upload evidence without promoting deployment
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: kubescape-scanner-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test-build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      UPSTREAM_COMMIT: 45d265e3b46af4d7fc1c896ecc22a93915f2d6fe
      UPSTREAM_ARCHIVE_SHA256: 1d805eca4b3a2075214ba39bb2cdf5d6bd588626f11cd4b7be1d8b9420cc1058
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install evidence test dependencies
        run: python3 -m pip install PyYAML==6.0.3
      - name: Test scanner evidence gates
        run: python3 -m unittest discover -s scripts/ci/tests -p test_scanner_build_evidence.py -v
      - name: Qualify recorded inputs or select an explicitly approved candidate build
        id: artifact
        env:
          BUILD_CANDIDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_candidate }}
        shell: bash
        run: |
          if [[ "$BUILD_CANDIDATE" == 'true' ]]; then
            echo 'rebuild=true' >> "$GITHUB_OUTPUT"
          else
            python3 scripts/ci/scanner_build_evidence.py verify \
              --upstream-commit "$UPSTREAM_COMMIT" --upstream-sha "$UPSTREAM_ARCHIVE_SHA256" \
              --image-file scanner-image-digest.txt
            echo 'rebuild=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch the exact qualified scanner source
        id: source
        if: steps.artifact.outputs.rebuild == 'true'
        working-directory: infra/kubescape/recurring/scanner
        run: |
          curl --fail --location --retry 2 "https://github.com/kubescape/kubevuln/archive/${UPSTREAM_COMMIT}.tar.gz" --output /tmp/kubevuln.tar.gz
          echo "$UPSTREAM_ARCHIVE_SHA256  /tmp/kubevuln.tar.gz" | sha256sum --check --strict
          mkdir upstream
          tar -xzf /tmp/kubevuln.tar.gz --strip-components=1 -C upstream
          patch --fuzz=0 --dry-run -p1 -d upstream < force-rescan.patch
          patch --fuzz=0 -p1 -d upstream < force-rescan.patch
      - name: Build and test the bounded scanner extension
        id: build
        if: steps.artifact.outputs.rebuild == 'true'
        env:
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: docker build --tag "ghcr.io/rovxbot/kubevuln:${REVISION}" infra/kubescape/recurring/scanner
      - name: Publish the tested same-repository artifact
        id: publish
        if: steps.artifact.outputs.rebuild == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GHCR_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker push "ghcr.io/rovxbot/kubevuln:${REVISION}"
          docker inspect "ghcr.io/rovxbot/kubevuln:${REVISION}" --format '{{index .RepoDigests 0}}' > scanner-image-digest.txt
      - name: Verify anonymous registry retrieval
        id: registry
        shell: bash
        run: |
          image=$(cat scanner-image-digest.txt)
          registry_config=$(mktemp -d)
          DOCKER_CONFIG="$registry_config" docker manifest inspect "$image" > /dev/null
      - name: Record evidence from the tested candidate inputs
        id: proof
        if: steps.artifact.outputs.rebuild == 'true'
        env:
          REVISION: ${{ github.sha }}
          BUILD_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/ci/scanner_build_evidence.py record \
            --upstream-commit "$UPSTREAM_COMMIT" --upstream-sha "$UPSTREAM_ARCHIVE_SHA256" \
            --source-commit "$REVISION" --build-run "$BUILD_RUN" \
            --image-file scanner-image-digest.txt --output .work/scanner-build-evidence.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: kubescape-scanner-image
          path: |
            scanner-image-digest.txt
            .work/scanner-build-evidence.json
      - name: Summarize scanner failure category
        if: failure()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          steps = json.loads(os.environ['STEPS'])
          labels = {'artifact': 'Build qualification rejected existing evidence; no candidate was built',
                    'source': 'Source retrieval or integrity verification failed; inspect download/checksum/patch log',
                    'build': 'Candidate build/test qualification failed; inspect compiler, regression or base-pull log',
                    'publish': 'External registry publication failed; no promotion evidence generated',
                    'registry': 'External anonymous registry retrieval failed; no promotion evidence generated',
                    'proof': 'Candidate evidence generation failed; do not promote'}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              for step, label in labels.items():
                  if steps.get(step, {}).get('outcome') == 'failure':
                      summary.write('- ' + label + '.\n')
          PY
