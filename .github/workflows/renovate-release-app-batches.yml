name: Release Renovate Application Batches

on:
  issues:
    types:
      - edited
  push:
    branches:
      - main
    paths:
      - renovate.json
      - .github/workflows/renovate-release-app-batches.yml

permissions:
  issues: write

concurrency:
  group: renovate-release-app-batches
  # Finish the current approval; subsequent edits queue a fresh Dashboard read.
  cancel-in-progress: false

jobs:
  release-application-batch:
    if: (github.event_name == 'push' || github.event.issue.title == 'Renovate Dependency Dashboard') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Approve batches containing an application release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const primaryApplicationImages = [
              'ghcr.io/gethomepage/homepage',
              'ghcr.io/home-assistant/home-assistant',
              'ghcr.io/immich-app/immich-server',
              'ghcr.io/rovxbot/azerothcore-wotlk',
              'ghcr.io/rovxbot/grimguzzler-registration',
              'invoiceninja/invoiceninja',
              'jellyfin/jellyfin',
              'linuxserver/prowlarr',
              'linuxserver/radarr',
              'linuxserver/sabnzbd',
              'linuxserver/sonarr',
              'neosmemo/memos',
              'seerr/seerr',
              'vaultwarden/server',
              'wger/server',
            ];
            // Read current state once. Renovate's later Dashboard edits trigger
            // another run when newly discovered application releases appear.
            let issueNumber = context.payload.issue?.number;
            if (!issueNumber) {
              const { data: issues } = await github.rest.issues.listForRepo({
                ...context.repo,
                state: 'open',
                per_page: 100,
              });
              issueNumber = issues.find(
                (candidate) => candidate.title === 'Renovate Dependency Dashboard',
              )?.number;
            }

            if (!issueNumber) {
              core.info('No open Renovate Dependency Dashboard exists.');
              return;
            }

            const { data: issue } = await github.rest.issues.get({
              ...context.repo,
              issue_number: issueNumber,
            });
            const body = issue.body ?? '';
            const heading = /^## Pending Approval\r?$/m.exec(body);
            if (!heading) {
              core.info('No pending approvals; nothing to do.');
              return;
            }

            const nextHeading = /^## /gm;
            nextHeading.lastIndex = heading.index + heading[0].length;
            const pendingEnd = nextHeading.exec(body)?.index ?? body.length;
            const pending = body.slice(heading.index, pendingEnd);
            let approved = 0;
            const approvedPending = pending.replace(
              /^[ \t]*- \[ \] <!-- approve-branch=[^>]+ -->[ \t]*([^\r\n]+)/gm,
              (entry, title) => {
                if (!primaryApplicationImages.some((image) => title.includes(image))) {
                  return entry;
                }

                approved += 1;
                return entry.replace('- [ ]', '- [x]');
              },
            );

            if (approved === 0) {
              core.info('No pending batch includes a primary application image; nothing to do.');
              return;
            }

            await github.rest.issues.update({
              ...context.repo,
              issue_number: issue.number,
              body: body.slice(0, heading.index) + approvedPending + body.slice(pendingEnd),
            });
            core.info(`Approved ${approved} application release batch(es).`);
