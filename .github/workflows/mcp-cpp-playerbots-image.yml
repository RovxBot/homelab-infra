name: Build Playerbots MCP image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image owner
        shell: bash
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Read upstream ref
        id: read_upstream_ref
        shell: bash
        run: |
          set -euo pipefail
          ref="$(cat ops/mcp-cpp/mcp-cpp.ref)"
          ref_tag="$(echo "${ref}" | tr '/:@' '-' | tr -cd 'A-Za-z0-9._-')"
          echo "MCP_CPP_REF=${ref}" >> "$GITHUB_ENV"
          echo "REF_TAG=${ref_tag,,}" >> "$GITHUB_ENV"

      - name: Build and push image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          progress: plain
          context: .
          file: ops/mcp-cpp/Dockerfile
          push: true
          build-args: |
            MCP_CPP_REF=${{ env.MCP_CPP_REF }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/mcp-cpp-playerbots:${{ env.REF_TAG }}
            ghcr.io/${{ env.OWNER_LC }}/mcp-cpp-playerbots:${{ env.REF_TAG }}-${{ github.sha }}

      - name: Smoke test image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER_LC}/mcp-cpp-playerbots:${REF_TAG}-${GITHUB_SHA}"
          docker pull "${image}"

          docker run --rm --entrypoint /bin/sh "${image}" -lc '
            set -euo pipefail
            mcp-cpp-server --help >/tmp/mcp-help.txt
            clangd --version >/tmp/clangd-version.txt
            supergateway --help >/tmp/supergateway-help.txt
            test -s /tmp/mcp-help.txt
            test -s /tmp/clangd-version.txt
            test -s /tmp/supergateway-help.txt
          '
