name: Kubernetes MCP
on:
  pull_request:
    paths:
      - infra/kubernetes-mcp/**
      - ops/kubernetes-mcp/**
      - .github/workflows/kubernetes-mcp.yml
      - scripts/ci/scan_image.py
      - scripts/tests/test_security_ci_scan.py
  push:
    branches: [main]
    paths:
      - infra/kubernetes-mcp/src/**
      - infra/kubernetes-mcp/requirements*
      - infra/kubernetes-mcp/Dockerfile
      - .github/workflows/kubernetes-mcp.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kubernetes-mcp-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - name: Install locked runtime and test dependencies
        run: |
          python -m pip install --require-hashes -r infra/kubernetes-mcp/requirements.txt
          python -m pip install pytest==9.2.0 pytest-asyncio==1.4.1.post1 pyyaml==6.0.3
      - name: Test authentication and diagnostic boundaries
        run: python -m pytest -q infra/kubernetes-mcp/tests
      - name: Build tested image
        env:
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker build --tag "ghcr.io/rovxbot/kubernetes-mcp:${REVISION}" infra/kubernetes-mcp
      - name: Publish same-repository build
        id: publish
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GHCR_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker push "ghcr.io/rovxbot/kubernetes-mcp:${REVISION}"
          docker inspect "ghcr.io/rovxbot/kubernetes-mcp:${REVISION}" --format '{{index .RepoDigests 0}}' > image-digest.txt
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          ref=Path("image-digest.txt").read_text().strip()
          match=re.fullmatch(r"ghcr[.]io/rovxbot/kubernetes-mcp@(sha256:[a-f0-9]{64})",ref)
          assert match, "Unrecognized published image reference"
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("digest="+match.group(1)+"\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: kubernetes-mcp-image
          path: image-digest.txt

  scan:
    needs: test-build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate digest-scanning contract
        run: python3 -m unittest discover -s scripts/tests -p 'test_security_ci_scan.py' -v
      - name: Scan qualified published immutable image
        env:
          SCAN_IMAGE_REPOSITORY: ghcr.io/rovxbot/kubernetes-mcp@
          SCANNED_DIGEST: ${{ needs.test-build.outputs.digest }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci/scan_image.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: kubernetes-mcp-scan-provenance
          path: .work/image-scan/provenance.json
          if-no-files-found: error
          retention-days: 14
