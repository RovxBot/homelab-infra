name: Build Grim Guzzler registration image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ops/grimguzzler-registration/**"
      - ".github/workflows/grimguzzler-registration-image.yml"

permissions:
  contents: read

jobs:
  pr-validate:
    # Renovate updates the Dockerfile. Validate it without publishing an image
    # or granting the pull-request workflow package-write permission.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read upstream ref
        shell: bash
        run: |
          set -euo pipefail
          repo="$(cat ops/grimguzzler-registration/source.repo 2>/dev/null || true)"
          if [[ -z "${repo}" ]]; then
            repo="https://github.com/RovxBot/WoWSimpleRegistration.git"
          fi
          ref="$(cat ops/grimguzzler-registration/source.ref 2>/dev/null || true)"
          if [[ -z "${ref}" ]]; then
            ref="master"
          fi
          {
            echo "UPSTREAM_REPO=${repo}"
            echo "UPSTREAM_REF=${ref}"
          } >> "$GITHUB_ENV"

      - name: Prepare build context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work
          git clone --depth=1 --branch "${UPSTREAM_REF}" "${UPSTREAM_REPO}" .work/registration

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build registration image for validation
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .work/registration
          file: ops/grimguzzler-registration/Dockerfile
          load: true
          push: false
          tags: grimguzzler-registration:pr-${{ github.event.pull_request.number }}

      - name: Smoke test registration image
        shell: bash
        run: |
          set -euo pipefail
          image="grimguzzler-registration:pr-${{ github.event.pull_request.number }}"
          docker run --rm --entrypoint /bin/sh "${image}" -c '
            set -eu
            test -f /var/www/html/index.php
            test -f /var/www/html/application/vendor/autoload.php
            apache2ctl -t
            for ext in gd gmp mbstring pdo_mysql soap zip; do
              php -m | grep -qi "^${ext}$"
            done
          '

  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref_tag: ${{ steps.read_upstream_ref.outputs.ref_tag }}
      image_suffix: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image owner
        id: lowercase_owner
        shell: bash
        run: |
          set -euo pipefail
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          echo "OWNER_LC=${owner_lc}" >> "$GITHUB_ENV"
          echo "owner_lc=${owner_lc}" >> "$GITHUB_OUTPUT"

      - name: Read upstream ref
        id: read_upstream_ref
        shell: bash
        run: |
          set -euo pipefail
          repo="$(cat ops/grimguzzler-registration/source.repo 2>/dev/null || true)"
          if [[ -z "${repo}" ]]; then
            repo="https://github.com/RovxBot/WoWSimpleRegistration.git"
          fi
          ref="$(cat ops/grimguzzler-registration/source.ref 2>/dev/null || true)"
          if [[ -z "${ref}" ]]; then
            ref="master"
          fi
          ref_tag="$(echo "${ref}" | tr '/:@' '-' | tr -cd 'A-Za-z0-9._-')"
          repo_tag="$(echo "${repo}" | sed -E 's#^https?://##' | tr '/:@' '-' | tr -cd 'A-Za-z0-9._-')"
          repo_tag="${repo_tag,,}"
          {
            echo "UPSTREAM_REF=${ref}"
            echo "UPSTREAM_REPO=${repo}"
            echo "REF_TAG=${ref_tag,,}"
            echo "REPO_TAG=${repo_tag}"
            echo "BUILD_CACHE_REF=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/grimguzzler-registration:buildcache-${repo_tag}-${ref_tag,,}"
            echo "BUILD_CACHE_SCOPE=grimguzzler-registration-${repo_tag}-${ref_tag,,}"
          } >> "$GITHUB_ENV"
          {
            echo "ref_tag=${ref_tag,,}"
            echo "build_cache_ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/grimguzzler-registration:buildcache-${repo_tag}-${ref_tag,,}"
            echo "build_cache_scope=grimguzzler-registration-${repo_tag}-${ref_tag,,}"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare build context
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .work
          mkdir -p .work
          git clone --depth=1 --branch "${UPSTREAM_REF}" "${UPSTREAM_REPO}" .work/registration

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .work/registration
          file: ops/grimguzzler-registration/Dockerfile
          cache-from: |
            type=gha,scope=${{ steps.read_upstream_ref.outputs.build_cache_scope }}
            type=registry,ref=${{ steps.read_upstream_ref.outputs.build_cache_ref }}
          cache-to: |
            type=gha,scope=${{ steps.read_upstream_ref.outputs.build_cache_scope }},mode=max
            type=registry,ref=${{ steps.read_upstream_ref.outputs.build_cache_ref }},mode=max
          push: true
          tags: |
            ghcr.io/${{ steps.lowercase_owner.outputs.owner_lc }}/grimguzzler-registration:${{ steps.read_upstream_ref.outputs.ref_tag }}
            ghcr.io/${{ steps.lowercase_owner.outputs.owner_lc }}/grimguzzler-registration:${{ steps.read_upstream_ref.outputs.ref_tag }}-${{ github.sha }}

  smoke-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: read
    env:
      REF_TAG: ${{ needs.build.outputs.ref_tag }}
      IMAGE_SUFFIX: ${{ needs.build.outputs.image_suffix }}
    steps:
      - name: Lowercase image owner
        shell: bash
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull built image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "ghcr.io/${OWNER_LC}/grimguzzler-registration:${REF_TAG}-${IMAGE_SUFFIX}"

      - name: Smoke test image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER_LC}/grimguzzler-registration:${REF_TAG}-${IMAGE_SUFFIX}"
          docker run --rm --entrypoint /bin/sh "${image}" -c '
            set -eu
            test -f /var/www/html/index.php
            test -f /var/www/html/application/vendor/autoload.php
            apache2ctl -t
            for ext in gd gmp mbstring pdo_mysql soap zip; do
              php -m | grep -qi "^${ext}$"
            done
          '

  update-manifests-pr:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs:
      - build
      - smoke-test
    env:
      REF_TAG: ${{ needs.build.outputs.ref_tag }}
      IMAGE_SUFFIX: ${{ needs.build.outputs.image_suffix }}
      GH_TOKEN: ${{ secrets.WORKFLOW_PR_TOKEN || secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Update deployment image tag
        shell: bash
        run: |
          set -euo pipefail
          image_tag="${REF_TAG}-${IMAGE_SUFFIX}"
          sed -i -E "s#(ghcr\.io/.*/grimguzzler-registration:)[A-Za-z0-9._-]+#\\1${image_tag}#g" apps/grimguzzler-registration/deployment.yaml

      - name: Create pull request
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/grimguzzler-registration/deployment.yaml; then
            echo "No manifest changes detected."
            exit 0
          fi

          # Keep checkout credential-free while building/testing. Configure the
          # short-lived workflow token only for this reviewed branch/PR write.
          gh auth setup-git

          branch="ci/grimguzzler-registration-image-update-${REF_TAG}"
          short_sha="${IMAGE_SUFFIX::7}"
          title="Update Grim Guzzler registration image to ${REF_TAG}-${short_sha}"
          body="Built and pushed a fresh Grim Guzzler registration image to GHCR, then updated the deployed manifest for review."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${branch}" || true
          git checkout -B "${branch}"
          git add apps/grimguzzler-registration/deployment.yaml
          git commit -m "${title}"
          git push --force-with-lease --set-upstream origin "${branch}"

          pr_number="$(gh pr list --base main --head "${branch}" --state open --json number --jq '.[0].number // empty')"

          if [[ -n "${pr_number}" ]]; then
            gh pr edit "${pr_number}" \
              --title "${title}" \
              --body "${body}"
          else
            gh pr create \
              --base main \
              --head "${branch}" \
              --title "${title}" \
            --body "${body}"
          fi
