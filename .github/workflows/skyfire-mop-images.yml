name: Build SkyFire MoP images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      core_ref: ${{ steps.prepare.outputs.core_ref }}
      image_digest: ${{ steps.build-and-push.outputs.digest }}
      image_suffix: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image owner
        shell: bash
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Prepare pinned SkyFire source and database
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          source ops/mop-images/database.env
          core_repo="$(cat ops/mop-images/skyfire.repo)"
          core_ref="$(cat ops/mop-images/skyfire.ref)"
          playerbots_repo="$(cat ops/mop-images/mod-playerbots.repo)"
          playerbots_ref="$(cat ops/mop-images/mod-playerbots.ref)"
          ahbot_repo="$(cat ops/mop-images/mod-ahbot.repo)"
          ahbot_ref="$(cat ops/mop-images/mod-ahbot.ref)"
          for ref in "${core_ref}" "${playerbots_ref}" "${ahbot_ref}"; do
            [[ "${ref}" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid pinned Git ref: ${ref}" >&2; exit 1; }
          done
          rm -rf .work/skyfire .work/mod-playerbots .work/mod-ahbot .work/skyfire-db
          mkdir -p .work/skyfire .work/mod-playerbots .work/skyfire-db
          git -C .work/skyfire init
          git -C .work/skyfire remote add origin "${core_repo}"
          git -C .work/skyfire fetch --depth=1 origin "${core_ref}"
          git -C .work/skyfire checkout --detach FETCH_HEAD
          test "$(git -C .work/skyfire rev-parse HEAD)" = "${core_ref}"
          git -C .work/skyfire apply --ignore-space-change "$GITHUB_WORKSPACE/ops/mop-images/patches/skyfire-548-playerbots-hooks.patch"
          git -C .work/skyfire submodule update --init --recursive --depth=1
          git -C .work/mod-playerbots init
          git -C .work/mod-playerbots remote add origin "${playerbots_repo}"
          git -C .work/mod-playerbots fetch --depth=1 origin "${playerbots_ref}"
          git -C .work/mod-playerbots checkout --detach FETCH_HEAD
          test "$(git -C .work/mod-playerbots rev-parse HEAD)" = "${playerbots_ref}"
          git -C .work/mod-playerbots apply "$GITHUB_WORKSPACE/ops/mop-images/patches/mod-playerbots-skyfire-548.patch"
          rm -rf .work/skyfire/modules/mod-playerbots
          cp -a .work/mod-playerbots .work/skyfire/modules/mod-playerbots
          git clone --depth=1 "${ahbot_repo}" .work/mod-ahbot
          git -C .work/mod-ahbot fetch --depth=1 origin "${ahbot_ref}"
          git -C .work/mod-ahbot checkout --detach FETCH_HEAD
          test "$(git -C .work/mod-ahbot rev-parse HEAD)" = "${ahbot_ref}"
          git -C .work/mod-ahbot apply "$GITHUB_WORKSPACE/ops/mop-images/patches/mod-ahbot-skyfire-548.patch"
          cp -a .work/mod-ahbot .work/skyfire/modules/mod-ahbot
          curl --fail --silent --show-error --location --output .work/skyfire-db/release.zip "${SKYFIRE_DATABASE_URL}"
          echo "${SKYFIRE_DATABASE_SHA256}  .work/skyfire-db/release.zip" | sha256sum --check
          unzip -p .work/skyfire-db/release.zip "${SKYFIRE_DATABASE_ARCHIVE_MEMBER}" > .work/skyfire/sql/world_database.sql
          test -s .work/skyfire/sql/world_database.sql
          echo "core_ref=${core_ref}" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .work/skyfire
          file: ops/mop-images/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/skyfire-mop:core-${{ steps.prepare.outputs.core_ref }}
            ghcr.io/${{ env.OWNER_LC }}/skyfire-mop:core-${{ steps.prepare.outputs.core_ref }}-${{ github.sha }}

  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: read
    env:
      CORE_REF: ${{ needs.build.outputs.core_ref }}
      IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
      IMAGE_SUFFIX: ${{ needs.build.outputs.image_suffix }}
    steps:
      - name: Lowercase image owner
        shell: bash
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the immutable build image
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CORE_REF}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${IMAGE_SUFFIX}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "ghcr.io/${OWNER_LC}/skyfire-mop:core-${CORE_REF}-${IMAGE_SUFFIX}@${IMAGE_DIGEST}"

      - name: Smoke test authserver image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER_LC}/skyfire-mop:core-${CORE_REF}-${IMAGE_SUFFIX}@${IMAGE_DIGEST}"
          docker run --rm --entrypoint bash "${image}" -lc '
            set -euo pipefail
            binary=/opt/skyfire/bin/authserver
            test -x "$binary"
            ldd "$binary" >/tmp/authserver-ldd.txt
            if grep -Fq "not found" /tmp/authserver-ldd.txt; then
              cat /tmp/authserver-ldd.txt >&2
              exit 1
            fi
            "$binary" --version >/tmp/authserver-version.txt 2>&1 || \
            "$binary" -v >/tmp/authserver-version.txt 2>&1 || \
            "$binary" --help >/tmp/authserver-version.txt 2>&1 || true
            test -s /tmp/authserver-version.txt
          '

      - name: Smoke test worldserver image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER_LC}/skyfire-mop:core-${CORE_REF}-${IMAGE_SUFFIX}@${IMAGE_DIGEST}"
          docker run --rm --entrypoint bash "${image}" -lc '
            set -euo pipefail
            binary=/opt/skyfire/bin/worldserver
            test -x "$binary"
            test -s /opt/skyfire/sql/world_database.sql
            ldd "$binary" >/tmp/worldserver-ldd.txt
            if grep -Fq "not found" /tmp/worldserver-ldd.txt; then
              cat /tmp/worldserver-ldd.txt >&2
              exit 1
            fi
            "$binary" --version >/tmp/worldserver-version.txt 2>&1 || \
            "$binary" -v >/tmp/worldserver-version.txt 2>&1 || \
            "$binary" --help >/tmp/worldserver-version.txt 2>&1 || true
            test -s /tmp/worldserver-version.txt
          '

      - name: Smoke test extractor tools
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER_LC}/skyfire-mop:core-${CORE_REF}-${IMAGE_SUFFIX}@${IMAGE_DIGEST}"
          docker run --rm --entrypoint bash "${image}" -lc '
            set -euo pipefail
            for tool in mapextractor vmap4extractor vmap4assembler mmaps_generator; do
              test -x "/opt/skyfire/bin/${tool}"
              ldd "/opt/skyfire/bin/${tool}" >/tmp/tool-ldd.txt
              if grep -Fq "not found" /tmp/tool-ldd.txt; then
                cat /tmp/tool-ldd.txt >&2
                exit 1
              fi
            done
          '

  update-manifests-pr:
    runs-on: ubuntu-latest
    needs:
      - build
      - smoke-test
    env:
      CORE_REF: ${{ needs.build.outputs.core_ref }}
      IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
      IMAGE_SUFFIX: ${{ needs.build.outputs.image_suffix }}
      # Use a PAT/App token if configured so the PR triggers normal pull_request workflows.
      GH_TOKEN: ${{ secrets.WORKFLOW_PR_TOKEN || secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lowercase image owner
        shell: bash
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Update MoP image references
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CORE_REF}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${IMAGE_SUFFIX}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="ghcr.io/${OWNER_LC}/skyfire-mop:core-${CORE_REF}-${IMAGE_SUFFIX}@${IMAGE_DIGEST}"
          for manifest in \
            apps/mop/authserver-deployment.yaml \
            apps/mop/worldserver-deployment.yaml \
            apps/mop/client-extract-cronjob.yaml \
            apps/mop/client-db2-extract-cronjob.yaml; do
            sed -i -E "s#(image: )ghcr\\.io/[a-z0-9._-]+/skyfire-mop:[^@[:space:]]+(@sha256:[a-f0-9]{64})?#\\1${image}#g" "${manifest}"
          done

      - name: Create pull request
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/mop; then
            echo "No manifest changes detected."
            exit 0
          fi

          gh auth setup-git

          short_core_ref="${CORE_REF::12}"
          short_sha="${IMAGE_SUFFIX::7}"
          branch="ci/mop-image-update-${short_core_ref}-${short_sha}"
          title="Update MoP image to ${short_core_ref}-${short_sha}"
          body="Built and smoke-tested the pinned SkyFire MoP image, then updated its digest-pinned manifests for review."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${branch}" || true
          git checkout -B "${branch}"
          git add \
            apps/mop/authserver-deployment.yaml \
            apps/mop/worldserver-deployment.yaml \
            apps/mop/client-extract-cronjob.yaml \
            apps/mop/client-db2-extract-cronjob.yaml
          git commit -m "${title}"
          git push --force-with-lease --set-upstream origin "${branch}"

          pr_number="$(gh pr list --base main --head "${branch}" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "${pr_number}" ]]; then
            gh pr edit "${pr_number}" --title "${title}" --body "${body}"
          else
            gh pr create --base main --head "${branch}" --title "${title}" --body "${body}"
          fi
