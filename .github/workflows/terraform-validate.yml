name: Terraform Validate

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "terraform/oci-free-tier/**"
      - "terraform/oci-matrix-free-tier/**"
      - ".github/workflows/terraform-validate.yml"

permissions:
  contents: read

concurrency:
  group: terraform-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - oci-free-tier
          - oci-matrix-free-tier
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Terraform changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "$BASE_REF"
            range="$(git merge-base HEAD "origin/$BASE_REF")...HEAD"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            range="$BEFORE_SHA...HEAD"
          else
            range="$(git rev-list --max-parents=0 HEAD | tail -n 1)...HEAD"
          fi

          changed_files="$(git diff --name-only "$range")"
          printf 'Changed files in %s:\n%s\n' "$range" "$changed_files"

          if echo "$changed_files" | grep -Eq '(^terraform/(oci-free-tier|oci-matrix-free-tier)/|^\.github/workflows/terraform-validate\.yml$)'; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip when Terraform files are unchanged
        if: steps.changes.outputs.should_run != 'true'
        shell: bash
        run: echo "No Terraform root changes detected; validation is not needed."

      - name: Setup Terraform
        if: steps.changes.outputs.should_run == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4

      - name: Check Terraform formatting
        if: steps.changes.outputs.should_run == 'true'
        run: terraform -chdir="terraform/${{ matrix.stack }}" fmt -check -diff -recursive

      - name: Terraform init
        if: steps.changes.outputs.should_run == 'true'
        run: terraform -chdir="terraform/${{ matrix.stack }}" init -backend=false

      - name: Terraform validate
        if: steps.changes.outputs.should_run == 'true'
        run: terraform -chdir="terraform/${{ matrix.stack }}" validate

      - name: Setup TFLint
        if: steps.changes.outputs.should_run == 'true'
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6

      - name: Init TFLint
        if: steps.changes.outputs.should_run == 'true'
        run: |
          cd "terraform/${{ matrix.stack }}"
          tflint --init

      - name: Run TFLint
        if: steps.changes.outputs.should_run == 'true'
        run: |
          cd "terraform/${{ matrix.stack }}"
          tflint --recursive

  validate-required:
    # Branch protection requires this stable name. The matrix above expands to
    # `validate (oci-free-tier)` and `validate (oci-matrix-free-tier)`, neither
    # of which can satisfy a required check named simply `validate`.
    name: validate
    if: always()
    needs:
      - validate
    runs-on: ubuntu-latest
    steps:
      - name: Require all Terraform validation jobs to succeed
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATE_RESULT" = "success"
