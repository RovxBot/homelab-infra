name: Terraform Validate

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "terraform/oci-free-tier/**"
      - ".github/workflows/terraform-validate.yml"

permissions:
  contents: read

concurrency:
  group: terraform-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: terraform/oci-free-tier
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Terraform changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "$BASE_REF"
            range="$(git merge-base HEAD "origin/$BASE_REF")...HEAD"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            range="$BEFORE_SHA...HEAD"
          else
            range="$(git rev-list --max-parents=0 HEAD | tail -n 1)...HEAD"
          fi

          changed_files="$(git diff --name-only "$range")"
          printf 'Changed files in %s:\n%s\n' "$range" "$changed_files"

          if echo "$changed_files" | grep -Eq '(^terraform/oci-free-tier/|^\.github/workflows/terraform-validate\.yml$)'; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip when Terraform files are unchanged
        if: steps.changes.outputs.should_run != 'true'
        shell: bash
        run: echo "No Terraform OCI Free Tier changes detected; validation is not needed."

      - name: Setup Terraform
        if: steps.changes.outputs.should_run == 'true'
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        if: steps.changes.outputs.should_run == 'true'
        run: terraform fmt -check -diff -recursive

      - name: Terraform init
        if: steps.changes.outputs.should_run == 'true'
        run: terraform init -backend=false

      - name: Terraform validate
        if: steps.changes.outputs.should_run == 'true'
        run: terraform validate

      - name: Setup TFLint
        if: steps.changes.outputs.should_run == 'true'
        uses: terraform-linters/setup-tflint@v4

      - name: Init TFLint
        if: steps.changes.outputs.should_run == 'true'
        run: tflint --init

      - name: Run TFLint
        if: steps.changes.outputs.should_run == 'true'
        run: tflint --recursive
