name: Terraform OCI Free Tier

on:
  push:
    branches:
      - main
    paths:
      - "terraform/oci-free-tier/**"
      - ".github/workflows/terraform-oci-free-tier.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
      target:
        description: "Optional single Terraform resource address for a reviewed targeted plan/apply"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-oci-free-tier-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: terraform/oci-free-tier
  TFC_ORGANIZATION: Cooked
  TFC_PROJECT: K8s
  TFC_WORKSPACE: homelab-oci-free-tier
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_app_terraform_io }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      should_apply: ${{ steps.mode.outputs.should_apply }}
      target: ${{ steps.mode.outputs.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4

      - name: Install SOPS tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y age
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64 -o /tmp/sops
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops

      - name: Select mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_ACTION: ${{ github.event.inputs.action }}
          REQUESTED_TARGET: ${{ github.event.inputs.target }}
        run: |
          set -euo pipefail
          target=""
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_ACTION" == "apply" ]]; then
            echo "should_apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_apply=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            target="$REQUESTED_TARGET"
          fi
          if [[ "$target" == *$'\n'* || "$target" == *$'\r'* ]]; then
            echo "Terraform target must be a single resource address." >&2
            exit 1
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Check required secrets
        shell: bash
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_app_terraform_io }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          test -n "$TF_TOKEN_app_terraform_io"
          if [[ -f "$TF_WORKING_DIR/wireguard-peer-config.enc.yaml" ]]; then
            test -n "$SOPS_AGE_KEY"
          fi

      - name: Materialize Terraform secret vars
        shell: bash
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          if [[ ! -f "$TF_WORKING_DIR/wireguard-peer-config.enc.yaml" ]]; then
            exit 0
          fi
          export SOPS_AGE_KEY_FILE
          SOPS_AGE_KEY_FILE="$(mktemp)"
          trap 'rm -f "$SOPS_AGE_KEY_FILE"' EXIT
          printf '%s\n' "$SOPS_AGE_KEY" > "$SOPS_AGE_KEY_FILE"
          python3 "$TF_WORKING_DIR/materialize_terraform_secret_vars.py" \
            --input "$TF_WORKING_DIR/wireguard-peer-config.enc.yaml" \
            --output "$TF_WORKING_DIR/wireguard.secrets.auto.tfvars.json"

      - name: Materialize Terraform Cloud config
        shell: bash
        run: |
          set -euo pipefail
          cat > "$TF_WORKING_DIR/terraform.cloud.tf" <<EOF
          terraform {
            cloud {
              organization = "${TFC_ORGANIZATION}"
              workspaces {
                project = "${TFC_PROJECT}"
                name    = "${TFC_WORKSPACE}"
              }
            }
          }
          EOF

      - name: Terraform init
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="$TF_WORKING_DIR" init

      - name: Terraform validate
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="$TF_WORKING_DIR" validate

      - name: Terraform plan
        shell: bash
        env:
          TF_TARGET: ${{ steps.mode.outputs.target }}
        run: |
          set -euo pipefail
          target_args=()
          if [[ -n "$TF_TARGET" ]]; then
            target_args+=("-target=$TF_TARGET")
          fi
          terraform -chdir="$TF_WORKING_DIR" plan "${target_args[@]}" -out=tfplan -var-file=wireguard.secrets.auto.tfvars.json

  apply:
    if: needs.plan.outputs.should_apply == 'true'
    needs: plan
    runs-on: ubuntu-latest
    environment: oci-free-tier
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4

      - name: Install SOPS tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y age
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64 -o /tmp/sops
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops

      - name: Check required secrets
        shell: bash
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_app_terraform_io }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          test -n "$TF_TOKEN_app_terraform_io"
          if [[ -f "$TF_WORKING_DIR/wireguard-peer-config.enc.yaml" ]]; then
            test -n "$SOPS_AGE_KEY"
          fi

      - name: Materialize Terraform secret vars
        shell: bash
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          if [[ ! -f "$TF_WORKING_DIR/wireguard-peer-config.enc.yaml" ]]; then
            exit 0
          fi
          export SOPS_AGE_KEY_FILE
          SOPS_AGE_KEY_FILE="$(mktemp)"
          trap 'rm -f "$SOPS_AGE_KEY_FILE"' EXIT
          printf '%s\n' "$SOPS_AGE_KEY" > "$SOPS_AGE_KEY_FILE"
          python3 "$TF_WORKING_DIR/materialize_terraform_secret_vars.py" \
            --input "$TF_WORKING_DIR/wireguard-peer-config.enc.yaml" \
            --output "$TF_WORKING_DIR/wireguard.secrets.auto.tfvars.json"

      - name: Materialize Terraform Cloud config
        shell: bash
        run: |
          set -euo pipefail
          cat > "$TF_WORKING_DIR/terraform.cloud.tf" <<EOF
          terraform {
            cloud {
              organization = "${TFC_ORGANIZATION}"
              workspaces {
                project = "${TFC_PROJECT}"
                name    = "${TFC_WORKSPACE}"
              }
            }
          }
          EOF

      - name: Terraform init
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="$TF_WORKING_DIR" init

      # Terraform plans can include the WireGuard peer configuration and
      # generated Matrix credentials. Keep this binary plan on the approved
      # ephemeral runner only; never upload it as a GitHub Actions artifact.
      - name: Terraform plan for approved apply
        shell: bash
        env:
          TF_TARGET: ${{ needs.plan.outputs.target }}
        run: |
          set -euo pipefail
          target_args=()
          if [[ -n "$TF_TARGET" ]]; then
            target_args+=("-target=$TF_TARGET")
          fi
          terraform -chdir="$TF_WORKING_DIR" plan "${target_args[@]}" -out=tfplan -var-file=wireguard.secrets.auto.tfvars.json

      - name: Terraform apply
        shell: bash
        run: |
          set -euo pipefail
          test -f "$TF_WORKING_DIR/tfplan"
          terraform -chdir="$TF_WORKING_DIR" apply -auto-approve tfplan
