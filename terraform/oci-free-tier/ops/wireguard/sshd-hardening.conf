# Conservative SSH server hardening for the OCI edge.
#
# Install as /etc/ssh/sshd_config.d/99-homelab-hardening.conf, validate with
# `sshd -t`, then reload ssh. This deliberately does not use AllowUsers: the
# current VPS has both the ubuntu and opc administrative accounts.

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
HostbasedAuthentication no
IgnoreRhosts yes
X11Forwarding no
AllowAgentForwarding no
PermitUserEnvironment no
GatewayPorts no
PermitTunnel no

LoginGraceTime 30
MaxAuthTries 3
MaxSessions 3
MaxStartups 10:30:60
ClientAliveInterval 300
ClientAliveCountMax 2
