owner: RovxBot
repo: homelab-infra
user-agent: RovxBot
skipDeleteIssues: true
skipDescriptionUpdate: true
skipTopicsUpdate: true
skipHomepageUpdate: true

sites:
  # Start with the verified public endpoints only. Add assets, jellyfin, and
  # immich after confirming GitHub-hosted runners can reach them reliably.
  - name: Homepage
    url: https://homepage.cooked.beer
    type: globalping
    location: sydney
    headers:
      - "Cf-Access-Client-Id: $CF_ACCESS_CLIENT_ID"
      - "Cf-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"
  - name: Vaultwarden
    url: https://vault.cooked.beer
